on:
  release:
    types: [published]

name: Release Notes

jobs:
  install-footer:
    name: Append install footer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add Flatpak remote install instructions to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          # Skip if the install footer is already present (e.g. on re-publish).
          if printf '%s' "$BODY" | grep -qF 'dev.maciz.sessionschronicle.flatpakref'; then
            echo "Install footer already present; nothing to do."
            exit 0
          fi

          {
            printf '%s\n\n' "$BODY"
            printf -- '---\n\n'
            printf '## Install\n\n'
            printf 'Install from the signed Flatpak remote (recommended):\n\n'
            printf '```bash\n'
            printf 'flatpak install --user https://sessions-chronicle.maciz.dev/flatpak/dev.maciz.sessionschronicle.flatpakref\n'
            printf '```\n'
          } > notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md