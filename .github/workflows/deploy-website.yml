name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync Flatpak repository payload
        run: |
          rm -rf website/public/flatpak
          mkdir -p website/public/flatpak

          # The flatpak-repo-data branch is the source of truth for /flatpak/.
          # It is created and updated by flatpak-repository.yml on release.
          # Fail loudly rather than deploy a placeholder that would overwrite
          # the live repository content on Pages.
          if ! git fetch --depth=1 origin flatpak-repo-data; then
            echo "::error::flatpak-repo-data branch is missing; refusing to deploy without Flatpak repo payload"
            exit 1
          fi

          git archive origin/flatpak-repo-data | tar -x -C website/public/flatpak

          touch website/public/.nojekyll
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
