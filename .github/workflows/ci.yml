on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: dnf install -y gcc pkg-config gtk4-devel libadwaita-devel glib2-devel gtksourceview5-devel rust cargo git xorg-x11-server-Xvfb
      - name: Run cargo test
        run: xvfb-run cargo test --all --no-fail-fast

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: dnf install -y gcc pkg-config gtk4-devel libadwaita-devel glib2-devel gtksourceview5-devel rust cargo clippy
      - name: Run cargo clippy
        run: cargo clippy --all -- -D warnings

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: dnf install -y cargo rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: dnf install -y gcc pkg-config gtk4-devel libadwaita-devel glib2-devel gtksourceview5-devel curl git gnupg2 xorg-x11-server-Xvfb
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-
      - name: Cache LLVM coverage data
        uses: actions/cache@v5
        with:
          path: target/llvm-cov-target/
          key: ${{ runner.os }}-llvm-cov-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-llvm-cov-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-llvm-cov-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: xvfb-run cargo llvm-cov --lcov --output-path lcov.info --no-clean
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sessions-chronicle.flatpak
          manifest-path: build-aux/io.github.supermaciz.sessionschronicle.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
