<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="font-family: -apple-system, Cantarell, sans-serif;">
  <!-- Window frame -->
  <rect width="1000" height="700" fill="#f6f5f4" rx="12"/>

  <!-- Header Bar -->
  <rect width="1000" height="46" fill="#ffffff" rx="12"/>
  <rect y="12" width="1000" height="34" fill="#ffffff"/>

  <!-- View switcher -->
  <rect x="370" y="8" width="90" height="30" fill="#3584e4" rx="6"/>
  <text x="390" y="28" font-size="12" font-weight="600" fill="#ffffff">Sessions</text>
  <rect x="465" y="8" width="80" height="30" fill="#e8e6e3" rx="6"/>
  <text x="478" y="28" font-size="12" fill="#636260">Analytics</text>

  <!-- Main area -->
  <rect x="20" y="54" width="960" height="638" fill="#ffffff" rx="8"/>

  <!-- === TIMELINE HEADER === -->
  <!-- Date axis -->
  <text x="36" y="80" font-size="11" font-weight="600" fill="#77767b">PROJECT TIMELINE</text>

  <!-- Date labels -->
  <text x="160" y="80" font-size="10" fill="#9a9996">Mar 8</text>
  <text x="290" y="80" font-size="10" fill="#9a9996">Mar 9</text>
  <text x="420" y="80" font-size="10" fill="#9a9996">Mar 10</text>
  <text x="550" y="80" font-size="10" fill="#9a9996">Mar 11</text>
  <text x="680" y="80" font-size="10" fill="#9a9996">Mar 12</text>
  <text x="810" y="80" font-size="10" fill="#9a9996">Mar 13</text>
  <text x="920" y="80" font-size="10" font-weight="600" fill="#3584e4">Today</text>

  <!-- Grid lines -->
  <line x1="160" y1="88" x2="160" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="290" y1="88" x2="290" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="420" y1="88" x2="420" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="88" x2="550" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="680" y1="88" x2="680" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="810" y1="88" x2="810" y2="580" stroke="#f0eeec" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === PROJECT SWIM LANES === -->

  <!-- Lane 1: sessions-chronicle -->
  <rect x="32" y="96" width="110" height="100" fill="#f6f5f4" rx="6"/>
  <text x="42" y="118" font-size="12" font-weight="700" fill="#1c1c1c">sessions-</text>
  <text x="42" y="132" font-size="12" font-weight="700" fill="#1c1c1c">chronicle</text>
  <text x="42" y="152" font-size="10" fill="#77767b">18 sessions</text>
  <text x="42" y="166" font-size="10" fill="#77767b">482 messages</text>
  <rect x="42" y="176" width="8" height="8" fill="#3584e4" rx="2"/>
  <rect x="54" y="176" width="8" height="8" fill="#26a269" rx="2"/>
  <rect x="66" y="176" width="8" height="8" fill="#e66100" rx="2"/>

  <!-- Session bubbles on timeline -->
  <!-- Day Mar 8 -->
  <circle cx="190" cy="130" r="12" fill="#3584e4" opacity="0.8"/>
  <text x="185" y="134" font-size="9" fill="#ffffff" font-weight="600">34</text>
  <circle cx="190" cy="160" r="8" fill="#26a269" opacity="0.8"/>
  <text x="186" y="164" font-size="8" fill="#ffffff">12</text>
  <!-- Day Mar 9 -->
  <circle cx="320" cy="135" r="10" fill="#3584e4" opacity="0.8"/>
  <text x="316" y="139" font-size="8" fill="#ffffff">18</text>
