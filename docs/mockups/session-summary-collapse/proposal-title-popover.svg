      <text class="small text" x="170" y="277" font-size="11" fill="#1f1f1f">Output 8.1k</text>
      <text class="small text" x="20" y="297" font-size="11" fill="#1f1f1f">Cache 102k</text>
      <text class="small text" x="170" y="297" font-size="11" fill="#1f1f1f">Reasoning 3.2k</text>

