      <text class="small" x="28" y="32" font-size="11">User</text>
      <text class="small dim" x="28" y="47" font-size="11" fill="#8a8a8e">collapse the SessionDetail summary_box…</text>

      <rect class="card" x="16" y="66" width="640" height="60" rx="8" fill="#ffffff" stroke="#e3e3e5" stroke-width="1"></rect>
      <text class="small" x="28" y="84" font-size="11">Assistant</text>
      <text class="small dim" x="28" y="100" font-size="11" fill="#8a8a8e">No banner, no bar, no Revealer — the reduced state is</text>
      <text class="small dim" x="28" y="116" font-size="11" fill="#8a8a8e">just the header bar the window already owns.</text>

