      <text class="small dim" x="28" y="223" font-size="11" fill="#8a8a8e">zero scroll machinery — ship it.</text>

      <rect class="card" x="16" y="242" width="640" height="44" rx="8" fill="#ffffff" stroke="#e3e3e5" stroke-width="1"></rect>
      <text class="small dim" x="28" y="268" font-size="11" fill="#8a8a8e">… the conversation owns every pixel; the summary is disclosure …</text>

