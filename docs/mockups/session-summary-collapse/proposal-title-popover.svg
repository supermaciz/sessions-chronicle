  <text class="small dim" x="24" y="974" font-size="11" fill="#8a8a8e">Reduced state = header (status dot · project · assistant · meta), 0 px vertical tax. Full summary = GtkPopover from the AdwWindowTitle MenuButton. No scroll logic, no reflow, no occlusion. Re-show: click title · F9.</text>
