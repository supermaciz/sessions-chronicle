  <text class="small dim" x="24" y="974" font-size="11" fill="#8a8a8e">Summary re-hosted in the existing inspector OverlaySplitView. Zero vadjustment / hysteresis / reflow. Re-show via the toggle + F9 already in place. Wide = split (no occlusion); &lt; 860 sp = overlay.</text>
