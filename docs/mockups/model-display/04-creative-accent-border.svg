<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520">
  <defs>
    <style>
      .bg { fill: #242424; }
      .card { fill: #303030; rx: 8; ry: 8; }
      .card-stroke { stroke: #404040; stroke-width: 1; fill: none; rx: 8; ry: 8; }
      .border-user { fill: #3584e4; }
      .role-assistant { font-family: Cantarell, sans-serif; font-size: 11px; font-weight: 700; }
      .role-user { fill: #3584e4; font-family: Cantarell, sans-serif; font-size: 11px; font-weight: 700; }
      .timestamp { fill: #888888; font-family: Cantarell, sans-serif; font-size: 10px; }
      .content { fill: #deddda; font-family: Cantarell, sans-serif; font-size: 13px; }
      .content-dim { fill: #9a9996; font-family: Cantarell, sans-serif; font-size: 13px; }
      .title { fill: #ffffff; font-family: Cantarell, sans-serif; font-size: 14px; font-weight: 700; }
      .subtitle { fill: #9a9996; font-family: Cantarell, sans-serif; font-size: 11px; }
      .model-inline { font-family: monospace; font-size: 9px; }
      .annotation { fill: #f66151; font-family: Cantarell, sans-serif; font-size: 10px; font-style: italic; }
      .annotation-line { stroke: #f66151; stroke-width: 1; stroke-dasharray: 4,3; }
      .model-caption { fill: #888888; font-family: Cantarell, sans-serif; font-size: 10px; }
      .legend-text { fill: #deddda; font-family: Cantarell, sans-serif; font-size: 11px; }

      /* Provider-specific border colors */
      .border-claude { fill: #26a269; }
      .border-openai { fill: #a378f2; }
      .border-mistral { fill: #e66100; }

      /* Popover styles */
      .popover-bg { fill: #1a1a1a; stroke: #555555; stroke-width: 1; rx: 8; ry: 8; }
      .popover-label { fill: #9a9996; font-family: Cantarell, sans-serif; font-size: 10px; }
      .popover-value { fill: #ffffff; font-family: monospace; font-size: 11px; }
      .popover-arrow { fill: #1a1a1a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" class="bg"/>

  <!-- Title -->
  <text x="24" y="28" class="title">Proposition 4 : Bordure semantique + popover detail (Creative)</text>
  <text x="24" y="44" class="subtitle">Bordure gauche coloree par provider + modele court dans header + popover au clic</text>

  <!-- == Row 1: Claude (green border, wider) == -->
  <rect x="16" y="60" width="648" height="90" class="card"/>
  <rect x="16" y="60" width="648" height="90" class="card-stroke"/>
  <!-- Thicker provider-colored border -->
  <rect x="16" y="60" width="4" height="90" class="border-claude" rx="2"/>

  <text x="34" y="82" class="role-assistant" fill="#26a269">ASSISTANT</text>
  <text x="108" y="82" class="model-inline" fill="#57e389">sonnet-4-5</text>
  <text x="580" y="82" class="timestamp">14:32:05</text>

  <text x="34" y="108" class="content">Voici une analyse du code source. Le module</text>
  <text x="34" y="126" class="content">principal utilise un pattern factory...</text>

  <!-- Annotation for border -->
  <line x1="14" y1="105" x2="6" y2="105" class="annotation-line"/>
  <text x="2" y="120" class="annotation" transform="rotate(-90, 6, 120)">provider color</text>

  <!-- Annotation for model inline -->
  <line x1="130" y1="68" x2="130" y2="60" class="annotation-line"/>
  <text x="88" y="58" class="annotation">modele court, monospace</text>

  <!-- == Row 2: OpenAI (purple border) == -->
  <rect x="16" y="165" width="648" height="90" class="card"/>
  <rect x="16" y="165" width="648" height="90" class="card-stroke"/>
  <rect x="16" y="165" width="4" height="90" class="border-openai" rx="2"/>

  <text x="34" y="187" class="role-assistant" fill="#a378f2">ASSISTANT</text>
  <text x="108" y="187" class="model-inline" fill="#c8a8ff">o3-mini</text>
  <text x="580" y="187" class="timestamp">15:10:33</text>

  <text x="34" y="213" class="content">I've analyzed the codebase and found the</text>
  <text x="34" y="231" class="content">following issues with the implementation...</text>

  <!-- == Row 3: Mistral (orange border) with popover shown == -->
  <rect x="16" y="270" width="648" height="90" class="card"/>
  <rect x="16" y="270" width="648" height="90" class="card-stroke"/>
  <rect x="16" y="270" width="4" height="90" class="border-mistral" rx="2"/>

  <text x="34" y="292" class="role-assistant" fill="#e66100">ASSISTANT</text>
  <!-- Model text with "clickable" appearance -->
  <rect x="104" y="280" width="80" height="16" rx="3" ry="3" fill="rgba(230,97,0,0.15)"/>
  <text x="108" y="292" class="model-inline" fill="#ff9e3d">mistral-large</text>
  <text x="580" y="292" class="timestamp">16:05:12</text>

  <text x="34" y="318" class="content">Voici les resultats de l'analyse. Le code</text>
  <text x="34" y="336" class="content">semble bien structure...</text>

  <!-- Popover (shown on click of model) -->
  <polygon points="140,277 146,270 134,270" class="popover-arrow" stroke="#555555" stroke-width="1"/>
  <rect x="60" y="195" width="230" height="76" class="popover-bg"/>
  <rect x="131" y="269" width="18" height="3" fill="#1a1a1a"/>

  <text x="76" y="215" class="popover-label">Modele complet</text>
  <text x="76" y="232" class="popover-value">mistral-large-latest</text>
  <text x="76" y="250" class="popover-label">Provider</text>
  <text x="76" y="264" class="popover-value">Mistral AI</text>

  <!-- Annotation for popover -->
  <line x1="292" y1="235" x2="310" y2="235" class="annotation-line"/>
  <text x="314" y="239" class="annotation">GtkPopover au clic</text>

  <!-- == User row (neutral blue border, no model) == -->
  <rect x="16" y="378" width="648" height="60" class="card"/>
  <rect x="16" y="378" width="648" height="60" class="card-stroke"/>
  <rect x="16" y="378" width="3" height="60" class="border-user" rx="2"/>
  <text x="34" y="400" class="role-user">USER</text>
  <text x="580" y="400" class="timestamp">16:04:50</text>
  <text x="34" y="422" class="content">Analyse ce fichier et dis-moi ce que fait parse_session.</text>

  <!-- Legend -->
  <rect x="16" y="455" width="648" height="55" rx="6" ry="6" fill="#2a2a2a" stroke="#404040" stroke-width="1"/>
  <text x="32" y="474" class="legend-text">Encodage visuel a 3 niveaux :</text>
  <text x="32" y="494" class="model-caption">1. Bordure gauche = couleur provider  |  2. Texte monospace court = nom modele  |  3. Popover au clic = details complets</text>
  <text x="32" y="506" class="model-caption">La couleur du role ASSISTANT change aussi selon le provider pour renforcer la coherence visuelle</text>
</svg>