<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; fill: #ffffff; }
      .label { font-size: 11px; fill: #999999; font-style: italic; }
      .heading { font-size: 14px; font-weight: bold; }
      .subtext { font-size: 11px; fill: #aaaaaa; }
      .dim { fill: #888888; }
      .accent { fill: #3584e4; }
      .star-active { fill: #f6d32d; stroke: #f6d32d; stroke-width: 1; }
      .star-inactive { fill: none; stroke: #666666; stroke-width: 1.2; }
      .widget-label { font-size: 9px; fill: #78aeed; font-family: monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#1e1e1e" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="46" fill="#303030" rx="12"/>
  <rect x="0" y="24" width="800" height="22" fill="#303030"/>
  <text x="400" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Sessions Chronicle</text>
  <circle cx="24" cy="23" r="6" fill="#555555"/>
  <circle cx="44" cy="23" r="6" fill="#555555"/>
  <circle cx="64" cy="23" r="6" fill="#555555"/>

  <!-- View switcher tabs -->
  <rect x="310" y="6" width="80" height="28" rx="6" fill="#3584e4" opacity="0.3"/>
  <text x="350" y="24" text-anchor="middle" font-size="11" fill="#ffffff">Sessions</text>
  <text x="450" y="24" text-anchor="middle" font-size="11" fill="#888888">Analytics</text>

  <!-- Sidebar -->
  <rect x="0" y="46" width="200" height="474" fill="#242424"/>
  <text x="16" y="74" class="heading" font-size="13">Filters</text>
  <rect x="12" y="82" width="176" height="1" fill="#444444"/>

  <text x="16" y="106" font-size="12" fill="#cccccc">AI Assistants</text>
  <rect x="20" y="114" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="40" y="125" font-size="11" fill="#cccccc">Claude Code</text>
  <rect x="20" y="134" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="40" y="145" font-size="11" fill="#cccccc">OpenCode</text>
  <rect x="20" y="154" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="40" y="165" font-size="11" fill="#cccccc">Codex</text>
  <rect x="20" y="174" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="40" y="185" font-size="11" fill="#cccccc">Mistral Vibe</text>

  <rect x="12" y="198" width="176" height="1" fill="#444444"/>
  <text x="16" y="220" font-size="12" fill="#cccccc">Projects</text>

  <!-- Projects list - no favorites filter here -->
  <rect x="8" y="230" width="184" height="28" rx="4" fill="#3584e4" opacity="0.12"/>
  <text x="24" y="249" font-size="11" fill="#ffffff">All Sessions</text>
  <text x="24" y="271" font-size="11" fill="#888888">sessions-chronicle</text>
  <text x="24" y="291" font-size="11" fill="#888888">my-rust-project</text>

  <!-- Vertical divider -->
  <rect x="200" y="46" width="1" height="474" fill="#333333"/>

  <!-- Search bar area -->
  <rect x="201" y="46" width="599" height="40" fill="#2a2a2a"/>
  <rect x="216" y="54" width="280" height="26" rx="6" fill="#383838"/>
  <text x="232" y="72" font-size="11" fill="#666666">Search sessions...</text>

  <!-- Favorites toggle button in header bar -->
  <rect x="510" y="54" width="28" height="26" rx="6" fill="#3584e4" opacity="0.25"/>
  <polygon points="524,60 526,66 532,66 527,69.5 529,75 524,72 519,75 521,69.5 516,66 522,66" class="star-active" transform="scale(0.65) translate(265,14)"/>
  <text x="510" y="90" class="widget-label">gtk::ToggleButton</text>
  <text x="510" y="100" class="widget-label">(starred-symbolic)</text>

  <!-- Session list area -->
  <rect x="201" y="106" width="380" height="414" fill="#1e1e1e"/>

  <!-- FAVORITES SECTION HEADER (only visible when favorites exist AND toggle is active) -->
  <text x="220" y="124" font-size="10" fill="#f6d32d" font-weight="bold" letter-spacing="0.5">FAVORITES</text>
  <rect x="280" y="116" width="290" height="1" fill="#444444"/>

  <!-- SESSION ROW 1: Favorited -->
  <rect x="212" y="132" width="358" height="58" rx="8" fill="#2c2c2c"/>
  <circle cx="232" cy="161" r="8" fill="#3584e4" opacity="0.4"/>
  <text x="248" y="155" font-size="12" fill="#ffffff">Fix the parser edge case</text>
  <text x="248" y="169" font-size="10" fill="#888888">sessions-chronicle . 12 messages . 2h ago</text>
  <text x="550" y="163" font-size="14" fill="#555555">&gt;</text>

  <!-- SESSION ROW 2: Favorited -->
  <rect x="212" y="196" width="358" height="58" rx="8" fill="#2c2c2c"/>
  <circle cx="232" cy="225" r="8" fill="#26a269" opacity="0.4"/>
  <text x="248" y="219" font-size="12" fill="#ffffff">Add retry logic to HTTP client</text>
  <text x="248" y="233" font-size="10" fill="#888888">my-rust-project . 8 messages . 1d ago</text>
  <text x="550" y="227" font-size="14" fill="#555555">&gt;</text>

  <!-- RECENT SECTION HEADER -->
  <text x="220" y="278" font-size="10" fill="#888888" font-weight="bold" letter-spacing="0.5">RECENT</text>
  <rect x="264" y="270" width="306" height="1" fill="#444444"/>

  <!-- SESSION ROW 3: Not favorited -->
  <rect x="212" y="286" width="358" height="58" rx="8" fill="#2c2c2c"/>
  <circle cx="232" cy="315" r="8" fill="#3584e4" opacity="0.4"/>
  <text x="248" y="309" font-size="12" fill="#ffffff">Debug failing CI pipeline</text>
  <text x="248" y="323" font-size="10" fill="#888888">sessions-chronicle . 5 messages . 30m ago</text>
  <text x="550" y="317" font-size="14" fill="#555555">&gt;</text>

  <!-- SESSION ROW 4: Not favorited -->
  <rect x="212" y="350" width="358" height="58" rx="8" fill="#2c2c2c"/>
  <circle cx="232" cy="379" r="8" fill="#e66100" opacity="0.4"/>
  <text x="248" y="373" font-size="12" fill="#ffffff">Refactor database module</text>
  <text x="248" y="387" font-size="10" fill="#888888">my-rust-project . 22 messages . 3d ago</text>
  <text x="550" y="381" font-size="14" fill="#555555">&gt;</text>

  <!-- Context menu annotation -->
  <rect x="350" y="420" width="180" height="68" rx="6" fill="#383838" stroke="#555555" stroke-width="1"/>
  <text x="366" y="440" font-size="11" fill="#ffffff">Add to Favorites</text>
  <rect x="356" y="447" width="166" height="1" fill="#444444"/>
  <text x="366" y="465" font-size="11" fill="#ffffff">Resume in Terminal</text>
  <text x="366" y="485" class="widget-label">gtk::PopoverMenu (right-click)</text>

  <!-- Arrow from context menu to row -->
  <line x1="390" y1="420" x2="370" y2="395" stroke="#78aeed" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="600" y="106" width="190" height="200" rx="8" fill="#2a2a2a" stroke="#444444" stroke-width="1"/>
  <text x="612" y="126" font-size="11" font-weight="bold" fill="#cccccc">Proposal B: Section Split</text>
  <rect x="608" y="132" width="174" height="1" fill="#444444"/>
  <text x="612" y="150" font-size="10" fill="#aaaaaa">Mark: right-click context</text>
  <text x="612" y="164" font-size="10" fill="#aaaaaa">menu only (no inline star)</text>
  <text x="612" y="184" font-size="10" fill="#aaaaaa">Surface: header-bar toggle</text>
  <text x="612" y="198" font-size="10" fill="#aaaaaa">splits list into sections</text>
  <text x="612" y="218" font-size="10" fill="#aaaaaa">Keyboard: Ctrl+D to toggle</text>
  <text x="612" y="232" font-size="10" fill="#aaaaaa">on selected row</text>
  <text x="612" y="252" font-size="10" fill="#aaaaaa">DB: sessions.is_favorite</text>
  <text x="612" y="266" font-size="10" fill="#aaaaaa">(INTEGER DEFAULT 0)</text>
  <text x="612" y="286" font-size="10" fill="#aaaaaa">Toggle OFF: flat list, no</text>
  <text x="612" y="300" font-size="10" fill="#aaaaaa">sections (current behavior)</text>
</svg>