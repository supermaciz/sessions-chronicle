<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="-apple-system, 'Cantarell', system-ui, sans-serif" font-size="13">
  <style>
    .stroke { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
    .stroke-thin { fill: none; stroke: #1a1a1a; stroke-width: 1; }
    .muted { fill: #777; }
    .accent { fill: #3584e4; }
    .accent-stroke { fill: none; stroke: #3584e4; stroke-width: 1.6; }
    .accent-bg { fill: #3584e4; fill-opacity: 0.12; }
    .red { fill: #c01c28; }
    .red-stroke { fill: none; stroke: #c01c28; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .badge { font-size: 11px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #c01c28; font-style: italic; }
    .row-text { font-size: 12.5px; fill: #1a1a1a; }
    .ws { fill: #ffffff; }
  </style>

  <!-- ===== Title bar ===== -->
  <text x="20" y="28" class="title">Proposal A — Sort pill in the header bar (GNOME HIG)</text>
  <text x="20" y="46" class="muted" font-size="12">Same mechanics as DatePill · criteria + order in one popover · non-default sort is readable when closed</text>

  <!-- ===== App window ===== -->
  <rect x="20" y="70" width="940" height="560" rx="10" class="ws stroke" />

  <!-- Header bar -->
  <rect x="20" y="70" width="940" height="48" fill="#f0f0f0" />
  <line x1="20" y1="118" x2="960" y2="118" class="stroke-thin" />

  <!-- Back button -->
  <circle cx="44" cy="94" r="12" class="stroke-thin" />
  <text x="44" y="99" class="label" text-anchor="middle">&lt;</text>

  <!-- Window title -->
  <text x="620" y="99" class="title" text-anchor="middle">Sessions Chronicle</text>

  <!-- Primary menu, alone at pack_end -->
  <circle cx="936" cy="94" r="12" class="stroke-thin" />
  <line x1="931" y1="91" x2="941" y2="91" class="stroke-thin" />
  <line x1="931" y1="95" x2="941" y2="95" class="stroke-thin" />
  <line x1="931" y1="99" x2="941" y2="99" class="stroke-thin" />

  <!-- Date pill (existing, active) -->
  <rect x="68" y="80" width="128" height="28" rx="14" class="accent-bg accent-stroke" />
  <rect x="82" y="88" width="12" height="12" rx="2" class="accent-stroke" />
  <line x1="82" y1="92" x2="94" y2="92" class="accent-stroke" />
  <text x="102" y="99" class="accent" font-size="12">Last 30 days</text>

  <!-- Sort pill (active: Messages, descending) -->
  <rect x="204" y="80" width="136" height="28" rx="14" class="accent-bg accent-stroke" />
  <!-- sort icon: three bars + down arrow -->
  <line x1="218" y1="88" x2="234" y2="88" class="accent-stroke" />
  <line x1="218" y1="94" x2="230" y2="94" class="accent-stroke" />
  <line x1="218" y1="100" x2="226" y2="100" class="accent-stroke" />
  <text x="242" y="99" class="accent" font-size="12">Messages &#8595;</text>

  <!-- ===== Session list (sorted by messages, descending) ===== -->
  <rect x="36" y="134" width="700" height="48" rx="6" class="ws stroke-thin" />
  <text x="52" y="154" class="row-text">Refactor parser pipeline</text>
  <text x="52" y="172" class="badge">OpenCode &#183; 128 messages &#183; 2d ago</text>

  <rect x="36" y="190" width="700" height="48" rx="6" class="ws stroke-thin" />
  <text x="52" y="210" class="row-text">Fix flaky indexing test</text>
  <text x="52" y="228" class="badge">Claude Code &#183; 96 messages &#183; 5d ago</text>

  <rect x="36" y="246" width="700" height="48" rx="6" class="ws stroke-thin" />
  <text x="52" y="266" class="row-text">Explore sort options</text>
  <text x="52" y="284" class="badge">Codex &#183; 74 messages &#183; 1w ago</text>

  <rect x="36" y="302" width="700" height="48" rx="6" class="ws stroke-thin" />
  <text x="52" y="322" class="row-text">Bump dependencies</text>
  <text x="52" y="340" class="badge">OpenCode &#183; 41 messages &#183; 1w ago</text>

  <rect x="36" y="358" width="700" height="48" rx="6" class="ws stroke-thin" />
  <text x="52" y="378" class="row-text">Fix CSS nit in sidebar</text>
  <text x="52" y="396" class="badge">Mistral Vibe &#183; 23 messages &#183; 2w ago</text>

  <polygon points="266,116 278,116 272,124" class="ws stroke-thin" />
  <!-- ===== Sort popover (anchored under the pill, floating above the list) ===== -->
  <rect x="180" y="124" width="202" height="296" rx="8" class="ws stroke" />
  <text x="198" y="148" class="badge" font-weight="600">Sort by</text>

  <!-- Criterion rows -->
  <text x="198" y="172" class="label">Last activity</text>
  <text x="198" y="200" class="label">Created</text>
  <text x="198" y="228" class="accent" font-size="12" font-weight="600">Messages</text>
  <polyline points="354,222 359,228 370,214" class="accent-stroke" />

  <!-- Relevance: query-bound row -->
  <rect x="188" y="236" width="186" height="24" rx="4" class="red-stroke" />
  <text x="198" y="252" class="muted" font-size="12" font-style="italic">Relevance</text>
  <text x="282" y="252" class="note" font-size="10">search only</text>

  <line x1="198" y1="272" x2="364" y2="272" class="stroke-thin" />
  <text x="198" y="292" class="badge" font-weight="600">Order</text>

  <!-- Linked order toggles -->
  <rect x="198" y="302" width="88" height="30" rx="6" class="ws stroke-thin" />
  <text x="242" y="321" class="label" text-anchor="middle">Descending</text>
  <rect x="286" y="302" width="88" height="30" rx="6" class="accent-bg accent-stroke" />
  <text x="330" y="321" class="accent" font-size="12" text-anchor="middle">Ascending</text>


  <!-- ===== Annotations ===== -->
  <text x="20" y="640" class="note">&#9312; Popover reuses DatePill mechanics: ListBox presets + linked toggle buttons, flat MenuButton in the header bar</text>
  <text x="20" y="660" class="note">&#9313; Relevance appears only while a query is active &#8212; implicit default of search mode, never persisted to GSettings</text>
  <text x="20" y="680" class="note">&#9314; Non-default sort &#8594; icon + label + accent class on the pill; below ~500 px the pill falls back to icon-only</text>
  <text x="20" y="700" class="note">&#9315; Both pills are packed with `pack_start` &#8212; header-bar left, the sort pill immediately after the DatePill (`src/app/mod.rs:525`)</text>
</svg>
