<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="-apple-system, 'Cantarell', system-ui, sans-serif" font-size="13">
  <style>
    .stroke { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
    .stroke-thin { fill: none; stroke: #1a1a1a; stroke-width: 1; }
    .muted { fill: #777; }
    .accent { fill: #3584e4; }
    .accent-stroke { fill: none; stroke: #3584e4; stroke-width: 1.6; }
    .accent-bg { fill: #3584e4; fill-opacity: 0.12; }
    .red { fill: #c01c28; }
    .red-stroke { fill: none; stroke: #c01c28; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .badge { font-size: 11px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #c01c28; font-style: italic; }
    .row-text { font-size: 12.5px; fill: #1a1a1a; }
    .ws { fill: #ffffff; }
  </style>

  <!-- ===== Title bar ===== -->
  <text x="20" y="28" class="title">Proposal B — Sort lenses &#183; Chronology lens</text>
  <text x="20" y="46" class="muted" font-size="12">Oldest first &#183; month group headers &#183; timeline spine &#8212; a project&#8217;s chronology, rebuilt at a glance</text>

  <!-- ===== App window ===== -->
  <rect x="20" y="70" width="940" height="620" rx="10" class="ws stroke" />

  <!-- Header bar -->
  <rect x="20" y="70" width="940" height="48" fill="#f0f0f0" />
  <line x1="20" y1="118" x2="960" y2="118" class="stroke-thin" />
  <circle cx="44" cy="94" r="12" class="stroke-thin" />
  <text x="44" y="99" class="label" text-anchor="middle">&lt;</text>
  <text x="490" y="99" class="title" text-anchor="middle">Sessions Chronicle</text>

  <!-- Search bar -->
  <rect x="36" y="128" width="908" height="32" rx="8" class="ws stroke-thin" />
  <circle cx="56" cy="144" r="6" class="stroke-thin" />
  <line x1="60" y1="148" x2="65" y2="153" class="stroke-thin" />
  <text x="76" y="149" class="muted" font-size="12">Search sessions&#8230;</text>

  <!-- ===== Lens switcher strip ===== -->
  <rect x="36" y="170" width="330" height="30" rx="8" class="ws stroke" />
  <text x="91" y="189" class="label" text-anchor="middle">Activity</text>
  <rect x="146" y="170" width="110" height="30" rx="8" class="accent-bg accent-stroke" />
  <text x="201" y="189" class="accent" font-size="12" font-weight="600" text-anchor="middle">Chronology</text>
  <text x="311" y="189" class="label" text-anchor="middle">Volume</text>
  <text x="386" y="189" class="note">&#8592; a lens = a sort order + a row encoding</text>

  <!-- ===== Timeline spine ===== -->
  <line x1="64" y1="222" x2="64" y2="664" class="stroke-thin" />

  <!-- ===== Group: June 2026 ===== -->
  <text x="90" y="224" class="title">June 2026</text>
  <circle cx="64" cy="220" r="4" class="accent" />

  <rect x="90" y="236" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="259" r="4" class="ws stroke" />
  <text x="106" y="256" class="row-text">Scaffold parser crate</text>
  <text x="106" y="274" class="badge">Jun 03 &#183; Claude Code &#183; 18 messages</text>

  <rect x="90" y="290" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="313" r="4" class="ws stroke" />
  <text x="106" y="310" class="row-text">Wire up SQLite indexing</text>
  <text x="106" y="328" class="badge">Jun 12 &#183; OpenCode &#183; 42 messages</text>

  <!-- resume gap highlight -->
  <line x1="80" y1="336" x2="80" y2="368" class="red-stroke" />

  <rect x="90" y="344" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="367" r="4" class="ws stroke" />
  <text x="106" y="364" class="row-text">First working session list</text>
  <text x="106" y="382" class="badge">Jun 15 &#183; OpenCode &#183; 61 messages &#183; resumed</text>
  <text x="700" y="371" class="note">3-day gap &#8594; visible on the spine</text>

  <!-- ===== Group: July 2026 ===== -->
  <text x="90" y="426" class="title">July 2026</text>
  <circle cx="64" cy="422" r="4" class="accent" />

  <rect x="90" y="438" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="461" r="4" class="ws stroke" />
  <text x="106" y="458" class="row-text">Add date filter pill</text>
  <text x="106" y="476" class="badge">Jul 02 &#183; Codex &#183; 37 messages</text>

  <rect x="90" y="492" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="515" r="4" class="ws stroke" />
  <text x="106" y="512" class="row-text">Explore sort options</text>
  <text x="106" y="530" class="badge">Jul 18 &#183; OpenCode &#183; 74 messages</text>

  <rect x="90" y="546" width="854" height="46" rx="6" class="ws stroke-thin" />
  <circle cx="64" cy="569" r="4" class="ws stroke" />
  <text x="106" y="566" class="row-text">Refactor parser pipeline</text>
  <text x="106" y="584" class="badge">Jul 21 &#183; OpenCode &#183; 128 messages &#183; newest</text>

  <!-- ===== Annotations ===== -->
  <text x="20" y="716" class="note">&#9312; Oldest first: the list reads like a project journal &#8212; month headers give the hierarchy an alphabetical project sort never could</text>
  <text x="20" y="736" class="note">&#9313; The spine makes resume gaps and bursts of activity visible without reading a single date</text>
</svg>
