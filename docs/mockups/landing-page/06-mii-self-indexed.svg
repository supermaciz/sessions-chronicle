<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="Cantarell, 'Adwaita Sans', sans-serif">
  <defs>
    <style>
      .bg { fill: #f7f4ef; }
      .header { fill: #f7f4ef; stroke: #e4ded5; stroke-width: 1; }
      .group { fill: #fffdf9; stroke: #e2dbd3; stroke-width: 1; }
      .row { fill: #ffffff; stroke: #ebe5dd; stroke-width: 1; }
      .text { fill: #1f1f1f; font-size: 14px; }
      .text-dim { fill: #6d6761; font-size: 12px; }
      .text-faint { fill: #898179; font-size: 11px; letter-spacing: 0.7px; }
      .h1 { fill: #1f1f1f; font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
      .h2 { fill: #1f1f1f; font-size: 18px; font-weight: 700; }
      .button { fill: #3584e4; }
      .button-text { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .ghost { fill: #ffffff; stroke: #d8d1c8; stroke-width: 1; }
      .switcher { fill: #ece7e0; }
      .switcher-active { fill: #ffffff; stroke: #d7d0c7; stroke-width: 1; }
      .switcher-text { fill: #5a534d; font-size: 11px; font-weight: 700; }
      .switcher-text-active { fill: #1f1f1f; font-size: 11px; font-weight: 700; }
      .shot { fill: #fbfbfb; stroke: #d7d1c8; stroke-width: 1; }
      .shot-head { fill: #ececec; stroke: #d6d6d6; stroke-width: 1; }
      .shot-side { fill: #f3f2f1; }
      .line-dark { fill: #2f2f2f; }
      .line-mid { fill: #7a7a7a; }
      .line-light { fill: #c7c7c7; }
      .suffix { fill: #ece7e0; }
      .suffix-text { fill: #5a534d; font-size: 10px; font-weight: 700; }
      .footer-strip { fill: #2f2f2f; }
      .footer-text { fill: #ffffff; font-size: 12px; }
      .footer-link { fill: #8fc9ff; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="640" class="bg"/>

  <rect x="0" y="0" width="960" height="56" class="header"/>
  <rect x="28" y="16" width="24" height="24" rx="7" fill="#3584e4"/>
  <text x="62" y="33" class="text" font-weight="700">Sessions Chronicle</text>
  <text x="708" y="33" class="text-dim">GitHub</text>
  <text x="770" y="33" class="text-dim">Releases</text>
  <rect x="840" y="14" width="92" height="28" rx="8" class="ghost"/>
  <text x="886" y="33" class="text" text-anchor="middle" font-size="12" font-weight="700">Install</text>

  <text x="48" y="98" class="text-faint">PREFERENCES NARRATIVE</text>
  <text x="48" y="140" class="h1">A landing page built from</text>
  <text x="48" y="176" class="h1">GNOME section grammar.</text>
  <text x="48" y="206" class="text-dim">Not a faux app. Not a SaaS card grid.</text>
  <text x="48" y="226" class="text-dim">A sequence of groups, rows, proofs, and screenshots.</text>

  <rect x="48" y="246" width="112" height="40" rx="10" class="button"/>
  <text x="104" y="272" class="button-text" text-anchor="middle">Install</text>
  <rect x="172" y="246" width="128" height="40" rx="10" class="ghost"/>
  <text x="236" y="272" class="text" text-anchor="middle" font-size="13" font-weight="700">View source</text>

  <rect x="48" y="302" width="360" height="34" rx="17" class="switcher"/>
  <rect x="52" y="306" width="98" height="26" rx="13" class="switcher-active"/>
  <text x="101" y="323" class="switcher-text-active" text-anchor="middle">Claude Code</text>
  <text x="194" y="323" class="switcher-text" text-anchor="middle">OpenCode</text>
  <text x="270" y="323" class="switcher-text" text-anchor="middle">Codex</text>
  <text x="350" y="323" class="switcher-text" text-anchor="middle">Mistral Vibe</text>

  <!-- Group 1 -->
  <rect x="48" y="356" width="864" height="96" rx="18" class="group"/>
  <text x="72" y="382" class="text-faint">BROWSE</text>
  <text x="72" y="406" class="h2">One archive for every session</text>
  <text x="72" y="428" class="text-dim">Lead with the library view, then explain it with one sentence and one proof line.</text>

  <rect x="522" y="372" width="368" height="62" rx="12" class="shot"/>
  <rect x="522" y="372" width="368" height="18" rx="12" class="shot-head"/>
  <rect x="522" y="390" width="104" height="44" class="shot-side"/>
  <rect x="638" y="402" width="194" height="8" rx="3" class="line-dark"/>
  <rect x="638" y="416" width="166" height="6" rx="3" class="line-mid"/>
  <rect x="638" y="426" width="208" height="6" rx="3" class="line-light"/>

  <!-- Group 2 -->
  <rect x="48" y="470" width="864" height="58" rx="18" class="group"/>
  <text x="72" y="494" class="text-faint">INSPECT</text>
  <rect x="72" y="498" width="388" height="22" rx="10" class="row"/>
  <text x="88" y="513" class="text" font-size="13" font-weight="700">Inspect tool calls and reasoning blocks inline</text>
  <rect x="380" y="501" width="66" height="16" rx="8" class="suffix"/>
  <text x="413" y="512" class="suffix-text" text-anchor="middle">DETAILS</text>

  <rect x="486" y="498" width="404" height="22" rx="10" class="row"/>
  <text x="502" y="513" class="text" font-size="13" font-weight="700">Follow subagent threads without losing context</text>
  <rect x="824" y="501" width="52" height="16" rx="8" class="suffix"/>
  <text x="850" y="512" class="suffix-text" text-anchor="middle">LINKS</text>

  <!-- Group 3 -->
  <rect x="48" y="546" width="864" height="58" rx="18" class="group"/>
  <text x="72" y="570" class="text-faint">RESUME</text>
  <rect x="72" y="574" width="388" height="22" rx="10" class="row"/>
  <text x="88" y="589" class="text" font-size="13" font-weight="700">Resume any session in your terminal</text>
  <rect x="384" y="577" width="62" height="16" rx="8" class="suffix"/>
  <text x="415" y="588" class="suffix-text" text-anchor="middle">SHELL</text>

  <rect x="486" y="574" width="404" height="22" rx="10" class="row"/>
  <text x="502" y="589" class="text" font-size="13" font-weight="700">Review pinned sessions, analytics, and cost locally</text>
  <rect x="810" y="577" width="66" height="16" rx="8" class="suffix"/>
  <text x="843" y="588" class="suffix-text" text-anchor="middle">LOCAL</text>

  <!-- Footer strip as status area -->
  <rect x="48" y="612" width="864" height="20" rx="10" class="footer-strip"/>
  <text x="68" y="626" class="footer-text">Local-first</text>
  <text x="166" y="626" class="footer-text">No telemetry</text>
  <text x="288" y="626" class="footer-text">Open source</text>
  <text x="890" y="626" class="footer-link" text-anchor="end">Install Flatpak</text>
</svg>
