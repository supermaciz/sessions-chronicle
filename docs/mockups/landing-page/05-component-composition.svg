<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="Cantarell, 'Adwaita Sans', sans-serif">
  <defs>
    <style>
      .bg { fill: #f6f2ec; }
      .surface { fill: #fffdf9; stroke: #e3ddd5; stroke-width: 1; }
      .header { fill: #f6f2ec; stroke: #e6dfd8; stroke-width: 1; }
      .text { fill: #1f1f1f; font-size: 14px; }
      .text-dim { fill: #6d6862; font-size: 13px; }
      .text-faint { fill: #89827a; font-size: 11px; letter-spacing: 0.7px; }
      .h1 { fill: #1f1f1f; font-size: 34px; font-weight: 800; letter-spacing: -0.7px; }
      .h2 { fill: #1f1f1f; font-size: 18px; font-weight: 700; }
      .button { fill: #3584e4; }
      .button-text { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .ghost { fill: #ffffff; stroke: #d8d1c8; stroke-width: 1; }
      .banner { fill: #eaf3fd; stroke: #cadef7; stroke-width: 1; }
      .banner-text { fill: #1b4f89; font-size: 12px; font-weight: 700; }
      .entry { fill: #ffffff; stroke: #d5cfc7; stroke-width: 1; }
      .chip { fill: #ece8e2; }
      .chip-active { fill: #dce9fb; }
      .chip-text { fill: #57514b; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
      .chip-text-active { fill: #1b4f89; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
      .group { fill: #fffdf9; stroke: #e1dbd4; stroke-width: 1; }
      .row { fill: #ffffff; stroke: #ece7e0; stroke-width: 1; }
      .row-title { fill: #1f1f1f; font-size: 13px; font-weight: 700; }
      .row-sub { fill: #6d6862; font-size: 11px; }
      .suffix { fill: #e9e4dd; }
      .suffix-text { fill: #5b554f; font-size: 10px; font-weight: 700; }
      .bubble-a { fill: #f2f1ee; stroke: #e5dfd7; stroke-width: 1; }
      .bubble-u { fill: #e8f1fc; stroke: #cadef7; stroke-width: 1; }
      .tool { fill: #f8f5f0; stroke: #e4ddd2; stroke-width: 1; }
      .tool-rail { fill: #3584e4; }
      .toast { fill: #303030; }
      .toast-text { fill: #ffffff; font-size: 12px; }
      .toast-link { fill: #8cc5ff; font-size: 12px; font-weight: 700; }
      .orb-a { fill: #efe8dc; }
      .orb-b { fill: #e3eefb; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #1f1f1f; }
    </style>
  </defs>

  <rect width="960" height="640" class="bg"/>
  <circle cx="860" cy="120" r="160" class="orb-a"/>
  <circle cx="750" cy="510" r="120" class="orb-b"/>

  <rect x="0" y="0" width="960" height="56" class="header"/>
  <rect x="28" y="16" width="24" height="24" rx="7" fill="#3584e4"/>
  <text x="62" y="33" class="text" font-weight="700">Sessions Chronicle</text>
  <text x="670" y="33" class="text-dim">Features</text>
  <text x="738" y="33" class="text-dim">Install</text>
  <text x="794" y="33" class="text-dim">GitHub</text>
  <rect x="850" y="14" width="82" height="28" rx="8" class="ghost"/>
  <text x="891" y="33" class="text" text-anchor="middle" font-size="12" font-weight="700">Releases</text>

  <text x="48" y="112" class="text-faint">ADWAITA UNFRAMED</text>
  <text x="48" y="162" class="h1">The page speaks</text>
  <text x="48" y="200" class="h1">the app's language.</text>
  <text x="48" y="238" class="text-dim">No fake desktop. No pretend GTK window.</text>
  <text x="48" y="258" class="text-dim">Just libadwaita grammar translated into a marketing surface.</text>

  <rect x="48" y="292" width="118" height="40" rx="10" class="button"/>
  <text x="107" y="318" class="button-text" text-anchor="middle">Install</text>
  <rect x="178" y="292" width="130" height="40" rx="10" class="ghost"/>
  <text x="243" y="318" class="text" text-anchor="middle" font-size="13" font-weight="700">View on GitHub</text>

  <text x="48" y="370" class="text-faint">WHY THIS WORKS</text>
  <text x="48" y="398" class="text">Adwaita components become the composition.</text>
  <text x="48" y="418" class="text-dim">Banner, chips, rows, transcript bubbles, toast.</text>
  <text x="48" y="438" class="text-dim">Recognizably GNOME-native, but clearly still a web page.</text>

  <rect x="48" y="484" width="272" height="108" rx="16" class="surface"/>
  <text x="68" y="514" class="h2">Not a screenshot replacement</text>
  <text x="68" y="538" class="text-dim">This hero proves the interaction model, then</text>
  <text x="68" y="556" class="text-dim">real screenshots can carry the chapters below.</text>
  <rect x="68" y="568" width="98" height="18" rx="9" class="chip"/>
  <text x="117" y="581" class="chip-text" text-anchor="middle">LOCAL-FIRST</text>

  <!-- Component composition -->
  <g transform="translate(390,86)">
    <rect x="0" y="0" width="516" height="440" rx="24" class="surface"/>

    <rect x="26" y="24" width="464" height="38" rx="10" class="banner"/>
    <text x="44" y="47" class="banner-text">Version 1.0 is out — local-first, four AI assistants, zero telemetry.</text>
    <rect x="404" y="32" width="74" height="22" rx="7" fill="#3584e4"/>
    <text x="441" y="47" class="button-text" text-anchor="middle" font-size="11">Install</text>

    <rect x="26" y="82" width="464" height="42" rx="12" class="entry"/>
    <circle cx="48" cy="103" r="5" fill="none" stroke="#8a847d" stroke-width="1.2"/>
    <line x1="52" y1="107" x2="56" y2="111" stroke="#8a847d" stroke-width="1.2"/>
    <text x="66" y="108" class="text-dim">tool:Bash assistant:codex project:relm</text>

    <rect x="26" y="142" width="92" height="22" rx="11" class="chip-active"/>
    <text x="72" y="157" class="chip-text-active" text-anchor="middle">CLAUDE CODE</text>
    <rect x="126" y="142" width="84" height="22" rx="11" class="chip"/>
    <text x="168" y="157" class="chip-text" text-anchor="middle">OPENCODE</text>
    <rect x="218" y="142" width="60" height="22" rx="11" class="chip"/>
    <text x="248" y="157" class="chip-text" text-anchor="middle">CODEX</text>
    <rect x="286" y="142" width="94" height="22" rx="11" class="chip"/>
    <text x="333" y="157" class="chip-text" text-anchor="middle">MISTRAL VIBE</text>

    <rect x="26" y="184" width="464" height="144" rx="16" class="group"/>
    <text x="44" y="210" class="text-faint">FEATURE GROUP</text>

    <rect x="40" y="222" width="436" height="28" rx="10" class="row"/>
    <text x="56" y="240" class="row-title">Search every transcript in one archive</text>
    <rect x="398" y="228" width="64" height="16" rx="8" class="suffix"/>
    <text x="430" y="239" class="suffix-text" text-anchor="middle">FTS5</text>

    <rect x="40" y="256" width="436" height="28" rx="10" class="row"/>
    <text x="56" y="274" class="row-title">Inspect tool calls and reasoning inline</text>
    <rect x="366" y="262" width="96" height="16" rx="8" class="suffix"/>
    <text x="414" y="273" class="suffix-text" text-anchor="middle">TOOL CALLS</text>

    <rect x="40" y="290" width="436" height="28" rx="10" class="row"/>
    <text x="56" y="308" class="row-title">Resume any session in your terminal</text>
    <rect x="382" y="296" width="80" height="16" rx="8" class="suffix"/>
    <text x="422" y="307" class="suffix-text" text-anchor="middle">TERMINAL</text>

    <rect x="26" y="346" width="464" height="126" rx="16" class="group"/>
    <text x="44" y="372" class="text-faint">TRANSCRIPT PREVIEW</text>

    <rect x="44" y="386" width="286" height="44" rx="12" class="bubble-a"/>
    <text x="58" y="403" class="text-faint">ASSISTANT</text>
    <text x="58" y="420" class="text">Find the conversation. Read the reasoning.</text>

    <rect x="208" y="438" width="268" height="24" rx="12" class="bubble-u"/>
    <text x="222" y="454" class="text">tool:Bash · assistant:codex · project:relm</text>

    <rect x="44" y="438" width="150" height="24" rx="8" class="tool"/>
    <rect x="44" y="438" width="4" height="24" rx="2" class="tool-rail"/>
    <text x="58" y="454" class="mono">resume_in_terminal()</text>
  </g>

  <g transform="translate(676,544)">
    <rect x="0" y="0" width="236" height="42" rx="12" class="toast"/>
    <text x="18" y="25" class="toast-text">Local-only indexing</text>
    <text x="214" y="25" class="toast-link" text-anchor="end">MIT</text>
  </g>
</svg>
