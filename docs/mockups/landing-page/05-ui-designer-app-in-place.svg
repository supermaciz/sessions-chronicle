<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="Cantarell, 'Adwaita Sans', sans-serif">
  <defs>
    <style>
      .desktop-bg { fill: #d6d3ce; }
      .window { fill: #fafafa; stroke: #c4c0bb; stroke-width: 1; }
      .headerbar { fill: #ebebeb; stroke: #d4d4d4; stroke-width: 1; }
      .sidebar { fill: #f3f2f1; }
      .sidebar-divider { stroke: #dcdad6; stroke-width: 1; }
      .content { fill: #fafafa; }
      .text { fill: #1d1d1d; font-size: 13px; }
      .text-strong { fill: #1d1d1d; font-size: 13px; font-weight: 700; }
      .text-dim { fill: #6b6b6b; font-size: 12px; }
      .text-faint { fill: #8a8a8a; font-size: 10px; letter-spacing: 0.5px; }
      .h1 { fill: #1d1d1d; font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
      .h2 { fill: #1d1d1d; font-size: 14px; font-weight: 700; }
      .accent { fill: #3584e4; }
      .accent-btn { fill: #3584e4; }
      .accent-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
      .ghost-btn { fill: #ffffff; stroke: #d0cdc7; stroke-width: 1; }
      .row-selected { fill: #3584e4; }
      .row-selected-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
      .row-selected-sub { fill: #cfe1f8; font-size: 11px; }
      .row-text { fill: #1d1d1d; font-size: 13px; }
      .row-sub { fill: #7a7a7a; font-size: 11px; }
      .banner { fill: #eaf3fd; stroke: #c8def8; stroke-width: 1; }
      .banner-text { fill: #1a4f8a; font-size: 12px; font-weight: 600; }
      .card { fill: #ffffff; stroke: #e6e3de; stroke-width: 1; }
      .pill { fill: #ececec; }
      .pill-text { fill: #4a4a4a; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
      .pill-accent { fill: #e3efff; }
      .pill-accent-text { fill: #1a4f8a; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
      .mono { font-family: 'JetBrains Mono', 'Source Code Pro', monospace; }
      .bubble-user { fill: #e8f1fc; }
      .bubble-assistant { fill: #f3f2f1; }
    </style>
  </defs>

  <!-- Desktop wallpaper -->
  <rect width="960" height="640" class="desktop-bg"/>

  <!-- App window with rounded corners + soft drop shadow -->
  <rect x="20" y="20" width="920" height="600" rx="12" fill="#000" opacity="0.12"/>
  <rect x="20" y="18" width="920" height="600" rx="12" class="window"/>

  <!-- ========= HEADERBAR ========= -->
  <path d="M20,30 a12,12 0 0 1 12,-12 h896 a12,12 0 0 1 12,12 v18 h-920 z" class="headerbar"/>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#d4d4d4" stroke-width="1"/>

  <!-- WindowControls (left, GNOME convention: close right; we put them right) -->
  <!-- Title (centered region in libadwaita is the AdwViewSwitcher / title) -->
  <text x="44" y="40" class="text-strong">Sessions Chronicle</text>

  <!-- Sidebar toggle button (icon stand-in) -->
  <rect x="170" y="24" width="28" height="22" rx="6" fill="none" stroke="#cfcbc5"/>
  <line x1="177" y1="31" x2="191" y2="31" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="177" y1="35" x2="191" y2="35" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="177" y1="39" x2="191" y2="39" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Search entry (centered) -->
  <rect x="350" y="24" width="260" height="22" rx="11" fill="#ffffff" stroke="#d4d0ca"/>
  <circle cx="364" cy="35" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="367" y1="38" x2="370" y2="41" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="378" y="39" class="text-dim">Search transcripts</text>

  <!-- Menu button -->
  <rect x="800" y="24" width="28" height="22" rx="6" fill="none" stroke="#cfcbc5"/>
  <circle cx="809" cy="35" r="1.4" fill="#5a5a5a"/>
  <circle cx="814" cy="35" r="1.4" fill="#5a5a5a"/>
  <circle cx="819" cy="35" r="1.4" fill="#5a5a5a"/>

  <!-- WindowControls: minimize / maximize / close -->
  <circle cx="852" cy="35" r="7" fill="#dcd9d4" stroke="#c4c0bb" stroke-width="0.5"/>
  <circle cx="872" cy="35" r="7" fill="#dcd9d4" stroke="#c4c0bb" stroke-width="0.5"/>
  <circle cx="892" cy="35" r="7" fill="#e8624c" stroke="#c84e3a" stroke-width="0.5"/>
  <line x1="848" y1="35" x2="856" y2="35" stroke="#5a5a5a" stroke-width="1.2"/>
  <rect x="868.5" y="31.5" width="7" height="7" fill="none" stroke="#5a5a5a" stroke-width="1.1"/>
  <line x1="889" y1="32" x2="895" y2="38" stroke="#ffffff" stroke-width="1.4"/>
  <line x1="895" y1="32" x2="889" y2="38" stroke="#ffffff" stroke-width="1.4"/>

  <!-- ========= SIDEBAR (AdwOverlaySplitView left pane) ========= -->
  <rect x="20" y="49" width="280" height="569" class="sidebar"/>
  <line x1="300" y1="49" x2="300" y2="618" class="sidebar-divider"/>

  <!-- Sidebar header / filter -->
  <text x="40" y="78" class="text-faint">PROJECTS</text>
  <text x="40" y="100" class="text">All sessions</text>
  <text x="270" y="100" class="text-dim" text-anchor="end">412</text>
  <text x="40" y="122" class="text-dim">sessions-chronicle</text>
  <text x="270" y="122" class="text-dim" text-anchor="end">128</text>
  <text x="40" y="142" class="text-dim">relm4-experiments</text>
  <text x="270" y="142" class="text-dim" text-anchor="end">64</text>
  <text x="40" y="162" class="text-dim">infra-notes</text>
  <text x="270" y="162" class="text-dim" text-anchor="end">22</text>

  <line x1="32" y1="178" x2="288" y2="178" stroke="#dcdad6"/>
  <text x="40" y="200" class="text-faint">RECENT SESSIONS</text>

  <!-- Selected row (the "marketing" row) -->
  <rect x="32" y="212" width="256" height="58" rx="9" class="row-selected"/>
  <text x="46" y="232" class="row-selected-text">Browse, search, resume.</text>
  <text x="46" y="250" class="row-selected-sub">Claude Code · just now · 1.2k msgs</text>
  <circle cx="272" cy="241" r="4" fill="#ffffff" opacity="0.85"/>

  <!-- Other rows -->
  <text x="46" y="290" class="row-text">Refactor parser pipeline</text>
  <text x="46" y="306" class="row-sub">OpenCode · 2h ago · 84 msgs</text>

  <text x="46" y="334" class="row-text">Indexing diagnostics</text>
  <text x="46" y="350" class="row-sub">Codex · yesterday · 31 msgs</text>

  <text x="46" y="378" class="row-text">Adwaita banner placement</text>
  <text x="46" y="394" class="row-sub">Mistral Vibe · 2d ago · 47 msgs</text>

  <text x="46" y="422" class="row-text">Tool call inspector</text>
  <text x="46" y="438" class="row-sub">Claude Code · 3d ago · 219 msgs</text>

  <text x="46" y="466" class="row-text">Search highlight pass</text>
  <text x="46" y="482" class="row-sub">OpenCode · 4d ago · 56 msgs</text>

  <text x="46" y="510" class="row-text">Resume-in-terminal flow</text>
  <text x="46" y="526" class="row-sub">Codex · last week · 12 msgs</text>

  <!-- Sidebar footer: indexing status -->
  <line x1="32" y1="560" x2="288" y2="560" stroke="#dcdad6"/>
  <circle cx="44" cy="582" r="4" fill="#33d17a"/>
  <text x="56" y="586" class="text-dim">Indexed · 412 sessions</text>
  <text x="56" y="602" class="text-faint">LOCAL ONLY · NEVER LEAVES YOUR DISK</text>

  <!-- ========= CONTENT PANE ========= -->
  <!-- AdwBanner -->
  <rect x="316" y="64" width="608" height="34" rx="8" class="banner"/>
  <circle cx="335" cy="81" r="6" fill="none" stroke="#1a4f8a" stroke-width="1.3"/>
  <line x1="335" y1="78" x2="335" y2="84" stroke="#1a4f8a" stroke-width="1.3"/>
  <circle cx="335" cy="76" r="0.8" fill="#1a4f8a"/>
  <text x="350" y="85" class="banner-text">Version 1.0 is out — local-first, four AI assistants, zero telemetry.</text>
  <rect x="820" y="71" width="92" height="20" rx="6" fill="#3584e4"/>
  <text x="866" y="85" class="accent-text" text-anchor="middle" font-size="11">Install Flatpak</text>

  <!-- Hero block (acts like a "session detail" header) -->
  <text x="316" y="138" class="text-faint">SESSION · CHRONICLE · v1.0 · MMXXVI</text>

  <text x="316" y="174" class="h1">A local archive of every</text>
  <text x="316" y="208" class="h1">conversation you have</text>
  <text x="316" y="242" class="h1">with an <tspan class="accent">AI assistant.</tspan></text>

  <text x="316" y="272" class="text-dim" font-size="13">
    Browse, search, and resume sessions from Claude Code, OpenCode,
  </text>
  <text x="316" y="290" class="text-dim" font-size="13">
    Codex, and Mistral Vibe — in one native GNOME window.
  </text>

  <!-- Assistant chips, styled like in-app filter pills -->
  <rect x="316" y="306" width="86" height="22" rx="11" class="pill-accent"/>
  <text x="359" y="321" class="pill-accent-text" text-anchor="middle">CLAUDE CODE</text>
  <rect x="408" y="306" width="76" height="22" rx="11" class="pill"/>
  <text x="446" y="321" class="pill-text" text-anchor="middle">OPENCODE</text>
  <rect x="490" y="306" width="58" height="22" rx="11" class="pill"/>
  <text x="519" y="321" class="pill-text" text-anchor="middle">CODEX</text>
  <rect x="554" y="306" width="84" height="22" rx="11" class="pill"/>
  <text x="596" y="321" class="pill-text" text-anchor="middle">MISTRAL VIBE</text>

  <!-- CTAs -->
  <rect x="316" y="346" width="132" height="36" rx="8" class="accent-btn"/>
  <text x="382" y="370" class="accent-text" text-anchor="middle">Install on GNOME</text>
  <rect x="456" y="346" width="124" height="36" rx="8" class="ghost-btn"/>
  <text x="518" y="370" class="text" text-anchor="middle" font-weight="600">View source</text>
  <text x="592" y="369" class="text-dim" font-size="12">★ 1.2k · MIT</text>

  <!-- Transcript-style "preview" card (the screenshot moment, embedded as a session bubble) -->
  <rect x="316" y="400" width="608" height="200" rx="10" class="card"/>

  <!-- card header -->
  <text x="332" y="424" class="h2">Why a chronicle?</text>
  <text x="332" y="440" class="text-dim" font-size="11">From the README · 2 min read</text>
  <rect x="850" y="412" width="60" height="20" rx="10" class="pill"/>
  <text x="880" y="426" class="pill-text" text-anchor="middle">PINNED</text>

  <line x1="332" y1="452" x2="908" y2="452" stroke="#ececec"/>

  <!-- assistant bubble -->
  <rect x="332" y="464" width="370" height="58" rx="10" class="bubble-assistant"/>
  <text x="346" y="482" class="text-faint">CLAUDE CODE · 14:02</text>
  <text x="346" y="500" class="text">Your sessions are a record of how you think.</text>
  <text x="346" y="516" class="text">Sessions Chronicle keeps that record searchable.</text>

  <!-- user bubble -->
  <rect x="540" y="530" width="372" height="44" rx="10" class="bubble-user"/>
  <text x="554" y="548" class="text-faint">YOU · 14:02</text>
  <text x="554" y="566" class="text">Find: tool:Bash · project:relm · assistant:codex</text>

  <!-- inline tool call chip -->
  <rect x="332" y="538" width="200" height="32" rx="6" fill="#f7f5f1" stroke="#e3dfd8"/>
  <rect x="332" y="538" width="4" height="32" fill="#3584e4"/>
  <text x="346" y="552" class="text-faint">TOOL CALL</text>
  <text x="346" y="566" class="mono text" font-size="11">resume_in_terminal()</text>

  <!-- subtle bottom hint, like the floating search nav bar -->
  <text x="316" y="618" class="text-faint">ESC to close · ⌘F to search · ENTER to resume in terminal</text>
</svg>
