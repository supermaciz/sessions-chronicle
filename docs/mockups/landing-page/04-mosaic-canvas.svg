<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <defs>
    <style>
      .bg { fill: #07070a; }
      .text { fill: #e6e9ef; font-size: 12px; }
      .text-dim { fill: #5a5f6e; font-size: 11px; }
      .text-faint { fill: #2f3340; font-size: 10px; }
      .h1 { fill: #ffffff; font-size: 30px; font-weight: 200; letter-spacing: 1px; font-family: 'Space Mono', monospace; }
      .h1-em { fill: #ff6a3d; font-size: 30px; font-weight: 700; letter-spacing: 1px; font-family: 'Space Mono', monospace; }
      .card-c { fill: #0e1014; stroke: #1c2030; stroke-width: 1; rx: 6; }
      .card-c-hot { fill: #131019; stroke: #ff6a3d; stroke-width: 1; rx: 6; }
      .card-line { fill: #2a2f3c; }
      .card-line-bright { fill: #4a5060; }
      .accent { fill: #ff6a3d; }
      .accent-soft { fill: #ff6a3d; opacity: 0.18; }
      .grid { stroke: #14161d; stroke-width: 0.5; }
      .glyph { fill: #5a5f6e; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
      .search { fill: #0e1014; stroke: #ff6a3d; stroke-width: 1.5; rx: 4; }
      .cursor { fill: #ff6a3d; }
      .badge { fill: #1c2030; rx: 3; }
      .badge-text { fill: #b9c1cf; font-size: 9px; }
      .conn { stroke: #2a2f3c; stroke-width: 0.6; stroke-dasharray: 2 3; fill: none; }
    </style>
  </defs>

  <rect width="960" height="640" class="bg"/>

  <!-- Dot grid background -->
  <g fill="#14161d">
    <g id="dots">
      <circle r="0.8"/>
    </g>
  </g>
  <g fill="#1a1d27">
    <!-- manual sparse dots for mood -->
    <circle cx="40" cy="80" r="0.8"/><circle cx="120" cy="80" r="0.8"/><circle cx="200" cy="80" r="0.8"/><circle cx="280" cy="80" r="0.8"/>
    <circle cx="40" cy="160" r="0.8"/><circle cx="200" cy="160" r="0.8"/><circle cx="360" cy="160" r="0.8"/><circle cx="520" cy="160" r="0.8"/>
    <circle cx="80" cy="240" r="0.8"/><circle cx="240" cy="240" r="0.8"/><circle cx="640" cy="240" r="0.8"/><circle cx="880" cy="240" r="0.8"/>
    <circle cx="40" cy="320" r="0.8"/><circle cx="160" cy="320" r="0.8"/><circle cx="400" cy="320" r="0.8"/><circle cx="800" cy="320" r="0.8"/>
    <circle cx="120" cy="400" r="0.8"/><circle cx="360" cy="400" r="0.8"/><circle cx="600" cy="400" r="0.8"/><circle cx="900" cy="400" r="0.8"/>
    <circle cx="60" cy="500" r="0.8"/><circle cx="240" cy="500" r="0.8"/><circle cx="480" cy="500" r="0.8"/><circle cx="720" cy="500" r="0.8"/>
  </g>

  <!-- Top bar (minimal) -->
  <text x="32" y="34" class="text">sessions-chronicle</text>
  <text x="160" y="34" class="text-faint">·</text>
  <text x="180" y="34" class="text-dim">v1.0</text>
  <text x="820" y="34" class="text-dim">github</text>
  <text x="880" y="34" class="text-dim">install</text>
  <line x1="916" y1="30" x2="924" y2="30" class="conn"/>

  <!-- Connection lines (subtle) -->
  <path d="M 160 220 Q 350 260 480 320" class="conn"/>
  <path d="M 800 200 Q 650 280 580 320" class="conn"/>
  <path d="M 120 480 Q 320 420 440 360" class="conn"/>
  <path d="M 820 480 Q 700 440 600 380" class="conn"/>

  <!-- Floating session cards (mosaic) -->
  <!-- Top-left card -->
  <g transform="translate(64,90) rotate(-3)">
    <rect width="180" height="100" class="card-c"/>
    <rect x="10" y="10" width="40" height="10" class="badge"/>
    <text x="14" y="18" class="badge-text">claude-code</text>
    <rect x="10" y="32" width="160" height="6" class="card-line-bright"/>
    <rect x="10" y="46" width="140" height="4" class="card-line"/>
    <rect x="10" y="56" width="120" height="4" class="card-line"/>
    <rect x="10" y="66" width="150" height="4" class="card-line"/>
    <text x="10" y="92" class="text-faint">2h ago · 142 msgs</text>
  </g>

  <!-- Top-right card -->
  <g transform="translate(720,80) rotate(4)">
    <rect width="180" height="100" class="card-c"/>
    <rect x="10" y="10" width="32" height="10" class="badge"/>
    <text x="14" y="18" class="badge-text">opencode</text>
    <rect x="10" y="32" width="160" height="6" class="card-line-bright"/>
    <rect x="10" y="46" width="100" height="4" class="card-line"/>
    <rect x="10" y="56" width="160" height="4" class="card-line"/>
    <rect x="10" y="66" width="80" height="4" class="card-line"/>
    <text x="10" y="92" class="text-faint">yesterday · pinned ★</text>
  </g>

  <!-- Mid-left -->
  <g transform="translate(40,360) rotate(2)">
    <rect width="200" height="110" class="card-c"/>
    <rect x="10" y="10" width="28" height="10" class="badge"/>
    <text x="14" y="18" class="badge-text">codex</text>
    <rect x="10" y="32" width="180" height="6" class="card-line-bright"/>
    <rect x="10" y="46" width="180" height="4" class="card-line"/>
    <rect x="10" y="56" width="140" height="4" class="card-line"/>
    <rect x="10" y="66" width="170" height="4" class="card-line"/>
    <rect x="10" y="76" width="120" height="4" class="card-line"/>
    <text x="10" y="100" class="text-faint">3 days ago · 8 tool calls</text>
  </g>

  <!-- Mid-right (HOT — accent) -->
  <g transform="translate(740,340) rotate(-3)">
    <rect width="190" height="110" class="card-c-hot"/>
    <rect x="10" y="10" width="40" height="10" class="badge" fill="#ff6a3d"/>
    <text x="14" y="18" class="badge-text" fill="#07070a">resume</text>
    <rect x="10" y="32" width="170" height="6" fill="#ff6a3d"/>
    <rect x="10" y="46" width="170" height="4" class="card-line"/>
    <rect x="10" y="56" width="130" height="4" class="card-line"/>
    <rect x="10" y="66" width="160" height="4" class="card-line"/>
    <rect x="10" y="76" width="110" height="4" class="card-line"/>
    <text x="10" y="100" class="text-faint" fill="#ff6a3d">last open · resume →</text>
  </g>

  <!-- Bottom-left -->
  <g transform="translate(120,490) rotate(-2)">
    <rect width="160" height="86" class="card-c"/>
    <rect x="10" y="10" width="40" height="10" class="badge"/>
    <text x="14" y="18" class="badge-text">mistral-vibe</text>
    <rect x="10" y="32" width="140" height="6" class="card-line-bright"/>
    <rect x="10" y="46" width="120" height="4" class="card-line"/>
    <rect x="10" y="56" width="100" height="4" class="card-line"/>
    <text x="10" y="78" class="text-faint">last week</text>
  </g>

  <!-- Bottom-right -->
  <g transform="translate(700,510) rotate(3)">
    <rect width="180" height="86" class="card-c"/>
    <rect x="10" y="10" width="40" height="10" class="badge"/>
    <text x="14" y="18" class="badge-text">claude-code</text>
    <rect x="10" y="32" width="160" height="6" class="card-line-bright"/>
    <rect x="10" y="46" width="120" height="4" class="card-line"/>
    <rect x="10" y="56" width="160" height="4" class="card-line"/>
    <text x="10" y="78" class="text-faint">last month · 320 msgs</text>
  </g>

  <!-- Center focal: search bar + tagline -->
  <text x="480" y="248" class="h1" text-anchor="middle">find any</text>
  <text x="480" y="284" class="h1-em" text-anchor="middle">conversation.</text>

  <!-- Search bar -->
  <rect x="290" y="304" width="380" height="44" class="search"/>
  <text x="306" y="332" class="text" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5a5f6e">/ search 1,247 sessions</text>
  <rect x="650" y="316" width="2" height="20" class="cursor"/>

  <!-- Mini hint chips -->
  <rect x="354" y="362" width="62" height="18" class="badge"/>
  <text x="385" y="375" class="badge-text" text-anchor="middle">tool:Bash</text>
  <rect x="424" y="362" width="74" height="18" class="badge"/>
  <text x="461" y="375" class="badge-text" text-anchor="middle">project:relm</text>
  <rect x="506" y="362" width="78" height="18" class="badge"/>
  <text x="545" y="375" class="badge-text" text-anchor="middle">assistant:codex</text>

  <!-- Footer line -->
  <text x="480" y="612" class="text-dim" text-anchor="middle">browse · search · resume — local-first, GNOME-native, MIT</text>
</svg>
