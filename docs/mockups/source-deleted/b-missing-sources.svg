<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">B · Marked rows + a “Missing source” sidebar entry</title><desc id="desc">Missing sessions appear in ordinary browsing; a count-gated sidebar entry next to Pinned filters the same list to just those sessions.</desc><g font-family="Cantarell, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1120" height="760" fill="#e5e5e9"/><text x="30" y="37" font-size="22" fill="#303036" font-weight="700">B · Marked rows + a “Missing source” sidebar entry</text><text x="30" y="62" font-size="13" fill="#55555e">The entry mirrors Pinned: a non-project filter with a session count, shown only when non-zero.</text><rect x="24" y="84" width="1072" height="606" rx="14" fill="#fafafa"/><rect x="24" y="84" width="1072" height="54" rx="14" fill="#ebebed"/><text x="53" y="118" font-size="23" fill="#303036">⌕</text><rect x="92" y="94" width="80" height="34" rx="8" fill="#eeeeef"/><text x="104" y="116" font-size="13" fill="#303036" font-weight="600">Date</text><rect x="181" y="94" width="104" height="34" rx="8" fill="#eeeeef"/><text x="193" y="116" font-size="13" fill="#303036" font-weight="600">Recent</text><text x="475" y="117" font-size="16" fill="#303036" font-weight="700">Sessions</text><text x="602" y="117" font-size="16" fill="#65656b">Analytics</text><text x="1023" y="117" font-size="20" fill="#303036">☰    ×</text><rect x="24" y="138" width="226" height="552" fill="#f0f0f2"/><rect x="42" y="157" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="171" font-size="13" fill="white">✓</text><text x="72" y="173" font-size="14" fill="#303036">Claude Code</text><rect x="42" y="192" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="206" font-size="13" fill="white">✓</text><text x="72" y="208" font-size="14" fill="#303036">OpenCode</text><rect x="42" y="227" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="241" font-size="13" fill="white">✓</text><text x="72" y="243" font-size="14" fill="#303036">Codex</text><rect x="42" y="262" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="276" font-size="13" fill="white">✓</text><text x="72" y="278" font-size="14" fill="#303036">Mistral Vibe</text><rect x="42" y="297" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="311" font-size="13" fill="white">✓</text><text x="72" y="313" font-size="14" fill="#303036">Kimi Code</text><text x="48" y="386" font-size="14" fill="#303036">All Sessions</text><text x="48" y="427" font-size="14" fill="#303036">Pinned</text><rect x="35" y="445" width="202" height="39" rx="8" fill="#dceafa"/><text x="48" y="470" font-size="14" fill="#174b85" font-weight="600">Missing source</text><text x="212" y="470" font-size="14" fill="#174b85">3</text><text x="48" y="512" font-size="14" fill="#303036">sessions-chronicle</text><text x="48" y="569" font-size="14" fill="#303036">website</text><text x="277" y="176" font-size="23" fill="#303036" font-weight="700">Sessions</text><text x="278" y="203" font-size="13" fill="#62626b">Filtered to missing source · 3 sessions · all projects · all AI assistants</text><rect x="913" y="157" width="159" height="34" rx="8" fill="#eeeeef"/><text x="925" y="179" font-size="13" fill="#303036" font-weight="600">Indexing Status</text><text x="276" y="259" font-size="20" fill="#65656b">•</text><text x="310" y="256" font-size="16" fill="#303036" font-weight="600">Investigate parser regression</text><text x="310" y="279" font-size="12"><tspan fill="#4a4a52" font-weight="600">Source missing</tspan><tspan fill="#62626b"> · Claude Code · sessions-chronicle · detected 6 Sep, 09:42</tspan></text><text x="1028" y="264" font-size="17" fill="#7a7a82">⊘</text><text x="1055" y="263" font-size="24" fill="#303036">›</text><path d="M270 301H1074" stroke="#dedee2"/><text x="276" y="341" font-size="20" fill="#65656b">•</text><text x="310" y="338" font-size="16" fill="#303036" font-weight="600">Review source discovery</text><text x="310" y="361" font-size="12"><tspan fill="#4a4a52" font-weight="600">Source missing</tspan><tspan fill="#62626b"> · OpenCode · sessions-chronicle · detected 6 Sep, 09:42</tspan></text><text x="1028" y="346" font-size="17" fill="#7a7a82">⊘</text><text x="1055" y="345" font-size="24" fill="#303036">›</text><path d="M270 383H1074" stroke="#dedee2"/><text x="276" y="423" font-size="20" fill="#65656b">•</text><text x="310" y="420" font-size="16" fill="#303036" font-weight="600">Update the landing page</text><text x="310" y="443" font-size="12"><tspan fill="#4a4a52" font-weight="600">Source missing</tspan><tspan fill="#62626b"> · Kimi Code · website · detected 5 Sep, 18:10</tspan></text><text x="1028" y="428" font-size="17" fill="#7a7a82">⊘</text><text x="1055" y="427" font-size="24" fill="#303036">›</text><path d="M270 465H1074" stroke="#dedee2"/><text x="278" y="547" font-size="13" fill="#62626b">Every row opens the shared retained-content detail. No Restore action — the original file, bundle, or record may be gone.</text><text x="32" y="722" font-size="13" fill="#55555e">Same list, one predicate. The entry inherits AI assistant and project filters and needs no separate search or navigation state.</text></g></svg>
