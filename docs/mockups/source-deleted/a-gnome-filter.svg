36">Codex</text><rect x="42" y="262" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="276" font-size="13" fill="white">✓</text><text x="72" y="278" font-size="14" fill="#303036">Mistral Vibe</text><rect x="42" y="297" width="18" height="18" rx="5" fill="#3584e4"/><text x="45" y="311" font-size="13" fill="white">✓</text><text x="72" y="313" font-size="14" fill="#303036">Kimi Code</text><rect x="35" y="360" width="202" height="40" rx="8" fill="#dceafa"/><text x="48" y="386" font-size="14" fill="#303036" font-weight="600">All Sessions</text><text x="48" y="427" font-size="14" fill="#303036">Pinned</text><text x="48" y="512" font-size="14" fill="#303036">sessions-chronicle</text><text x="48" y="569" font-size="14" fill="#303036">website</text><text x="276" y="185" font-size="20" fill="#65656b">✳</text><text x="310" y="182" font-size="16" fill="#303036" font-weight="600">Fix teammate session linking</text><text x="310" y="205" font-size="12" fill="#62626b">sessions-chronicle · 18 messages · 5 Sep 2026</text><text x="1055" y="189" font-size="24" fill="#303036">›</text><path d="M270 227H1074" stroke="#dedee2"/><text x="276" y="262" font-size="20" fill="#65656b">✳</text><text x="310" y="259" font-size="16" fill="#303036" font-weight="600">Investigate parser regression</text><text x="310" y="282" font-size="12"><tspan fill="#4a4a52" font-weight="600">Source missing</tspan><tspan fill="#62626b"> · sessions-chronicle · 42 messages · 4 Sep 2026</tspan></text><text x="1028" y="267" font-size="17" fill="#7a7a82">⊘</text><text x="1055" y="266" font-size="24" fill="#303036">›</text><path d="M270 304H1074" stroke="#dedee2"/><text x="276" y="339" font-size="20" fill="#65656b">✳</text><text x="310" y="336" font-size="16" fill="#303036" font-weight="600">Review database migration</text><text x="310" y="359" font-size="12" fill="#62626b">sessions-chronicle · 12 messages · 3 Sep 2026</text><text x="1055" y="343" font-size="24" fill="#303036">›</text><path d="M270 381H1074" stroke="#dedee2"/><text x="276" y="416" font-size="20" fill="#65656b">✳</text><text x="310" y="413" font-size="16" fill="#303036" font-weight="600">Draft the release notes</text><text x="310" y="436" font-size="12" fill="#62626b">website · 7 messages · 2 Sep 2026</text><text x="1055" y="420" font-size="24" fill="#303036">›</text><path d="M270 458H1074" stroke="#dedee2"/><text x="279" y="662" font-size="13" fill="#62626b">Missing sources stay readable, searchable, and pinnable from the local index. Resume in terminal is disabled.</text><text x="32" y="722" font-size="13" fill="#55555e">The leading “Source missing” segment is the last thing an ellipsis removes; a neutral suffix icon repeats it non-verbally.</text></g></svg>
