    <text x="688" y="14" fill="#6e6e6e" font-size="11" text-anchor="end">deterministic trail through the session</text>

    <line x1="28" y1="42" x2="28" y2="462" stroke="#4a4a4a" stroke-width="2"/>

    <circle cx="28" cy="66" r="8" fill="#3584e4"/>
    <rect x="56" y="42" width="632" height="56" rx="10" fill="#2d2d2d"/>
    <text x="76" y="63" fill="#8ab4f8" font-size="12" font-weight="700">START INTENT</text>
    <text x="76" y="82" class="body" font-size="13">Add deterministic session orientation above the transcript.</text>
    <text x="650" y="64" fill="#b0b0b0" font-size="11" text-anchor="end">Jump</text>
    <text x="650" y="82" class="dim" font-size="11" text-anchor="end">item 1</text>

    <circle cx="28" cy="148" r="8" fill="#26a269"/>
    <rect x="56" y="124" width="632" height="64" rx="10" fill="#2d2d2d"/>
    <text x="76" y="145" fill="#57d68d" font-size="12" font-weight="700">PEAK ACTIVITY</text>
    <text x="76" y="164" class="body" font-size="13">12 tool calls across 4 minutes while iterating on session_detail.rs.</text>
    <text x="76" y="180" class="dim" font-size="11">reads -> edits -> clippy -> edit retry</text>
    <text x="650" y="146" fill="#b0b0b0" font-size="11" text-anchor="end">Jump</text>
    <text x="650" y="164" class="dim" font-size="11" text-anchor="end">item 23</text>

    <circle cx="28" cy="238" r="8" fill="#e66100"/>
    <rect x="56" y="214" width="632" height="64" rx="10" fill="#2d2d2d"/>
    <text x="76" y="235" fill="#ffb070" font-size="12" font-weight="700">BIGGEST CHANGE</text>
    <text x="76" y="254" class="body" font-size="13">Edited exploration doc and added 2 new SVG mockups in the same pass.</text>
    <text x="76" y="270" class="dim" font-size="11">highest file-touch cluster in the session</text>
    <text x="650" y="236" fill="#b0b0b0" font-size="11" text-anchor="end">Jump</text>
    <text x="650" y="254" class="dim" font-size="11" text-anchor="end">item 31</text>

    <circle cx="28" cy="330" r="8" fill="#e01b24"/>
    <rect x="56" y="306" width="632" height="64" rx="10" fill="#331f21"/>
    <text x="76" y="327" fill="#ff8389" font-size="12" font-weight="700">FAILURE MOMENT</text>
    <text x="76" y="346" class="body" font-size="13">cargo clippy failed on a type mismatch before the layout was finalized.</text>
    <text x="76" y="362" class="dim" font-size="11">first error anchor, useful re-entry point</text>
    <text x="650" y="328" fill="#ffc0c4" font-size="11" text-anchor="end">Jump</text>
    <text x="650" y="346" class="dim" font-size="11" text-anchor="end">item 38</text>

    <circle cx="28" cy="422" r="8" fill="#c061cb"/>
    <rect x="56" y="398" width="632" height="64" rx="10" fill="#2d2d2d"/>
    <text x="76" y="419" fill="#d9a8df" font-size="12" font-weight="700">FINAL STATE</text>
    <text x="76" y="438" class="body" font-size="13">Document updated with two extra proposals; mockup request remains in progress.</text>
    <text x="76" y="454" class="dim" font-size="11">ends near the SVG generation step</text>
    <text x="650" y="420" fill="#b0b0b0" font-size="11" text-anchor="end">Jump</text>
    <text x="650" y="438" class="dim" font-size="11" text-anchor="end">item 54</text>
