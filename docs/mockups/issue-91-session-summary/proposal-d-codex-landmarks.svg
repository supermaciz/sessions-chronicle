<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <style>
      text { font-family: Cantarell, system-ui, sans-serif; }
      .mono { font-family: "Source Code Pro", monospace; }
      .dim { fill: #8b8b8b; }
      .body { fill: #d8d8d8; }
      .title { fill: #ffffff; font-weight: 700; }
    </style>
    <clipPath id="window-clip">
      <rect width="720" height="1280" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <rect width="720" height="1280" rx="12" fill="#1e1e1e"/>

  <rect x="0" y="0" width="720" height="47" fill="#2d2d2d" rx="12" clip-path="url(#window-clip)"/>
  <rect x="0" y="24" width="720" height="23" fill="#2d2d2d"/>
  <text x="18" y="30" fill="#b9b9b9" font-size="13" font-weight="600">&lt; Sessions</text>
  <text x="360" y="30" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Session Detail</text>
  <rect x="596" y="10" width="108" height="28" rx="7" fill="#3584e4"/>
  <text x="650" y="28" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Resume</text>

  <g transform="translate(16, 66)">
    <text x="0" y="24" class="title" font-size="22">sessions-chronicle</text>
    <text x="0" y="46" class="dim mono" font-size="12">/home/mcizo/Projets/sessions-chronicle</text>

    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="96" height="26" rx="13" fill="#3584e4" opacity="0.18"/>
      <circle cx="16" cy="13" r="6" fill="#3584e4"/>
      <text x="28" y="17" fill="#8ab4f8" font-size="12" font-weight="600">Codex</text>

      <rect x="108" y="0" width="74" height="26" rx="13" fill="#3d3d3d"/>
      <text x="145" y="17" fill="#d0d0d0" font-size="12" text-anchor="middle">1h 42m</text>

      <rect x="194" y="0" width="74" height="26" rx="13" fill="#e66100" opacity="0.15"/>
      <text x="231" y="17" fill="#ffb070" font-size="12" font-weight="600" text-anchor="middle">Abrupt</text>

      <rect x="280" y="0" width="86" height="26" rx="13" fill="#3d3d3d"/>
      <text x="323" y="17" fill="#d0d0d0" font-size="12" text-anchor="middle">54 items</text>
    </g>
  </g>

  <rect x="16" y="158" width="688" height="1" fill="#3a3a3a"/>

  <g transform="translate(16, 176)">
