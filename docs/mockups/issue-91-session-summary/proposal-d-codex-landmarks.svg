    <text x="20" y="49" fill="#d8d8d8" font-size="13">18 edits</text>
    <text x="128" y="49" fill="#d8d8d8" font-size="13">12 reads</text>
    <text x="236" y="49" fill="#d8d8d8" font-size="13">9 commands</text>
    <text x="360" y="49" fill="#d8d8d8" font-size="13">124 832 input</text>
    <text x="514" y="49" fill="#d8d8d8" font-size="13">18 456 output</text>
    <text x="20" y="67" class="dim" font-size="11">dense footer, global facts remain available without stealing the narrative focus</text>
  </g>

  <rect x="16" y="770" width="688" height="2" fill="#3a3a3a"/>

  <g transform="translate(16, 790)">
    <text x="0" y="16" fill="#8b8b8b" font-size="11" font-weight="700" letter-spacing="0.6">TRANSCRIPT</text>
    <text x="688" y="16" fill="#6e6e6e" font-size="11" text-anchor="end">jump targets come from landmarks above</text>

    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="688" height="72" rx="8" fill="rgba(255,255,255,0.03)"/>
      <rect x="0" y="0" width="3" height="72" rx="1.5" fill="#3584e4"/>
      <text x="14" y="18" fill="#7db0ff" font-size="12" font-weight="600">User</text>
      <text x="660" y="18" fill="#616161" font-size="11" text-anchor="end">14:08</text>
      <text x="14" y="40" class="body" font-size="13">Add deterministic session orientation above the transcript.</text>
      <text x="14" y="58" class="body" font-size="13">Please keep it native to GNOME and avoid decorative AI summaries.</text>
    </g>

    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="688" height="36" rx="6" fill="rgba(255,255,255,0.02)"/>
      <rect x="0" y="0" width="2" height="36" rx="1" fill="#e66100"/>
      <text x="14" y="14" fill="#ffb070" font-size="11" font-weight="600">Edit</text>
      <text x="60" y="14" fill="#909090" font-size="12">docs/explorations/2026-03-28-session-summary-exploration.md</text>
      <text x="14" y="29" fill="#57d68d" font-size="11">completed</text>
      <text x="660" y="22" fill="#616161" font-size="11" text-anchor="end">0.1s</text>
    </g>

    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="688" height="40" rx="6" fill="rgba(224,27,36,0.08)"/>
      <rect x="0" y="0" width="2" height="40" rx="1" fill="#e01b24"/>
      <text x="14" y="16" fill="#ff8389" font-size="11" font-weight="600">Bash</text>
      <text x="60" y="16" class="body" font-size="12">cargo clippy --all -- -D warnings</text>
      <text x="60" y="31" class="dim" font-size="11">mismatched type in session_detail.rs</text>
      <text x="660" y="23" fill="#616161" font-size="11" text-anchor="end">2.4s</text>
    </g>

    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="688" height="56" rx="8" fill="rgba(255,255,255,0.03)"/>
      <rect x="0" y="0" width="3" height="56" rx="1.5" fill="#26a269"/>
      <text x="14" y="18" fill="#57d68d" font-size="12" font-weight="600">Assistant</text>
      <text x="660" y="18" fill="#616161" font-size="11" text-anchor="end">14:25</text>
      <text x="14" y="40" class="body" font-size="13">The landmarks rail gives a sparse, deterministic table of contents for this session.</text>
    </g>
