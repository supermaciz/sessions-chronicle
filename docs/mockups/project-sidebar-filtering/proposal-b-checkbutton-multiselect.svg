<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="font-family: Cantarell, -apple-system, sans-serif;">
  <!-- Window frame -->
  <rect width="1000" height="720" fill="#f6f5f4" rx="12"/>

  <!-- Header Bar -->
  <rect width="1000" height="46" fill="#ffffff" rx="12"/>
  <rect y="12" width="1000" height="34" fill="#ffffff"/>

  <!-- View switcher -->
  <rect x="370" y="8" width="90" height="30" fill="#3584e4" rx="6"/>
