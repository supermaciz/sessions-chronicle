<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="-apple-system, 'Cantarell', system-ui, sans-serif" font-size="13">
  <style>
    .stroke { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
    .stroke-thin { fill: none; stroke: #d0d0d0; stroke-width: 1; }
    .stroke-mid { fill: none; stroke: #1a1a1a; stroke-width: 1; }
    .muted { fill: #777; font-size: 11px; }
    .accent { fill: #3584e4; }
    .accent-bg { fill: #3584e4; fill-opacity: 0.18; }
    .accent-stroke { fill: none; stroke: #3584e4; stroke-width: 1.4; }
    .green { fill: #2ec27e; }
    .title { font-size: 14px; font-weight: 600; }
    .pg-title { font-size: 11px; font-weight: 700; fill: #555; letter-spacing: 0.5px; }
    .row { font-size: 12.5px; }
    .badge-dim { font-size: 10.5px; fill: #888; font-variant-numeric: tabular-nums; }
    .ws { fill: #fafafa; }
    .sb { fill: #f4f4f4; }
    .card { fill: #ffffff; }
    .ok { font-size: 11px; fill: #2a7a4f; font-style: italic; }
    .anno { font-size: 10.5px; fill: #1a4a8c; font-style: italic; }
  </style>

  <text x="20" y="26" class="title">C — UI Designer (HIG / native libadwaita)</text>
  <text x="20" y="44" class="muted">AdwPreferencesGroup + boxed list AdwActionRow + "Clear" button in the sidebar headerbar</text>

  <!-- Window -->
  <rect x="20" y="62" width="600" height="518" rx="10" class="ws stroke"/>
  <!-- Main header bar -->
  <rect x="20" y="62" width="600" height="42" rx="10" fill="#ececec" class="stroke"/>
  <line x1="20" y1="104" x2="620" y2="104" class="stroke-mid"/>
  <circle cx="40" cy="83" r="6" class="stroke-thin"/>
  <text x="36" y="87" font-size="10">🔍</text>
  <text x="295" y="89" font-weight="600">Sessions</text>
  <text x="360" y="89" class="muted">Analytics</text>

  <!-- Sidebar -->
  <rect x="20" y="104" width="220" height="476" class="sb"/>
  <line x1="240" y1="104" x2="240" y2="580" class="stroke-mid"/>

  <!-- Sidebar headerbar — Adwaita pattern -->
  <rect x="20" y="104" width="220" height="36" fill="#ececec"/>
  <line x1="20" y1="140" x2="240" y2="140" class="stroke-thin"/>
  <text x="36" y="126" font-size="12.5" font-weight="600">Filters</text>
  <!-- Clear filters button (end) -->
  <rect x="180" y="113" width="48" height="18" rx="4" class="stroke-thin" fill="#fff"/>
  <text x="186" y="126" font-size="10">Clear</text>
  <text x="240" y="125" class="anno">← visible only when a filter is active</text>

  <!-- AdwPreferencesGroup #1 — AI Assistants -->
  <text x="36" y="162" class="pg-title">AI ASSISTANTS</text>

  <!-- Boxed list -->
  <rect x="28" y="170" width="204" height="120" rx="8" class="card stroke-thin"/>
  <line x1="28" y1="200" x2="232" y2="200" class="stroke-thin"/>
  <line x1="28" y1="230" x2="232" y2="230" class="stroke-thin"/>
  <line x1="28" y1="260" x2="232" y2="260" class="stroke-thin"/>

  <circle cx="46" cy="185" r="8" fill="#e9e9e9" class="stroke-thin"/>
  <text x="60" y="189" class="row">Claude Code</text>
  <rect x="208" y="178" width="16" height="14" rx="2" class="accent"/>

  <circle cx="46" cy="215" r="8" fill="#e9e9e9" class="stroke-thin"/>
  <text x="60" y="219" class="row">OpenCode</text>
  <rect x="208" y="208" width="16" height="14" rx="2" class="accent"/>

  <circle cx="46" cy="245" r="8" fill="#e9e9e9" class="stroke-thin"/>
  <text x="60" y="249" class="row">Codex</text>
  <rect x="208" y="238" width="16" height="14" rx="2" class="accent"/>

  <circle cx="46" cy="275" r="8" fill="#e9e9e9" class="stroke-thin"/>
  <text x="60" y="279" class="row">Mistral Vibe</text>
  <rect x="208" y="268" width="16" height="14" rx="2" class="accent"/>

  <text x="240" y="232" class="anno">AdwActionRow + suffix check</text>

  <!-- AdwPreferencesGroup #2 — Projects -->
  <text x="36" y="318" class="pg-title">PROJECTS</text>

  <rect x="28" y="326" width="204" height="180" rx="8" class="card stroke-thin"/>
  <line x1="28" y1="356" x2="232" y2="356" class="stroke-thin"/>
  <line x1="28" y1="386" x2="232" y2="386" class="stroke-thin"/>
  <line x1="28" y1="416" x2="232" y2="416" class="stroke-thin"/>
  <line x1="28" y1="446" x2="232" y2="446" class="stroke-thin"/>
  <line x1="28" y1="476" x2="232" y2="476" class="stroke-thin"/>

  <!-- selected row with accent bg overlay -->
  <rect x="28" y="326" width="204" height="30" rx="8" class="accent-bg"/>
  <text x="40" y="346" font-size="11" class="accent">📋</text>
  <text x="60" y="346" class="row" fill="#1a4a8c">All Sessions</text>
  <text x="222" y="346" class="badge-dim" text-anchor="end">898</text>

  <text x="40" y="376" font-size="11">📌</text>
  <text x="60" y="376" class="row">Pinned</text>
  <text x="222" y="376" class="badge-dim" text-anchor="end">0</text>

  <text x="40" y="406" font-size="11">📁</text>
  <text x="60" y="406" class="row">sessions-chronicle</text>
  <text x="222" y="406" class="badge-dim" text-anchor="end">720</text>

  <text x="40" y="436" font-size="11">📁</text>
  <text x="60" y="436" class="row">le_bon_fizzbuzz</text>
  <text x="222" y="436" class="badge-dim" text-anchor="end">23</text>

  <text x="40" y="466" font-size="11">📁</text>
  <text x="60" y="466" class="row">taftaf</text>
  <text x="222" y="466" class="badge-dim" text-anchor="end">21</text>

  <text x="40" y="496" font-size="11">📁</text>
  <text x="60" y="496" class="row">mcizo</text>
  <text x="222" y="496" class="badge-dim" text-anchor="end">7</text>

  <text x="240" y="416" class="anno">AdwActionRow + prefix icon</text>
  <text x="240" y="432" class="anno">no chevron (filter, not nav)</text>
  <text x="240" y="448" class="anno">counter as suffix .numeric .dim</text>

  <!-- Session list stub -->
  <rect x="252" y="120" width="356" height="56" rx="6" class="accent-bg accent-stroke"/>
  <circle cx="270" cy="142" r="9" fill="#fff" class="stroke-thin"/>
  <text x="288" y="142" font-size="12">$pr-quiz for PR 157…</text>
  <text x="288" y="160" class="muted">sessions-chronicle · 15 msg · 19 cmd · 15h</text>

  <rect x="252" y="186" width="356" height="56" rx="6" class="stroke-thin"/>
  <text x="288" y="208" font-size="12">/plugin</text>
  <text x="288" y="226" class="muted">sessions-chronicle · 21 msg · 8 edits · 17h</text>

  <rect x="252" y="252" width="356" height="56" rx="6" class="stroke-thin"/>
  <text x="288" y="274" font-size="12">Code review of last commit changes</text>
  <text x="288" y="292" class="muted">sessions-chronicle · 7 msg · 4 cmd · 17h</text>
</svg>
