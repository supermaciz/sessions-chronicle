  <text x="240" y="128" class="ok">↓ ~50px reclaimed, no decorative label</text>

  <!-- AI Assistants block (no title, just rows with icons + checkboxes) -->
  <g font-size="12.5">
    <rect x="32" y="132" width="14" height="14" rx="2" class="accent"/>
    <circle cx="58" cy="139" r="8" fill="#e9e9e9" class="stroke-thin"/>
    <text x="55" y="143" font-size="9">C</text>
    <text x="76" y="143">Claude Code</text>
    <text x="216" y="143" class="badge-dim" text-anchor="end">412</text>

    <rect x="32" y="156" width="14" height="14" rx="2" class="accent"/>
    <circle cx="58" cy="163" r="8" fill="#e9e9e9" class="stroke-thin"/>
    <text x="55" y="167" font-size="9">O</text>
    <text x="76" y="167">OpenCode</text>
    <text x="216" y="167" class="badge-dim" text-anchor="end">218</text>

    <rect x="32" y="180" width="14" height="14" rx="2" class="accent"/>
    <circle cx="58" cy="187" r="8" fill="#e9e9e9" class="stroke-thin"/>
    <text x="55" y="191" font-size="9">X</text>
    <text x="76" y="191">Codex</text>
    <text x="216" y="191" class="badge-dim" text-anchor="end">183</text>

    <rect x="32" y="204" width="14" height="14" rx="2" class="accent"/>
    <circle cx="58" cy="211" r="8" fill="#e9e9e9" class="stroke-thin"/>
    <text x="55" y="215" font-size="9">M</text>
    <text x="76" y="215">Mistral Vibe</text>
