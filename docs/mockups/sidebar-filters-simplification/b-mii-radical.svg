  <!-- Session list stub with 2-line hierarchy -->
  <rect x="252" y="116" width="356" height="64" rx="6" class="accent-bg accent-stroke"/>
  <circle cx="270" cy="148" r="9" fill="#fff" class="stroke-thin"/>
  <text x="288" y="140" font-size="12">$pr-quiz for PR 157…</text>
  <text x="288" y="156" font-size="11" fill="#555">sessions-chronicle</text>
