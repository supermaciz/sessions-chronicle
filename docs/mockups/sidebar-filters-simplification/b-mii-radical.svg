  <text x="40" y="350" class="row">le_bon_fizzbuzz</text>
  <text x="228" y="350" class="badge-dim" text-anchor="end">23</text>

  <text x="40" y="376" class="row">taftaf</text>
  <text x="228" y="376" class="badge-dim" text-anchor="end">21</text>

  <text x="40" y="402" class="row">mcizo</text>
