  <rect x="252" y="190" width="356" height="64" rx="6" class="stroke-thin"/>
  <text x="288" y="214" font-size="12">/plugin</text>
  <text x="288" y="230" font-size="11" fill="#555">sessions-chronicle</text>
  <text x="288" y="246" class="badge-dim">21 msg · 8 edits · 17h</text>

  <rect x="252" y="264" width="356" height="64" rx="6" class="stroke-thin"/>
  <text x="288" y="288" font-size="12">Code review of last commit changes</text>
  <text x="288" y="304" font-size="11" fill="#555">sessions-chronicle</text>
  <text x="288" y="320" class="badge-dim">7 msg · 4 cmd · 17h</text>

  <text x="252" y="356" class="ok">2-line meta hierarchy: project plain, metrics dimmed tabular</text>
