<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="Cantarell, sans-serif">
  <defs>
    <linearGradient id="selA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3584e4" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- page bg -->
  <rect width="720" height="640" fill="#fafafb"/>

  <!-- title -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1a1a1a">Proposal — Creative: Reading &#8644; Source mode (one transcript-wide toggle)</text>
  <text x="24" y="55" font-size="12.5" fill="#5e5c64">&#8220;Disable markdown&#8221; is reframed as a Source mode, like an editor&#8217;s reading/source twin. One header button flips the whole transcript to selectable raw text.</text>

  <!-- ===================== PANEL 1 : READING MODE ===================== -->
  <g transform="translate(24,80)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#3584e4">&#9312; Reading mode (default) &#8212; markdown rendered, selection is fragmented per block</text>

    <!-- window frame -->
    <rect x="0" y="12" width="316" height="478" rx="10" fill="#ffffff" stroke="#d6d4d2"/>
    <!-- headerbar -->
    <rect x="0" y="12" width="316" height="40" rx="10" fill="#f2f1f0"/>
    <rect x="0" y="36" width="316" height="16" fill="#f2f1f0"/>
    <path d="M10 30 l5 5 l5 -5" stroke="#5e5c64" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- the new toggle, inactive -->
    <rect x="36" y="20" width="48" height="24" rx="7" fill="#ffffff" stroke="#c0bfbc"/>
    <text x="60" y="36" font-size="12" font-weight="700" fill="#5e5c64" text-anchor="middle">&lt;/&gt;</text>
    <!-- center switcher hint -->
    <rect x="120" y="22" width="80" height="20" rx="10" fill="#e6e5e4"/>
    <text x="160" y="36" font-size="10.5" fill="#5e5c64" text-anchor="middle">Sessions</text>

    <!-- assistant message rendered -->
    <text x="16" y="78" font-size="11" font-weight="700" fill="#1a1a1a">Here is the plan:</text>
    <!-- a selection island: only this paragraph highlighted -->
    <rect x="14" y="88" width="232" height="32" rx="3" fill="url(#selA)"/>
    <text x="16" y="101" font-size="10.5" fill="#3d3846">Refactor the parser, then add a</text>
    <text x="16" y="115" font-size="10.5" fill="#3d3846">streaming reader for large files.</text>

    <!-- list -->
    <text x="20" y="138" font-size="10.5" fill="#3d3846">&#8226; stream with BufReader</text>
    <text x="20" y="154" font-size="10.5" fill="#3d3846">&#8226; handle malformed lines</text>

    <!-- code block widget (own island) -->
    <rect x="16" y="166" width="284" height="58" rx="6" fill="#f6f5f4" stroke="#e0dfdd"/>
    <text x="26" y="183" font-size="9.5" fill="#5e5c64">rust</text>
    <text x="26" y="200" font-size="10" font-family="monospace" fill="#3d3846">let f = BufReader::new(file);</text>
    <text x="26" y="214" font-size="10" font-family="monospace" fill="#3d3846">for line in f.lines() { ... }</text>

    <!-- caption: drag can't cross blocks -->
    <text x="16" y="248" font-size="9.5" fill="#c01c28">&#10006; drag-select stops at each block boundary</text>
    <text x="16" y="262" font-size="9.5" fill="#5e5c64">(label / code / table are separate selection islands)</text>

    <!-- dim rest -->
    <g fill="#ededed">
      <rect x="16" y="286" width="200" height="10" rx="3"/>
      <rect x="16" y="302" width="250" height="10" rx="3"/>
      <rect x="16" y="318" width="170" height="10" rx="3"/>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(348,300)">
    <text x="0" y="-6" font-size="11" font-weight="700" fill="#3584e4" text-anchor="middle">click &lt;/&gt;</text>
    <path d="M-14 6 L14 6" stroke="#3584e4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M8 0 L16 6 L8 12" stroke="#3584e4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 22 L-14 22" stroke="#3584e4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-8 16 L-16 22 L-8 28" stroke="#3584e4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===================== PANEL 2 : SOURCE MODE ===================== -->
  <g transform="translate(380,80)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#3584e4">&#9313; Source mode &#8212; one plain monospace block, whole message selectable</text>

    <rect x="0" y="12" width="316" height="478" rx="10" fill="#ffffff" stroke="#d6d4d2"/>
    <rect x="0" y="12" width="316" height="40" rx="10" fill="#f2f1f0"/>
    <rect x="0" y="36" width="316" height="16" fill="#f2f1f0"/>
    <path d="M10 30 l5 5 l5 -5" stroke="#5e5c64" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- toggle active -->
    <rect x="36" y="20" width="48" height="24" rx="7" fill="#3584e4"/>
    <text x="60" y="36" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <rect x="120" y="22" width="80" height="20" rx="10" fill="#e6e5e4"/>
    <text x="160" y="36" font-size="10.5" fill="#5e5c64" text-anchor="middle">Sessions</text>

    <!-- one continuous selection across the whole raw message -->
    <rect x="14" y="68" width="288" height="172" rx="4" fill="url(#selA)"/>
    <g font-family="monospace" font-size="10" fill="#3d3846">
      <text x="20" y="84">Here is the plan:</text>
      <text x="20" y="100"></text>
      <text x="20" y="116">Refactor the **parser**, then add a</text>
      <text x="20" y="132">streaming reader for large files.</text>
      <text x="20" y="148"></text>
      <text x="20" y="164">- stream with `BufReader`</text>
      <text x="20" y="180">- handle malformed lines</text>
      <text x="20" y="196"></text>
      <text x="20" y="212">```rust</text>
      <text x="20" y="228">let f = BufReader::new(file);</text>
    </g>

    <text x="16" y="262" font-size="9.5" fill="#26a269">&#10004; one drag selects the entire message &#8212; copy yields verbatim markdown</text>
    <text x="16" y="276" font-size="9.5" fill="#5e5c64">search highlight still works (single buffer)</text>

    <g font-family="monospace" font-size="10" fill="#9a9996">
      <text x="20" y="304">    for line in f.lines() {</text>
      <text x="20" y="320">        ...</text>
    </g>
  </g>

  <!-- ===================== PANEL 3 : PREFERENCES ===================== -->
  <g transform="translate(24,440)">
    <text x="0" y="135" font-size="12.5" font-weight="700" fill="#3584e4" transform="translate(0,-2)"></text>
  </g>

  <g transform="translate(24,470)">
    <text x="0" y="86" font-size="0" fill="none"></text>
  </g>

  <!-- preferences card spanning bottom -->
  <g transform="translate(24,452)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#3584e4">&#9314; Preferences &#8212; the scope axis is demoted to a sub-setting (only affects Reading mode)</text>
    <rect x="0" y="12" width="672" height="148" rx="12" fill="#ffffff" stroke="#d6d4d2"/>
    <text x="20" y="36" font-size="11" font-weight="700" fill="#5e5c64">Appearance</text>

    <!-- row 1: default view mode -->
    <rect x="14" y="46" width="644" height="46" rx="8" fill="#fafafb" stroke="#ececec"/>
    <text x="28" y="66" font-size="12" font-weight="700" fill="#1a1a1a">Default transcript mode</text>
    <text x="28" y="82" font-size="10.5" fill="#5e5c64">Remembers your last choice of the &lt;/&gt; toggle</text>
    <rect x="520" y="58" width="124" height="22" rx="7" fill="#ffffff" stroke="#c0bfbc"/>
    <text x="582" y="73" font-size="11" fill="#3d3846" text-anchor="middle">Reading &#9662;</text>

    <!-- row 2: scope -->
    <rect x="14" y="98" width="644" height="50" rx="8" fill="#fafafb" stroke="#ececec"/>
    <text x="28" y="118" font-size="12" font-weight="700" fill="#1a1a1a">Render markdown for</text>
    <text x="28" y="134" font-size="10.5" fill="#5e5c64">User messages are usually plain text; rendering them is optional</text>
    <rect x="500" y="111" width="144" height="22" rx="7" fill="#ffffff" stroke="#c0bfbc"/>
    <text x="572" y="126" font-size="11" fill="#3d3846" text-anchor="middle">Assistant only &#9662;</text>
  </g>
</svg>
