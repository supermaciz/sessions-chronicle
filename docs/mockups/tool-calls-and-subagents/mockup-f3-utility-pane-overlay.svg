<svg xmlns="http://www.w3.org/2000/svg" width="700" height="850" viewBox="0 0 700 850">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .headerbar-title { font-weight: 700; font-size: 15px; fill: #ffffff; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .expander-label { font-size: 13px; fill: #1e1e1e; font-weight: 700; }
      .expander-summary { font-size: 13px; fill: #636363; }
      .chevron { font-size: 13px; fill: #636363; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
      .section-label { font-size: 10px; fill: #77767b; font-weight: 700; letter-spacing: 0.8px; }
      .back-link { font-size: 13px; fill: #3584e4; font-weight: 500; }
      .inner-tool-name { font-size: 12px; fill: #1e1e1e; font-weight: 600; }
      .inner-tool-desc { font-size: 12px; fill: #77767b; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="paneShadow" x="-6%" y="-1%" width="112%" height="102%">
      <feDropShadow dx="-3" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="windowClip">
      <rect width="700" height="850" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#windowClip)">
    <!-- Background -->
    <rect width="700" height="850" fill="#fafafa" rx="12"/>

    <!-- ===== HEADERBAR ===== -->
    <rect width="700" height="47" fill="#303030" rx="12"/>
    <rect y="12" width="700" height="35" fill="#303030"/>
    <circle cx="24" cy="23" r="7" fill="#e04040" opacity="0.85"/>
    <circle cx="46" cy="23" r="7" fill="#e8a828" opacity="0.85"/>
    <circle cx="68" cy="23" r="7" fill="#2eb840" opacity="0.85"/>
    <text x="108" y="28" font-size="14" fill="#aaaaaa" font-family="Cantarell, sans-serif">&#x25C0;  Session Detail</text>
    <text x="350" y="28" text-anchor="middle" class="headerbar-title">Sessions Chronicle</text>

    <!-- Metadata bar -->
    <g transform="translate(16, 57)">
      <rect width="668" height="30" rx="6" fill="#ebebeb"/>
      <text x="10" y="20" font-size="11" fill="#636363" font-weight="700">Claude Code</text>
      <text x="102" y="20" font-size="11" fill="#929292">~/Projects/myapp  |  6 tool calls  |  1 subagent</text>
    </g>

    <!-- ===== TRANSCRIPT (dimmed, visible behind overlay pane) ===== -->
    <g opacity="0.5">
      <!-- User message -->
      <g transform="translate(16, 99)">
        <rect width="668" height="50" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect width="3" height="50" rx="1.5" fill="#3584e4"/>
        <text x="16" y="19" class="role-label" fill="#3584e4">USER</text>
        <text x="16" y="38" class="msg-text">Can you read the config file and fix the bug?</text>
      </g>
      <!-- Assistant message -->
      <g transform="translate(16, 161)">
        <rect width="668" height="42" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
        <rect width="3" height="42" rx="1.5" fill="#26a269"/>
        <text x="16" y="19" class="role-label" fill="#26a269">ASSISTANT</text>
        <text x="16" y="34" class="msg-text">Let me check the configuration file first.</text>
      </g>
      <!-- Tool calls -->
      <g transform="translate(16, 215)">
        <rect width="668" height="42" rx="10" fill="#ffffff"/>
        <rect width="3" height="42" rx="1.5" fill="#e66100"/>
        <text x="38" y="27" class="expander-label">Read</text>
        <text x="76" y="27" class="expander-summary">&#x2014;  src/config.rs</text>
      </g>
      <g transform="translate(16, 269)">
        <rect width="668" height="42" rx="10" fill="#ffffff"/>
        <rect width="3" height="42" rx="1.5" fill="#e66100"/>
        <text x="38" y="27" class="expander-label">Bash</text>
        <text x="76" y="27" class="expander-summary">&#x2014;  cargo test</text>
      </g>
      <g transform="translate(16, 323)">
        <rect width="668" height="42" rx="10" fill="#ffffff"/>
        <rect width="3" height="42" rx="1.5" fill="#26a269"/>
        <text x="16" y="27" class="msg-text" fill="#77767b">I found the issue...</text>
      </g>
      <g transform="translate(16, 377)">
        <rect width="668" height="42" rx="10" fill="#ffffff"/>
        <rect width="3" height="42" rx="1.5" fill="#e66100"/>
        <text x="38" y="27" class="expander-label">Edit</text>
      </g>
      <g transform="translate(16, 431)">
        <rect width="668" height="42" rx="10" fill="#ffffff"/>
        <rect width="3" height="42" rx="1.5" fill="#613583"/>
        <text x="38" y="27" font-size="13" fill="#613583" font-weight="700">Task</text>
        <text x="76" y="27" class="expander-summary">&#x2014;  Code review</text>
      </g>
    </g>

    <!-- ===== OVERLAY UTILITY PANE (floats on right) ===== -->
    <g transform="translate(380, 47)" filter="url(#paneShadow)">
      <rect width="320" height="803" fill="#ffffff"/>

      <!-- Pane header with back button (subagent stack: showing inner tool) -->
      <rect width="320" height="42" fill="#f3eef8"/>
      <line x1="0" y1="42" x2="320" y2="42" stroke="#d5d3d0" stroke-width="1"/>
      <text x="14" y="27" class="back-link">&#x25C0; Task: Code review</text>
      <!-- Close pane button -->
      <rect x="278" y="9" width="28" height="24" rx="6" fill="#deddda"/>
      <text x="292" y="26" font-size="12" fill="#3d3846" text-anchor="middle" font-weight="bold">&#x2715;</text>

      <!-- Breadcrumb -->
      <g transform="translate(14, 54)">
        <rect width="292" height="22" rx="6" fill="#f3eef8"/>
        <text x="8" y="15" font-size="9" fill="#613583">&#x1F500; Task</text>
        <text x="60" y="15" font-size="9" fill="#77767b">&#x203A;</text>
        <text x="72" y="15" font-size="9" fill="#e66100" font-weight="600">&#x1F4C4; Read: src/config.rs</text>
      </g>

      <!-- Tool header -->
      <g transform="translate(14, 90)">
        <text x="0" y="18" font-size="16">&#x1F4C4;</text>
        <text x="26" y="16" font-size="14" fill="#1e1e1e" font-weight="700">Read</text>
        <rect x="70" y="2" width="52" height="18" rx="9" fill="#daf5e7"/>
        <text x="80" y="15" font-size="9" fill="#26a269" font-weight="500">Success</text>
        <rect x="128" y="2" width="44" height="18" rx="9" fill="#f0f0f0"/>
        <text x="137" y="15" font-size="9" fill="#77767b">120ms</text>
      </g>

      <!-- Input -->
      <g transform="translate(14, 120)">
        <text x="0" y="14" class="section-label">INPUT</text>
        <rect x="0" y="20" width="292" height="26" rx="6" fill="#f6f5f4"/>
        <text x="10" y="38" font-size="11" fill="#1e1e1e" class="mono">file_path: src/config.rs</text>
      </g>

      <!-- Output -->
      <g transform="translate(14, 178)">
        <text x="0" y="14" class="section-label">OUTPUT</text>
        <rect x="0" y="22" width="292" height="360" rx="8" fill="#2d2d2d"/>
        <!-- Header -->
        <rect x="0" y="22" width="292" height="22" rx="8" fill="#383838"/>
        <rect x="0" y="32" width="292" height="12" fill="#383838"/>
        <text x="10" y="38" font-size="10" fill="#9a9996" class="mono">src/config.rs</text>

        <!-- Code -->
        <text x="10" y="60" font-size="10" class="mono" fill="#6e6e6e"> 1</text>
        <text x="28" y="60" font-size="10" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> serde::{Deserialize, Serialize};</text>

        <text x="10" y="76" font-size="10" class="mono" fill="#6e6e6e"> 2</text>
        <text x="28" y="76" font-size="10" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> std::path::PathBuf;</text>

        <text x="10" y="92" font-size="10" class="mono" fill="#6e6e6e"> 3</text>

        <text x="10" y="108" font-size="10" class="mono" fill="#6e6e6e"> 4</text>
        <text x="28" y="108" font-size="10" class="mono" fill="#dcdcdc">#[<tspan fill="#e5c07b">derive</tspan>(Deserialize, Serialize)]</text>

        <text x="10" y="124" font-size="10" class="mono" fill="#6e6e6e"> 5</text>
        <text x="28" y="124" font-size="10" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">pub struct</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

        <text x="10" y="140" font-size="10" class="mono" fill="#6e6e6e"> 6</text>
        <text x="28" y="140" font-size="10" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> database_path: <tspan fill="#e5c07b">PathBuf</tspan>,</text>

        <text x="10" y="156" font-size="10" class="mono" fill="#6e6e6e"> 7</text>
        <text x="28" y="156" font-size="10" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> theme: <tspan fill="#e5c07b">String</tspan>,</text>

        <text x="10" y="172" font-size="10" class="mono" fill="#6e6e6e"> 8</text>
        <text x="28" y="172" font-size="10" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> max_sessions: <tspan fill="#e5c07b">usize</tspan>,</text>

        <text x="10" y="188" font-size="10" class="mono" fill="#6e6e6e"> 9</text>
        <text x="28" y="188" font-size="10" class="mono" fill="#e06c75">    // BUG: panics if missing</text>

        <text x="10" y="204" font-size="10" class="mono" fill="#6e6e6e">10</text>
        <text x="28" y="204" font-size="10" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> api_key: <tspan fill="#e5c07b">String</tspan>,</text>

        <text x="10" y="220" font-size="10" class="mono" fill="#6e6e6e">11</text>
        <text x="28" y="220" font-size="10" class="mono" fill="#dcdcdc">}</text>

        <text x="10" y="236" font-size="10" class="mono" fill="#6e6e6e">12</text>

        <text x="10" y="252" font-size="10" class="mono" fill="#6e6e6e">13</text>
        <text x="28" y="252" font-size="10" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">impl</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

        <text x="10" y="268" font-size="10" class="mono" fill="#6e6e6e">14</text>
        <text x="28" y="268" font-size="10" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub fn</tspan> <tspan fill="#61afef">load</tspan>() -&gt; <tspan fill="#e5c07b">Self</tspan> {</text>

        <text x="10" y="284" font-size="10" class="mono" fill="#6e6e6e">15</text>
        <text x="28" y="284" font-size="10" class="mono" fill="#dcdcdc">        <tspan fill="#c678dd">let</tspan> path = dirs::config_dir()</text>

        <text x="10" y="300" font-size="10" class="mono" fill="#6e6e6e">16</text>
        <text x="28" y="300" font-size="10" class="mono" fill="#dcdcdc">            .unwrap()</text>
      </g>

      <!-- Subagent siblings navigation -->
      <line x1="14" y1="568" x2="306" y2="568" stroke="#e8e6e3" stroke-width="1"/>
      <text x="14" y="586" class="section-label">TOOL CALLS IN THIS SUBAGENT</text>

      <g transform="translate(14, 594)">
        <rect width="292" height="28" rx="6" fill="#fde3c8"/>
        <text x="8" y="19" font-size="10">&#x1F4C4;</text>
        <text x="26" y="20" font-size="10" fill="#e66100" font-weight="600">Read</text>
        <text x="60" y="20" font-size="10" fill="#77767b">src/config.rs</text>

        <rect y="32" width="292" height="28" rx="6" fill="#f6f5f4"/>
        <text x="8" y="51" font-size="10">&#x1F4C4;</text>
        <text x="26" y="52" font-size="10" fill="#1e1e1e" font-weight="500">Read</text>
        <text x="60" y="52" font-size="10" fill="#77767b">src/config_test.rs</text>
        <text x="282" y="52" font-size="10" fill="#3584e4" text-anchor="end">&#x203A;</text>

        <rect y="64" width="292" height="28" rx="6" fill="#f6f5f4"/>
        <text x="8" y="83" font-size="10">&#x1F50D;</text>
        <text x="26" y="84" font-size="10" fill="#1e1e1e" font-weight="500">Grep</text>
        <text x="62" y="84" font-size="10" fill="#77767b">"unwrap()" in src/</text>
        <text x="282" y="84" font-size="10" fill="#3584e4" text-anchor="end">&#x203A;</text>
      </g>

      <!-- Swipe hint -->
      <text x="160" y="720" text-anchor="middle" font-size="9" fill="#9a9996">Swipe right to close  |  &#x2191;&#x2193; navigate</text>

      <!-- Swipe gesture indicator (subtle edge line) -->
      <rect x="0" y="100" width="3" height="600" rx="1.5" fill="#c0bfbc" opacity="0.3"/>
    </g>
  </g>

  <!-- ===== ANNOTATION LABEL ===== -->
  <rect x="80" y="832" width="540" height="18" fill="#3584e4" rx="6" opacity="0.9"/>
  <text x="350" y="845" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">DESIGN F: Utility Pane (narrow) -- AdwOverlaySplitView collapsed, pane floats over transcript</text>
</svg>