<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="font-family: Cantarell, -apple-system, sans-serif;">
  <defs>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <!-- Panel shadow -->
    <filter id="panelShadow" x="-4%" y="-1%" width="108%" height="102%">
      <feDropShadow dx="-2" dy="0" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <!-- Badge shadow (subtle elevation) -->
    <filter id="badgeShadow" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <!-- Clip for window rounded corners -->
    <clipPath id="windowClip">
      <rect width="1200" height="800" rx="12"/>
    </clipPath>
  </defs>

  <!-- ============================================ -->
  <!-- Window Frame                                  -->
  <!-- ============================================ -->
  <g clip-path="url(#windowClip)">
    <rect width="1200" height="800" fill="#fafafa" rx="12"/>

    <!-- ============================================ -->
    <!-- GNOME Header Bar                             -->
    <!-- ============================================ -->
    <rect width="1200" height="47" fill="#ebebeb"/>
    <!-- Bottom border of headerbar -->
    <line x1="0" y1="47" x2="1200" y2="47" stroke="#d5d3d0" stroke-width="1"/>

    <!-- Window controls (left, GNOME style) -->
    <circle cx="20" cy="23" r="7" fill="#e74c3c" opacity="0.8"/>
    <circle cx="42" cy="23" r="7" fill="#f39c12" opacity="0.8"/>
    <circle cx="64" cy="23" r="7" fill="#2ecc71" opacity="0.8"/>

    <!-- Back button -->
    <rect x="88" y="8" width="36" height="30" fill="#deddda" rx="6"/>
    <text x="100" y="28" font-size="16" fill="#3d3846" text-anchor="middle" font-weight="bold">&lt;</text>

    <!-- Title centered in left portion -->
    <text x="440" y="29" font-size="14" font-weight="600" fill="#1e1e1e">Sessions Chronicle</text>

    <!-- Header right actions for transcript side -->
    <rect x="602" y="8" width="100" height="30" fill="#3584e4" rx="6"/>
    <text x="618" y="28" font-size="11" font-weight="500" fill="#ffffff">Resume in Term</text>

    <!-- Separator between transcript and panel in headerbar -->
    <line x1="720" y1="8" x2="720" y2="39" stroke="#c0bfbc" stroke-width="1"/>

    <!-- Panel header title -->
    <text x="870" y="29" font-size="13" font-weight="600" fill="#1e1e1e" text-anchor="middle">Tool Detail</text>
    <!-- Close panel button -->
    <rect x="1148" y="8" width="30" height="30" fill="#deddda" rx="6"/>
    <text x="1163" y="28" font-size="14" fill="#3d3846" text-anchor="middle" font-weight="bold">X</text>


    <!-- ============================================ -->
    <!-- Session Metadata Bar                         -->
    <!-- ============================================ -->
    <rect x="0" y="47" width="720" height="42" fill="#ffffff"/>
    <line x1="0" y1="89" x2="720" y2="89" stroke="#e8e6e3" stroke-width="1"/>

    <text x="16" y="73" font-size="11" fill="#77767b">Project:</text>
    <text x="62" y="73" font-size="11" fill="#1e1e1e" font-weight="500">~/projects/my-app</text>
    <text x="220" y="73" font-size="11" fill="#77767b">Tool:</text>
    <rect x="248" y="60" width="76" height="20" fill="#3584e4" rx="10"/>
    <text x="260" y="74" font-size="10" fill="#ffffff" font-weight="500">Claude Code</text>
    <text x="344" y="73" font-size="11" fill="#77767b">Messages:</text>
    <text x="404" y="73" font-size="11" fill="#1e1e1e">12</text>
    <text x="440" y="73" font-size="11" fill="#77767b">Tools:</text>
    <text x="475" y="73" font-size="11" fill="#1e1e1e">4</text>
    <text x="520" y="73" font-size="11" fill="#77767b">Started:</text>
    <text x="572" y="73" font-size="11" fill="#1e1e1e">35 min ago</text>


    <!-- ============================================ -->
    <!-- LEFT: Transcript Area (~60%)                 -->
    <!-- ============================================ -->
    <rect x="0" y="89" width="720" height="711" fill="#fafafa"/>

    <!-- Vertical separator between transcript and panel -->
    <line x1="720" y1="47" x2="720" y2="800" stroke="#d5d3d0" stroke-width="1"/>


    <!-- ======== Message 1: User ======== -->
    <g filter="url(#cardShadow)">
      <rect x="16" y="105" width="688" height="64" fill="#ffffff" rx="12"/>
    </g>
    <!-- Blue left border -->
    <rect x="16" y="105" width="3" height="64" fill="#3584e4" rx="1.5"/>
    <!-- Role label -->
    <text x="32" y="124" font-size="10" font-weight="700" fill="#3584e4" letter-spacing="0.5">USER</text>
    <text x="670" y="124" font-size="9" fill="#9a9996">14:30:22</text>
    <!-- Message text -->
    <text x="32" y="143" font-size="13" fill="#1e1e1e">Can you read the config file and fix the bug?</text>
    <text x="32" y="160" font-size="12" fill="#77767b">The app crashes when loading settings from src/config.rs.</text>


    <!-- ======== Message 2: Assistant ======== -->
    <g filter="url(#cardShadow)">
      <rect x="16" y="185" width="688" height="50" fill="#ffffff" rx="12"/>
    </g>
    <!-- Green left border -->
    <rect x="16" y="185" width="3" height="50" fill="#26a269" rx="1.5"/>
    <text x="32" y="204" font-size="10" font-weight="700" fill="#26a269" letter-spacing="0.5">ASSISTANT</text>
    <text x="670" y="204" font-size="9" fill="#9a9996">14:30:28</text>
    <text x="32" y="224" font-size="13" fill="#1e1e1e">Let me check the configuration file first.</text>


    <!-- ======== Tool Badge 1: Read (SELECTED) ======== -->
    <g filter="url(#badgeShadow)">
      <rect x="30" y="251" width="110" height="30" fill="#fde3c8" rx="15" stroke="#e66100" stroke-width="1.5"/>
    </g>
    <text x="48" y="271" font-size="13">&#x1F4C4;</text>
    <text x="68" y="270" font-size="12" font-weight="600" fill="#e66100">Read</text>
    <!-- Small arrow indicating this badge is selected and shown in panel -->
    <text x="120" y="270" font-size="10" fill="#e66100">&#x25B6;</text>

    <!-- ======== Tool Badge 2: Bash ======== -->
    <g filter="url(#badgeShadow)">
      <rect x="152" y="251" width="108" height="30" fill="#fff3e6" rx="15" stroke="#e66100" stroke-width="1"/>
    </g>
    <text x="170" y="271" font-size="13">&#x2699;&#xFE0F;</text>
    <text x="190" y="270" font-size="12" font-weight="500" fill="#c55700">Bash</text>


    <!-- ======== Message 3: Assistant ======== -->
    <g filter="url(#cardShadow)">
      <rect x="16" y="297" width="688" height="64" fill="#ffffff" rx="12"/>
    </g>
    <rect x="16" y="297" width="3" height="64" fill="#26a269" rx="1.5"/>
    <text x="32" y="316" font-size="10" font-weight="700" fill="#26a269" letter-spacing="0.5">ASSISTANT</text>
    <text x="670" y="316" font-size="9" fill="#9a9996">14:30:55</text>
    <text x="32" y="336" font-size="13" fill="#1e1e1e">I found the issue. The config parser doesn't handle missing</text>
    <text x="32" y="353" font-size="13" fill="#1e1e1e">fields gracefully. Let me fix it.</text>


    <!-- ======== Tool Badge 3: Edit ======== -->
    <g filter="url(#badgeShadow)">
      <rect x="30" y="377" width="104" height="30" fill="#fff3e6" rx="15" stroke="#e66100" stroke-width="1"/>
    </g>
    <text x="48" y="397" font-size="13">&#x270F;&#xFE0F;</text>
    <text x="68" y="396" font-size="12" font-weight="500" fill="#c55700">Edit</text>

    <!-- ======== Tool Badge 4: Task (Subagent) ======== -->
    <g filter="url(#badgeShadow)">
      <rect x="146" y="377" width="140" height="30" fill="#f0ecfe" rx="15" stroke="#813d9c" stroke-width="1"/>
    </g>
    <text x="164" y="397" font-size="13">&#x1F500;</text>
    <text x="184" y="396" font-size="12" font-weight="500" fill="#813d9c">Subagent</text>


    <!-- ======== Message 4: Assistant (final) ======== -->
    <g filter="url(#cardShadow)">
      <rect x="16" y="423" width="688" height="64" fill="#ffffff" rx="12"/>
    </g>
    <rect x="16" y="423" width="3" height="64" fill="#26a269" rx="1.5"/>
    <text x="32" y="442" font-size="10" font-weight="700" fill="#26a269" letter-spacing="0.5">ASSISTANT</text>
    <text x="670" y="442" font-size="9" fill="#9a9996">14:31:30</text>
    <text x="32" y="462" font-size="13" fill="#1e1e1e">Done! The config has been updated. The parser now uses</text>
    <text x="32" y="479" font-size="13" fill="#1e1e1e">Option&lt;T&gt; with sensible defaults for all fields.</text>


    <!-- ======== Cost/Token summary footer ======== -->
    <rect x="0" y="760" width="720" height="40" fill="#f0f0f0"/>
    <line x1="0" y1="760" x2="720" y2="760" stroke="#e8e6e3" stroke-width="1"/>
    <text x="16" y="784" font-size="11" fill="#77767b">Tokens: 4,230 in / 1,892 out</text>
    <text x="250" y="784" font-size="11" fill="#77767b">Cost: $0.08</text>
    <text x="400" y="784" font-size="11" fill="#77767b">Duration: 68s</text>

    <!-- Scroll indicator (transcript) -->
    <rect x="712" y="100" width="4" height="660" fill="transparent"/>
    <rect x="712" y="100" width="4" height="200" fill="#c0bfbc" rx="2" opacity="0.6"/>


    <!-- ============================================ -->
    <!-- RIGHT: Detail Panel (~40%)                   -->
    <!-- ============================================ -->
    <g filter="url(#panelShadow)">
      <rect x="720" y="47" width="480" height="753" fill="#ffffff"/>
    </g>

    <!-- Tool info header with warm tint -->
    <rect x="720" y="47" width="480" height="52" fill="#fdf6ee"/>
    <line x1="720" y1="99" x2="1200" y2="99" stroke="#e8e6e3" stroke-width="1"/>

    <!-- Tool icon and name -->
    <text x="740" y="78" font-size="20">&#x1F4C4;</text>
    <text x="766" y="76" font-size="15" font-weight="700" fill="#e66100">Read</text>
    <!-- Status pill -->
    <rect x="816" y="62" width="60" height="20" fill="#daf5e7" rx="10"/>
    <text x="828" y="76" font-size="10" font-weight="500" fill="#26a269">Success</text>
    <!-- Timestamp and duration -->
    <text x="1100" y="72" font-size="10" fill="#9a9996" text-anchor="end">14:30:32</text>
    <text x="1100" y="88" font-size="10" fill="#9a9996" text-anchor="end">120ms</text>


    <!-- ======== Input section ======== -->
    <text x="740" y="124" font-size="11" font-weight="700" fill="#77767b" letter-spacing="0.8">INPUT</text>

    <!-- File path display -->
    <rect x="740" y="132" width="440" height="30" fill="#f6f5f4" rx="6"/>
    <text x="752" y="151" font-size="12" font-family="Source Code Pro, monospace" fill="#1e1e1e">file_path: src/config.rs</text>


    <!-- ======== Output section ======== -->
    <text x="740" y="188" font-size="11" font-weight="700" fill="#77767b" letter-spacing="0.8">OUTPUT</text>

    <!-- Code block container -->
    <rect x="740" y="196" width="440" height="380" fill="#2d2d2d" rx="8"/>

    <!-- Code block header bar -->
    <rect x="740" y="196" width="440" height="28" fill="#383838" rx="8"/>
    <rect x="740" y="212" width="440" height="12" fill="#383838"/>
    <text x="756" y="215" font-size="11" fill="#9a9996" font-family="Source Code Pro, monospace">src/config.rs</text>
    <!-- Copy button -->
    <rect x="1138" y="200" width="32" height="20" fill="#4a4a4a" rx="4"/>
    <text x="1146" y="214" font-size="9" fill="#c0bfbc">Copy</text>

    <!-- Line numbers + code content with syntax highlighting -->
    <text x="752" y="244" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 1</text>
    <text x="780" y="244" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> serde::{Deserialize, Serialize};</text>

    <text x="752" y="262" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 2</text>
    <text x="780" y="262" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> std::path::PathBuf;</text>

    <text x="752" y="280" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 3</text>

    <text x="752" y="298" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 4</text>
    <text x="780" y="298" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">#[<tspan fill="#e5c07b">derive</tspan>(Deserialize, Serialize)]</text>

    <text x="752" y="316" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 5</text>
    <text x="780" y="316" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc"><tspan fill="#c678dd">pub struct</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

    <text x="752" y="334" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 6</text>
    <text x="780" y="334" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> database_path: <tspan fill="#e5c07b">PathBuf</tspan>,</text>

    <text x="752" y="352" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 7</text>
    <text x="780" y="352" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> theme: <tspan fill="#e5c07b">String</tspan>,</text>

    <text x="752" y="370" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 8</text>
    <text x="780" y="370" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> max_sessions: <tspan fill="#e5c07b">usize</tspan>,</text>

    <text x="752" y="388" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e"> 9</text>
    <text x="780" y="388" font-size="11" font-family="Source Code Pro, monospace" fill="#e06c75">    // BUG: this field panics if missing</text>

    <text x="752" y="406" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">10</text>
    <text x="780" y="406" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> api_key: <tspan fill="#e5c07b">String</tspan>,</text>

    <text x="752" y="424" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">11</text>
    <text x="780" y="424" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">}</text>

    <text x="752" y="442" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">12</text>

    <text x="752" y="460" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">13</text>
    <text x="780" y="460" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc"><tspan fill="#c678dd">impl</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

    <text x="752" y="478" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">14</text>
    <text x="780" y="478" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">    <tspan fill="#c678dd">pub fn</tspan> <tspan fill="#61afef">load</tspan>() -&gt; <tspan fill="#e5c07b">Self</tspan> {</text>

    <text x="752" y="496" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">15</text>
    <text x="780" y="496" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">        <tspan fill="#c678dd">let</tspan> path = dirs::config_dir()</text>

    <text x="752" y="514" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">16</text>
    <text x="780" y="514" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">            .unwrap()</text>

    <text x="752" y="532" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">17</text>
    <text x="780" y="532" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">            .join(<tspan fill="#98c379">"myapp.toml"</tspan>);</text>

    <text x="752" y="550" font-size="11" font-family="Source Code Pro, monospace" fill="#6e6e6e">18</text>
    <text x="780" y="550" font-size="11" font-family="Source Code Pro, monospace" fill="#dcdcdc">        <tspan fill="#c678dd">let</tspan> data = std::fs::read_to_string(path)</text>

    <text x="752" y="568" font-size="11" font-family="Source Code Pro, monospace" fill="#e06c75">19</text>
    <text x="780" y="568" font-size="11" font-family="Source Code Pro, monospace" fill="#e06c75">            .unwrap(); // panics here</text>

    <!-- Scroll indicator for code block -->
    <rect x="1172" y="230" width="3" height="336" fill="transparent"/>
    <rect x="1172" y="230" width="3" height="150" fill="#5a5a5a" rx="1.5"/>


    <!-- ======== Panel bottom: tool call navigation ======== -->
    <line x1="720" y1="590" x2="1200" y2="590" stroke="#e8e6e3" stroke-width="1"/>

    <rect x="740" y="604" width="440" height="32" fill="#f6f5f4" rx="8"/>
    <text x="760" y="624" font-size="11" fill="#77767b">Tool calls in this session:</text>

    <!-- Mini badge navigation list -->
    <!-- Read (current/selected) -->
    <rect x="745" y="648" width="80" height="24" fill="#fde3c8" rx="12" stroke="#e66100" stroke-width="1.5"/>
    <text x="758" y="664" font-size="10" font-weight="600" fill="#e66100">&#x1F4C4; Read</text>

    <!-- Bash -->
    <rect x="833" y="648" width="80" height="24" fill="#fff3e6" rx="12" stroke="#e66100" stroke-width="0.5"/>
    <text x="848" y="664" font-size="10" fill="#c55700">&#x2699;&#xFE0F; Bash</text>

    <!-- Edit -->
    <rect x="921" y="648" width="76" height="24" fill="#fff3e6" rx="12" stroke="#e66100" stroke-width="0.5"/>
    <text x="935" y="664" font-size="10" fill="#c55700">&#x270F;&#xFE0F; Edit</text>

    <!-- Subagent -->
    <rect x="1005" y="648" width="106" height="24" fill="#f0ecfe" rx="12" stroke="#813d9c" stroke-width="0.5"/>
    <text x="1016" y="664" font-size="10" fill="#813d9c">&#x1F500; Subagent</text>

    <!-- Keyboard shortcut hint -->
    <text x="760" y="700" font-size="10" fill="#9a9996">Click a badge in the transcript or use arrow keys to navigate</text>

  </g>

  <!-- ============================================ -->
  <!-- Annotation label at bottom                    -->
  <!-- ============================================ -->
  <rect x="380" y="774" width="440" height="22" fill="#3584e4" rx="6" opacity="0.9"/>
  <text x="600" y="789" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">DESIGN A: Badges + Panel -- Tool calls as inline badges, detail in side panel</text>
</svg>