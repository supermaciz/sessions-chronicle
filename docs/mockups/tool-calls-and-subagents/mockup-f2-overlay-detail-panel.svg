<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .headerbar-title { font-weight: 700; font-size: 15px; fill: #ffffff; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .expander-label { font-size: 13px; fill: #1e1e1e; font-weight: 700; }
      .expander-summary { font-size: 13px; fill: #636363; }
      .chevron { font-size: 13px; fill: #636363; }
      .terminal-text { font-size: 12px; fill: #d0d0d0; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
      .section-label { font-size: 10px; fill: #77767b; font-weight: 700; letter-spacing: 0.8px; }
      .panel-title { font-size: 15px; fill: #1e1e1e; font-weight: 700; }
      .back-link { font-size: 13px; fill: #3584e4; font-weight: 500; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="insetShadow" x="-1%" y="-1%" width="102%" height="104%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="overlayShadow" x="-4%" y="-2%" width="108%" height="104%">
      <feDropShadow dx="-3" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="950" fill="#fafafa" rx="12"/>

  <!-- ===== HEADERBAR ===== -->
  <rect width="900" height="47" fill="#303030" rx="12"/>
  <rect y="12" width="900" height="35" fill="#303030"/>
  <circle cx="24" cy="23" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="23" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="23" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="450" y="28" text-anchor="middle" class="headerbar-title">Sessions Chronicle</text>
  <text x="108" y="28" font-size="14" fill="#aaaaaa" font-family="Cantarell, sans-serif">&#x25C0;  Session Detail</text>

  <!-- Session metadata bar -->
  <g transform="translate(32, 65)">
    <rect width="836" height="36" rx="8" fill="#ebebeb"/>
    <text x="14" y="23" font-size="12" fill="#636363" font-family="Cantarell, sans-serif" font-weight="700">Claude Code</text>
    <text x="120" y="23" font-size="12" fill="#929292" font-family="Cantarell, sans-serif">~/Projects/myapp  |  12 messages  |  6 tool calls  |  1 subagent</text>
  </g>

  <!-- ===== TRANSCRIPT (dimmed behind overlay) ===== -->
  <g opacity="0.35">
    <!-- Message 1: User -->
    <g transform="translate(32, 117)">
      <rect width="836" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect width="3" height="60" rx="1.5" fill="#3584e4"/>
      <text x="18" y="22" class="role-label" fill="#3584e4">USER</text>
      <text x="18" y="44" class="msg-text">Can you read the config file, fix the bug, and run the tests?</text>
    </g>
    <!-- Message 2: Assistant -->
    <g transform="translate(32, 189)">
      <rect width="836" height="48" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect width="3" height="48" rx="1.5" fill="#26a269"/>
      <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
      <text x="18" y="38" class="msg-text">Let me check the configuration file first.</text>
    </g>
    <!-- Tool calls (dimmed) -->
    <g transform="translate(32, 249)">
      <rect width="836" height="46" rx="10" fill="#ffffff"/>
      <rect width="3" height="46" rx="1.5" fill="#e66100"/>
      <text x="42" y="30" class="expander-label">Read</text>
    </g>
    <g transform="translate(32, 307)">
      <rect width="836" height="46" rx="10" fill="#ffffff"/>
      <rect width="3" height="46" rx="1.5" fill="#e66100"/>
      <text x="42" y="30" class="expander-label">Bash</text>
    </g>
    <g transform="translate(32, 365)">
      <rect width="836" height="48" rx="10" fill="#ffffff"/>
      <rect width="3" height="48" rx="1.5" fill="#26a269"/>
      <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    </g>
    <g transform="translate(32, 425)">
      <rect width="836" height="46" rx="10" fill="#ffffff"/>
      <rect width="3" height="46" rx="1.5" fill="#e66100"/>
      <text x="42" y="30" class="expander-label">Edit</text>
    </g>
    <g transform="translate(32, 483)">
      <rect width="836" height="46" rx="10" fill="#ffffff"/>
      <rect width="3" height="46" rx="1.5" fill="#613583"/>
      <text x="42" y="30" font-size="13" fill="#613583" font-weight="700">Task</text>
    </g>
  </g>

  <!-- ===== SCRIM (semi-transparent backdrop) ===== -->
  <rect x="0" y="47" width="900" height="903" fill="#000000" opacity="0.12"/>

  <!-- ===== OVERLAY DETAIL PANEL (AdwNavigationView-style) ===== -->
  <g transform="translate(180, 80)" filter="url(#overlayShadow)">
    <rect width="540" height="820" rx="12" fill="#fafafa"/>

    <!-- Panel header bar -->
    <rect width="540" height="48" rx="12" fill="#ebebeb"/>
    <rect y="12" width="540" height="36" fill="#ebebeb"/>
    <line x1="0" y1="48" x2="540" y2="48" stroke="#d5d3d0" stroke-width="1"/>

    <!-- Back button (stack navigation) -->
    <text x="16" y="32" class="back-link">&#x25C0; Task: Code review</text>

    <!-- Close button -->
    <rect x="494" y="10" width="30" height="28" rx="6" fill="#deddda"/>
    <text x="509" y="29" font-size="13" fill="#3d3846" text-anchor="middle" font-weight="bold">&#x2715;</text>

    <!-- ===== PANEL CONTENT: Tool detail (Read — inside subagent) ===== -->

    <!-- Breadcrumb: shows we're inside a subagent's tool call -->
    <g transform="translate(20, 64)">
      <rect width="500" height="24" rx="6" fill="#f3eef8"/>
      <text x="10" y="16" font-size="10" fill="#613583">&#x1F500; Task: Code review</text>
      <text x="172" y="16" font-size="10" fill="#77767b">&#x203A;</text>
      <text x="186" y="16" font-size="10" fill="#e66100" font-weight="600">&#x1F4C4; Read: src/config.rs</text>
    </g>

    <!-- Tool header -->
    <g transform="translate(20, 104)">
      <text x="0" y="20" font-size="18">&#x1F4C4;</text>
      <text x="30" y="18" class="panel-title">Read</text>
      <!-- Status pill -->
      <rect x="80" y="4" width="60" height="20" rx="10" fill="#daf5e7"/>
      <text x="92" y="18" font-size="10" font-weight="500" fill="#26a269">Success</text>
      <!-- Duration -->
      <rect x="148" y="4" width="52" height="20" rx="10" fill="#f0f0f0"/>
      <text x="160" y="18" font-size="10" fill="#77767b">120ms</text>
    </g>

    <!-- Input section -->
    <g transform="translate(20, 142)">
      <text x="0" y="14" class="section-label">INPUT</text>
      <rect x="0" y="22" width="500" height="30" rx="6" fill="#f6f5f4"/>
      <text x="12" y="42" font-size="12" fill="#1e1e1e" class="mono">file_path: src/config.rs</text>
    </g>

    <!-- Output section -->
    <g transform="translate(20, 210)">
      <text x="0" y="14" class="section-label">OUTPUT</text>

      <!-- Code block -->
      <rect x="0" y="22" width="500" height="360" rx="8" fill="#2d2d2d"/>
      <!-- Code header -->
      <rect x="0" y="22" width="500" height="26" rx="8" fill="#383838"/>
      <rect x="0" y="36" width="500" height="12" fill="#383838"/>
      <text x="14" y="40" font-size="11" fill="#9a9996" class="mono">src/config.rs</text>
      <!-- Copy button -->
      <rect x="456" y="26" width="34" height="18" rx="4" fill="#4a4a4a"/>
      <text x="464" y="39" font-size="9" fill="#c0bfbc">Copy</text>

      <!-- Code content -->
      <text x="14" y="68" font-size="11" class="mono" fill="#6e6e6e"> 1</text>
      <text x="40" y="68" font-size="11" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> serde::{Deserialize, Serialize};</text>

      <text x="14" y="86" font-size="11" class="mono" fill="#6e6e6e"> 2</text>
      <text x="40" y="86" font-size="11" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">use</tspan> std::path::PathBuf;</text>

      <text x="14" y="104" font-size="11" class="mono" fill="#6e6e6e"> 3</text>

      <text x="14" y="122" font-size="11" class="mono" fill="#6e6e6e"> 4</text>
      <text x="40" y="122" font-size="11" class="mono" fill="#dcdcdc">#[<tspan fill="#e5c07b">derive</tspan>(Deserialize, Serialize)]</text>

      <text x="14" y="140" font-size="11" class="mono" fill="#6e6e6e"> 5</text>
      <text x="40" y="140" font-size="11" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">pub struct</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

      <text x="14" y="158" font-size="11" class="mono" fill="#6e6e6e"> 6</text>
      <text x="40" y="158" font-size="11" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> database_path: <tspan fill="#e5c07b">PathBuf</tspan>,</text>

      <text x="14" y="176" font-size="11" class="mono" fill="#6e6e6e"> 7</text>
      <text x="40" y="176" font-size="11" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> theme: <tspan fill="#e5c07b">String</tspan>,</text>

      <text x="14" y="194" font-size="11" class="mono" fill="#6e6e6e"> 8</text>
      <text x="40" y="194" font-size="11" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> max_sessions: <tspan fill="#e5c07b">usize</tspan>,</text>

      <text x="14" y="212" font-size="11" class="mono" fill="#6e6e6e"> 9</text>
      <text x="40" y="212" font-size="11" class="mono" fill="#e06c75">    // BUG: panics if missing</text>

      <text x="14" y="230" font-size="11" class="mono" fill="#6e6e6e">10</text>
      <text x="40" y="230" font-size="11" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub</tspan> api_key: <tspan fill="#e5c07b">String</tspan>,</text>

      <text x="14" y="248" font-size="11" class="mono" fill="#6e6e6e">11</text>
      <text x="40" y="248" font-size="11" class="mono" fill="#dcdcdc">}</text>

      <text x="14" y="266" font-size="11" class="mono" fill="#6e6e6e">12</text>

      <text x="14" y="284" font-size="11" class="mono" fill="#6e6e6e">13</text>
      <text x="40" y="284" font-size="11" class="mono" fill="#dcdcdc"><tspan fill="#c678dd">impl</tspan> <tspan fill="#e5c07b">AppConfig</tspan> {</text>

      <text x="14" y="302" font-size="11" class="mono" fill="#6e6e6e">14</text>
      <text x="40" y="302" font-size="11" class="mono" fill="#dcdcdc">    <tspan fill="#c678dd">pub fn</tspan> <tspan fill="#61afef">load</tspan>() -&gt; <tspan fill="#e5c07b">Self</tspan> {</text>

      <text x="14" y="320" font-size="11" class="mono" fill="#6e6e6e">15</text>
      <text x="40" y="320" font-size="11" class="mono" fill="#dcdcdc">        <tspan fill="#c678dd">let</tspan> path = dirs::config_dir()</text>

      <text x="14" y="338" font-size="11" class="mono" fill="#6e6e6e">16</text>
      <text x="40" y="338" font-size="11" class="mono" fill="#dcdcdc">            .unwrap()</text>

      <text x="14" y="356" font-size="11" class="mono" fill="#6e6e6e">17</text>
      <text x="40" y="356" font-size="11" class="mono" fill="#dcdcdc">            .join(<tspan fill="#98c379">"myapp.toml"</tspan>);</text>

      <!-- Scroll indicator -->
      <rect x="492" y="56" width="3" height="320" fill="transparent"/>
      <rect x="492" y="56" width="3" height="160" fill="#5a5a5a" rx="1.5"/>
    </g>

    <!-- ===== Bottom navigation: other tool calls in this subagent ===== -->
    <line x1="20" y1="598" x2="520" y2="598" stroke="#e8e6e3" stroke-width="1"/>
    <text x="20" y="618" class="section-label">OTHER TOOL CALLS IN THIS SUBAGENT</text>

    <!-- Tool call list (mini action rows) -->
    <g transform="translate(20, 628)">
      <!-- Current: Read config.rs (highlighted) -->
      <rect width="500" height="36" rx="8" fill="#fde3c8"/>
      <text x="12" y="23" font-size="12">&#x1F4C4;</text>
      <text x="34" y="24" font-size="12" fill="#e66100" font-weight="600">Read</text>
      <text x="74" y="24" font-size="12" fill="#77767b">src/config.rs</text>
      <rect x="420" y="10" width="48" height="18" rx="9" fill="#e66100" opacity="0.15"/>
      <text x="444" y="23" text-anchor="middle" font-size="10" fill="#e66100">120ms</text>

      <!-- Other: Read config_test.rs -->
      <rect y="40" width="500" height="36" rx="8" fill="#f6f5f4"/>
      <text x="12" y="63" font-size="12">&#x1F4C4;</text>
      <text x="34" y="64" font-size="12" fill="#1e1e1e" font-weight="600">Read</text>
      <text x="74" y="64" font-size="12" fill="#77767b">src/config_test.rs</text>
      <text x="490" y="64" font-size="12" fill="#3584e4" text-anchor="end">&#x203A;</text>

      <!-- Other: Grep for unwrap -->
      <rect y="80" width="500" height="36" rx="8" fill="#f6f5f4"/>
      <text x="12" y="103" font-size="12">&#x1F50D;</text>
      <text x="34" y="104" font-size="12" fill="#1e1e1e" font-weight="600">Grep</text>
      <text x="78" y="104" font-size="12" fill="#77767b">"unwrap()" in src/</text>
      <text x="490" y="104" font-size="12" fill="#3584e4" text-anchor="end">&#x203A;</text>
    </g>

    <!-- Keyboard hint -->
    <text x="270" y="770" text-anchor="middle" font-size="10" fill="#9a9996">&#x2190; &#x2192; navigate tool calls  |  Esc close overlay</text>
  </g>

  <!-- ===== ANNOTATION LABELS ===== -->
  <!-- Annotation: overlay panel -->
  <rect x="180" y="930" width="540" height="18" fill="#3584e4" rx="6" opacity="0.9"/>
  <text x="450" y="943" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">DESIGN F: Overlay detail panel -- Stack navigation inside subagent tool calls</text>
</svg>