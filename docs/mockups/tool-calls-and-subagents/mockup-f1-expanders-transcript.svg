<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .headerbar-title { font-weight: 700; font-size: 15px; fill: #ffffff; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .expander-label { font-size: 13px; fill: #1e1e1e; font-weight: 700; }
      .expander-summary { font-size: 13px; fill: #636363; }
      .chevron { font-size: 13px; fill: #636363; }
      .terminal-text { font-size: 12px; fill: #d0d0d0; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
      .subagent-label { font-size: 13px; fill: #613583; font-weight: 700; }
      .subagent-summary { font-size: 12px; fill: #77767b; }
      .inner-tool-name { font-size: 12px; fill: #1e1e1e; font-weight: 600; }
      .inner-tool-desc { font-size: 12px; fill: #77767b; }
      .section-label { font-size: 10px; fill: #77767b; font-weight: 700; letter-spacing: 0.8px; }
      .detail-link { font-size: 11px; fill: #3584e4; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="insetShadow" x="-1%" y="-1%" width="102%" height="104%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="950" fill="#fafafa" rx="12"/>

  <!-- ===== HEADERBAR ===== -->
  <rect width="900" height="47" fill="#303030" rx="12"/>
  <rect y="12" width="900" height="35" fill="#303030"/>
  <circle cx="24" cy="23" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="23" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="23" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="450" y="28" text-anchor="middle" class="headerbar-title">Sessions Chronicle</text>
  <text x="108" y="28" font-size="14" fill="#aaaaaa" font-family="Cantarell, sans-serif">&#x25C0;  Session Detail</text>

  <!-- Session metadata bar -->
  <g transform="translate(32, 65)">
    <rect width="836" height="36" rx="8" fill="#ebebeb"/>
    <text x="14" y="23" font-size="12" fill="#636363" font-family="Cantarell, sans-serif" font-weight="700">Claude Code</text>
    <text x="120" y="23" font-size="12" fill="#929292" font-family="Cantarell, sans-serif">~/Projects/myapp  |  12 messages  |  6 tool calls  |  1 subagent  |  2 min ago</text>
  </g>

  <!-- ===== MESSAGE 1: User ===== -->
  <g transform="translate(32, 117)">
    <rect width="836" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="60" rx="1.5" fill="#3584e4"/>
    <text x="18" y="22" class="role-label" fill="#3584e4">USER</text>
    <text x="18" y="44" class="msg-text">Can you read the config file, fix the bug, and run the tests?</text>
  </g>

  <!-- ===== MESSAGE 2: Assistant ===== -->
  <g transform="translate(32, 189)">
    <rect width="836" height="48" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="48" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="38" class="msg-text">Let me check the configuration file first.</text>
  </g>

  <!-- ===== TOOL CALL 1: Read (COLLAPSED) ===== -->
  <g transform="translate(32, 249)">
    <rect width="836" height="46" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="46" rx="1.5" fill="#e66100"/>
    <text x="18" y="29" font-size="15">&#x1F4C4;</text>
    <text x="42" y="30" class="expander-label">Read</text>
    <text x="82" y="30" class="expander-summary">&#x2014;  src/config.rs</text>
    <!-- Duration pill -->
    <rect x="700" y="14" width="48" height="18" rx="9" fill="#f0f0f0"/>
    <text x="724" y="27" text-anchor="middle" font-size="10" fill="#77767b">120ms</text>
    <!-- Chevron -->
    <text x="806" y="30" class="chevron" text-anchor="middle">&#x25B6;</text>
  </g>

  <!-- ===== TOOL CALL 2: Bash (EXPANDED — inline preview) ===== -->
  <g transform="translate(32, 307)">
    <rect width="836" height="172" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="172" rx="1.5" fill="#e66100"/>
    <!-- Header row -->
    <text x="18" y="29" font-size="15">&#x2699;&#xFE0F;</text>
    <text x="42" y="30" class="expander-label">Bash</text>
    <text x="82" y="30" class="expander-summary">&#x2014;  cargo test</text>
    <rect x="700" y="14" width="40" height="18" rx="9" fill="#f0f0f0"/>
    <text x="720" y="27" text-anchor="middle" font-size="10" fill="#77767b">3.2s</text>
    <text x="806" y="30" class="chevron" text-anchor="middle">&#x25BC;</text>
    <!-- Separator -->
    <line x1="12" y1="46" x2="824" y2="46" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Terminal content -->
    <rect x="12" y="52" width="812" height="108" rx="8" fill="#2d2d2d" filter="url(#insetShadow)"/>
    <text x="26" y="74" class="terminal-text mono">$ cargo test</text>
    <text x="26" y="92" class="terminal-text mono">running 12 tests...</text>
    <text x="26" y="110" class="terminal-text mono">test config::test_parse ... <tspan fill="#26a269">ok</tspan></text>
    <text x="26" y="128" class="terminal-text mono">test config::test_validate ... <tspan fill="#e04040">FAILED</tspan></text>
    <text x="26" y="148" class="terminal-text mono" fill="#888888">&#x2500;&#x2500;&#x2500; truncated (8 more lines) &#x2500;&#x2500;&#x2500;</text>
  </g>

  <!-- ===== MESSAGE 3: Assistant ===== -->
  <g transform="translate(32, 491)">
    <rect width="836" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="60" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="44" class="msg-text">I found the issue. Let me fix it and run a code review subagent.</text>
  </g>

  <!-- ===== TOOL CALL 3: Edit (COLLAPSED) ===== -->
  <g transform="translate(32, 563)">
    <rect width="836" height="46" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="46" rx="1.5" fill="#e66100"/>
    <text x="18" y="29" font-size="15">&#x270F;&#xFE0F;</text>
    <text x="42" y="30" class="expander-label">Edit</text>
    <text x="82" y="30" class="expander-summary">&#x2014;  src/config.rs:42  (+3, -1)</text>
    <rect x="700" y="14" width="48" height="18" rx="9" fill="#f0f0f0"/>
    <text x="724" y="27" text-anchor="middle" font-size="10" fill="#77767b">85ms</text>
    <text x="806" y="30" class="chevron" text-anchor="middle">&#x25B6;</text>
  </g>

  <!-- ===== TOOL CALL 4: Subagent (EXPANDED — shows inner tool list) ===== -->
  <g transform="translate(32, 621)">
    <rect width="836" height="220" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="220" rx="1.5" fill="#613583"/>
    <!-- Header row -->
    <text x="18" y="29" font-size="15">&#x1F500;</text>
    <text x="42" y="30" class="subagent-label">Task</text>
    <text x="82" y="30" class="expander-summary">&#x2014;  Code review subagent</text>
    <rect x="660" y="14" width="84" height="18" rx="9" fill="#f3eef8"/>
    <text x="702" y="27" text-anchor="middle" font-size="10" fill="#613583">3 tool calls</text>
    <text x="806" y="30" class="chevron" text-anchor="middle">&#x25BC;</text>
    <!-- Separator -->
    <line x1="12" y1="46" x2="824" y2="46" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Subagent prompt -->
    <text x="18" y="66" class="section-label">PROMPT</text>
    <text x="18" y="84" font-size="12" fill="#1e1e1e">Review the config changes for correctness and edge cases</text>

    <!-- Inner tool call list (ActionRow-style) -->
    <text x="18" y="110" class="section-label">TOOL CALLS</text>
    <!-- Inner grouped card -->
    <rect x="18" y="118" width="800" height="42" rx="8" fill="#f6f5f4"/>
    <text x="34" y="143" font-size="13">&#x1F4C4;</text>
    <text x="56" y="144" class="inner-tool-name">Read</text>
    <text x="100" y="144" class="inner-tool-desc">src/config.rs</text>
    <text x="790" y="144" class="detail-link" text-anchor="end">&#x203A;</text>

    <rect x="18" y="162" width="800" height="42" rx="8" fill="#f6f5f4"/>
    <text x="34" y="187" font-size="13">&#x1F4C4;</text>
    <text x="56" y="188" class="inner-tool-name">Read</text>
    <text x="100" y="188" class="inner-tool-desc">src/config_test.rs</text>
    <text x="790" y="188" class="detail-link" text-anchor="end">&#x203A;</text>

    <!-- Result summary -->
    <text x="18" y="222" class="section-label">RESULT</text>
  </g>

  <!-- Result text outside the card (won't fit, show truncated) -->
  <g transform="translate(32, 621)">
    <text x="18" y="238" font-size="12" fill="#1e1e1e" opacity="0">Looks good. The Option&lt;T&gt; handling is correct.</text>
  </g>

  <!-- Annotation: "Click › to open detail overlay" -->
  <g transform="translate(32, 621)">
    <!-- Arrow pointing to the › chevron on inner tool row -->
    <line x1="730" y1="142" x2="770" y2="142" stroke="#3584e4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="728" y="138" font-size="10" fill="#3584e4" text-anchor="end" opacity="0.8">Opens detail overlay</text>
  </g>

  <!-- ===== MESSAGE 4: Assistant (final) ===== -->
  <g transform="translate(32, 861)">
    <rect width="836" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="60" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="44" class="msg-text">Done! Config updated with Option&lt;T&gt; defaults, all tests pass.</text>
  </g>

  <!-- ===== ANNOTATION LABEL ===== -->
  <rect x="180" y="930" width="540" height="18" fill="#3584e4" rx="6" opacity="0.9"/>
  <text x="450" y="943" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">DESIGN F: Expanders + Overlay -- Inline preview, overlay for full detail</text>
</svg>