<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Cantarell, -apple-system, sans-serif">
  <title>Proposal A — GNOME HIG Strict (AdwPropertyRows + GtkSourceView)</title>
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="paneShadow">
      <feDropShadow dx="-1" dy="0" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f6f5f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa"/>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  HEADER BAR                                                           -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect width="1200" height="47" fill="url(#headerGrad)" stroke="#d5d3d1" stroke-width="1"/>
  <text x="20" y="30" font-size="14" font-weight="700" fill="#1e1e1e">Session Detail</text>
  <text x="600" y="30" font-size="13" fill="#77767b" text-anchor="middle">claude-code — 2026-03-04 14:32</text>
  <!-- Inspector toggle button (active) -->
  <rect x="1140" y="10" width="46" height="28" rx="6" fill="#3584e4" opacity="0.15" stroke="#3584e4" stroke-width="1.5"/>
  <text x="1163" y="29" font-size="11" fill="#3584e4" text-anchor="middle" font-weight="600">F9</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  TRANSCRIPT PANE (left, ~63%)                                         -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="0" y="47" width="750" height="853" fill="#fafafa"/>

  <!-- Divider between panes -->
  <line x1="750" y1="47" x2="750" y2="900" stroke="#d5d3d1" stroke-width="1"/>

  <!-- ── User message ──────────────────────────────────────────────────── -->
  <rect x="16" y="63" width="718" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="63" width="4" height="60" rx="2" fill="#3584e4"/>
  <text x="32" y="82" font-size="10" font-weight="700" fill="#3584e4" letter-spacing="0.5">USER</text>
  <text x="32" y="103" font-size="13" fill="#1e1e1e">Show me the contents of src/main.rs and fix the import error</text>

  <!-- ── Assistant message ─────────────────────────────────────────────── -->
  <rect x="16" y="139" width="718" height="48" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="139" width="4" height="48" rx="2" fill="#26a269"/>
  <text x="32" y="158" font-size="10" font-weight="700" fill="#26a269" letter-spacing="0.5">ASSISTANT</text>
  <text x="32" y="175" font-size="13" fill="#1e1e1e">Let me read the file first and then fix the import.</text>

  <!-- ── Chip: Read (improved — AdwActionRow style) ────────────────────── -->
  <rect x="16" y="203" width="718" height="52" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="203" width="4" height="52" rx="2" fill="#e66100"/>
  <!-- Tool icon -->
  <rect x="36" y="215" width="28" height="28" rx="14" fill="#fff3e0"/>
  <text x="50" y="234" font-size="13" text-anchor="middle" fill="#e66100">📄</text>
  <!-- Tool name + command preview -->
  <text x="74" y="226" font-size="13" font-weight="600" fill="#1e1e1e">Read</text>
  <text x="108" y="226" font-size="12" fill="#77767b" font-family="Source Code Pro, monospace">src/main.rs</text>
  <!-- Status + duration on right -->
  <rect x="620" y="219" width="52" height="20" rx="10" fill="#daf5e7"/>
  <text x="646" y="233" font-size="10" font-weight="600" fill="#26a269" text-anchor="middle">done</text>
  <text x="682" y="233" font-size="11" fill="#9a9996">45ms</text>
  <!-- Inspect chevron -->
  <text x="720" y="234" font-size="14" fill="#3584e4">›</text>

  <!-- ── Chip: Edit (selected — highlighted) ───────────────────────────── -->
  <rect x="16" y="267" width="718" height="52" rx="10" fill="#fff8f0" stroke="#e66100" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="16" y="267" width="4" height="52" rx="2" fill="#e66100"/>
  <rect x="36" y="279" width="28" height="28" rx="14" fill="#fff3e0"/>
  <text x="50" y="298" font-size="13" text-anchor="middle" fill="#e66100">✏️</text>
  <text x="74" y="290" font-size="13" font-weight="600" fill="#1e1e1e">Edit</text>
  <text x="108" y="290" font-size="12" fill="#77767b" font-family="Source Code Pro, monospace">src/main.rs  +2 −1</text>
  <rect x="620" y="283" width="52" height="20" rx="10" fill="#daf5e7"/>
  <text x="646" y="297" font-size="10" font-weight="600" fill="#26a269" text-anchor="middle">done</text>
  <text x="682" y="297" font-size="11" fill="#9a9996">12ms</text>
  <text x="720" y="298" font-size="14" fill="#3584e4">›</text>

  <!-- ── Chip: Bash ────────────────────────────────────────────────────── -->
  <rect x="16" y="331" width="718" height="52" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="331" width="4" height="52" rx="2" fill="#e66100"/>
  <rect x="36" y="343" width="28" height="28" rx="14" fill="#fff3e0"/>
  <text x="50" y="362" font-size="13" text-anchor="middle" fill="#e66100">$_</text>
  <text x="74" y="354" font-size="13" font-weight="600" fill="#1e1e1e">Bash</text>
  <text x="112" y="354" font-size="12" fill="#77767b" font-family="Source Code Pro, monospace">cargo check</text>
  <rect x="620" y="347" width="52" height="20" rx="10" fill="#daf5e7"/>
  <text x="646" y="361" font-size="10" font-weight="600" fill="#26a269" text-anchor="middle">done</text>
  <text x="682" y="361" font-size="11" fill="#9a9996">3.2s</text>
  <text x="720" y="362" font-size="14" fill="#77767b">›</text>

  <!-- ── Subagent chip (purple) ────────────────────────────────────────── -->
  <rect x="16" y="395" width="718" height="52" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="395" width="4" height="52" rx="2" fill="#813d9c"/>
  <rect x="36" y="407" width="28" height="28" rx="14" fill="#f0ecfe"/>
  <text x="50" y="426" font-size="13" text-anchor="middle" fill="#813d9c">🤖</text>
  <text x="74" y="418" font-size="13" font-weight="600" fill="#1e1e1e">Agent</text>
  <text x="118" y="418" font-size="12" fill="#77767b">Explore parser layout</text>
  <!-- Inner tool count badge -->
  <rect x="570" y="411" width="40" height="20" rx="10" fill="#f0ecfe"/>
  <text x="590" y="425" font-size="10" font-weight="600" fill="#813d9c" text-anchor="middle">×5</text>
  <rect x="620" y="411" width="52" height="20" rx="10" fill="#daf5e7"/>
  <text x="646" y="425" font-size="10" font-weight="600" fill="#26a269" text-anchor="middle">done</text>
  <text x="682" y="425" font-size="11" fill="#9a9996">8.4s</text>
  <text x="720" y="426" font-size="14" fill="#77767b">›</text>

  <!-- ── Assistant response after tools ────────────────────────────────── -->
  <rect x="16" y="463" width="718" height="60" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="16" y="463" width="4" height="60" rx="2" fill="#26a269"/>
  <text x="32" y="482" font-size="10" font-weight="700" fill="#26a269" letter-spacing="0.5">ASSISTANT</text>
  <text x="32" y="503" font-size="13" fill="#1e1e1e">I've fixed the import error. The missing `use std::path::PathBuf` has been added.</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  INSPECTOR PANE (right, ~37%) — HIG Property Rows                     -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <rect x="751" y="47" width="449" height="853" fill="#fafafa" filter="url(#paneShadow)"/>

  <!-- Pane header -->
  <rect x="751" y="47" width="449" height="40" fill="#f6f5f4" stroke="#d5d3d1" stroke-width="0.5"/>
  <text x="770" y="72" font-size="13" font-weight="600" fill="#1e1e1e">Inspector</text>
  <!-- Close button -->
  <text x="1174" y="72" font-size="14" fill="#77767b" text-anchor="middle">✕</text>

  <!-- ── Tool header section ───────────────────────────────────────────── -->
  <rect x="767" y="103" width="417" height="64" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <!-- Tool type icon -->
  <rect x="783" y="115" width="40" height="40" rx="20" fill="#fff3e0"/>
  <text x="803" y="141" font-size="18" text-anchor="middle" fill="#e66100">✏️</text>
  <!-- Tool name + file path -->
  <text x="835" y="132" font-size="15" font-weight="700" fill="#1e1e1e" font-family="Source Code Pro, monospace">Edit</text>
  <text x="875" y="132" font-size="12" fill="#77767b" font-family="Source Code Pro, monospace">src/main.rs</text>
  <!-- Status row -->
  <rect x="835" y="139" width="52" height="18" rx="9" fill="#daf5e7"/>
  <text x="861" y="152" font-size="10" font-weight="600" fill="#26a269" text-anchor="middle">done</text>
  <text x="896" y="152" font-size="11" fill="#9a9996">12ms</text>

  <!-- ── AdwPreferencesGroup: Input ────────────────────────────────────── -->
  <text x="774" y="196" font-size="10" font-weight="700" fill="#77767b" letter-spacing="0.8">INPUT</text>

  <!-- AdwExpanderRow style — expanded -->
  <rect x="767" y="204" width="417" height="180" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <!-- Expander header -->
  <rect x="767" y="204" width="417" height="36" rx="10" fill="#ffffff"/>
  <text x="783" y="226" font-size="12" font-weight="600" fill="#1e1e1e">file_path</text>
  <text x="1060" y="226" font-size="12" fill="#77767b" font-family="Source Code Pro, monospace" text-anchor="end">"src/main.rs"</text>
  <text x="1170" y="226" font-size="14" fill="#77767b" text-anchor="middle">▾</text>
  <line x1="775" y1="240" x2="1176" y2="240" stroke="#ebebeb" stroke-width="1"/>

  <!-- GtkSourceView-like code block inside expander -->
  <rect x="775" y="248" width="401" height="128" rx="6" fill="#f6f5f4"/>
  <!-- Line numbers gutter -->
  <rect x="775" y="248" width="32" height="128" rx="6" fill="#ededec"/>
  <text x="799" y="268" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">1</text>
  <text x="799" y="284" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">2</text>
  <text x="799" y="300" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">3</text>
  <text x="799" y="316" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">4</text>
  <text x="799" y="332" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">5</text>
  <text x="799" y="348" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">6</text>
  <text x="799" y="364" font-size="11" fill="#9a9996" text-anchor="end" font-family="Source Code Pro, monospace">7</text>
  <!-- JSON content (pretty-printed) -->
  <text x="815" y="268" font-size="11" fill="#1e1e1e" font-family="Source Code Pro, monospace">{</text>
  <text x="815" y="284" font-size="11" font-family="Source Code Pro, monospace">  <tspan fill="#c678dd">"file_path"</tspan><tspan fill="#1e1e1e">:</tspan> <tspan fill="#98c379">"src/main.rs"</tspan><tspan fill="#1e1e1e">,</tspan></text>
  <text x="815" y="300" font-size="11" font-family="Source Code Pro, monospace">  <tspan fill="#c678dd">"old_string"</tspan><tspan fill="#1e1e1e">:</tspan> <tspan fill="#98c379">"use std::fs;"</tspan><tspan fill="#1e1e1e">,</tspan></text>
  <text x="815" y="316" font-size="11" font-family="Source Code Pro, monospace">  <tspan fill="#c678dd">"new_string"</tspan><tspan fill="#1e1e1e">:</tspan> <tspan fill="#98c379">"use std::fs;\nuse …"</tspan><tspan fill="#1e1e1e">,</tspan></text>
  <text x="815" y="332" font-size="11" font-family="Source Code Pro, monospace">  <tspan fill="#c678dd">"replace_all"</tspan><tspan fill="#1e1e1e">:</tspan> <tspan fill="#e5c07b">false</tspan></text>
  <text x="815" y="348" font-size="11" fill="#1e1e1e" font-family="Source Code Pro, monospace">}</text>

  <!-- ── AdwPreferencesGroup: Output ───────────────────────────────────── -->
  <text x="774" y="408" font-size="10" font-weight="700" fill="#77767b" letter-spacing="0.8">OUTPUT</text>

  <rect x="767" y="416" width="417" height="130" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- Diff-style specialized view for Edit tool -->
  <rect x="775" y="424" width="401" height="114" rx="6" fill="#f6f5f4"/>
  <!-- Diff header bar -->
  <rect x="775" y="424" width="401" height="24" rx="6" fill="#ededec"/>
  <text x="791" y="440" font-size="11" font-weight="600" fill="#77767b" font-family="Source Code Pro, monospace">src/main.rs — 1 insertion, 0 deletions</text>
  <!-- Diff lines -->
  <text x="791" y="462" font-size="11" fill="#9a9996" font-family="Source Code Pro, monospace"> 1 │ use std::fs;</text>
  <rect x="775" y="468" width="401" height="18" fill="#daf5e7" opacity="0.5"/>
  <text x="791" y="482" font-size="11" fill="#26a269" font-family="Source Code Pro, monospace">+2 │ use std::path::PathBuf;</text>
  <text x="791" y="502" font-size="11" fill="#9a9996" font-family="Source Code Pro, monospace"> 3 │ use std::io::Read;</text>
  <text x="791" y="522" font-size="11" fill="#9a9996" font-family="Source Code Pro, monospace"> 4 │</text>

  <!-- ── Metadata section (collapsed) ──────────────────────────────────── -->
  <text x="774" y="572" font-size="10" font-weight="700" fill="#77767b" letter-spacing="0.8">METADATA</text>

  <rect x="767" y="580" width="417" height="36" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
  <text x="783" y="602" font-size="12" fill="#77767b">No additional metadata available</text>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  ANNOTATIONS                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Annotation: chip improvements -->
  <rect x="16" y="540" width="718" height="108" rx="8" fill="#e8f0fe" stroke="#3584e4" stroke-width="1" stroke-dasharray="4"/>
  <text x="32" y="560" font-size="11" font-weight="700" fill="#3584e4">DESIGN NOTES — Inline Chips</text>
  <text x="32" y="578" font-size="11" fill="#1e1e1e">• AdwActionRow-style rows replace minimal badges</text>
  <text x="32" y="594" font-size="11" fill="#1e1e1e">• Tool-type icon in colored circle prefix (Read=📄, Edit=✏️, Bash=$_, Agent=🤖)</text>
  <text x="32" y="610" font-size="11" fill="#1e1e1e">• 1-line command/file preview extracted from input_json (e.g. "src/main.rs")</text>
  <text x="32" y="626" font-size="11" fill="#1e1e1e">• Status pill + duration suffix; selected row gets orange highlight + stroke</text>
  <text x="32" y="642" font-size="11" fill="#1e1e1e">• Subagent chips show inner tool count badge (×5)</text>

  <!-- Annotation: inspector design -->
  <rect x="767" y="640" width="417" height="140" rx="8" fill="#e8f0fe" stroke="#3584e4" stroke-width="1" stroke-dasharray="4"/>
  <text x="783" y="660" font-size="11" font-weight="700" fill="#3584e4">DESIGN NOTES — Inspector Pane</text>
  <text x="783" y="678" font-size="11" fill="#1e1e1e">• AdwOverlaySplitView — sidebar-position=end</text>
  <text x="783" y="694" font-size="11" fill="#1e1e1e">• min-sidebar-width: 320px, max: 500px</text>
  <text x="783" y="710" font-size="11" fill="#1e1e1e">• F9 keyboard toggle (GNOME HIG standard)</text>
  <text x="783" y="726" font-size="11" fill="#1e1e1e">• AdwExpanderRow for each section (Input/Output)</text>
  <text x="783" y="742" font-size="11" fill="#1e1e1e">• GtkSourceView for JSON + code with syntax highlight</text>
  <text x="783" y="758" font-size="11" fill="#1e1e1e">• Specialized views: Edit→diff, Bash→terminal,</text>
  <text x="783" y="774" font-size="11" fill="#1e1e1e">  Read→file viewer, Generic→pretty JSON + mono text</text>

  <!-- Annotation: generic fallback -->
  <rect x="16" y="660" width="718" height="68" rx="8" fill="#fef3e0" stroke="#e66100" stroke-width="1" stroke-dasharray="4"/>
  <text x="32" y="680" font-size="11" font-weight="700" fill="#e66100">GENERIC / UNRECOGNIZED JSON FALLBACK</text>
  <text x="32" y="698" font-size="11" fill="#1e1e1e">• Unknown tools render input as pretty-printed JSON in GtkSourceView (language=json)</text>
  <text x="32" y="714" font-size="11" fill="#1e1e1e">• Output rendered as monospace text; if starts with { or [ → auto-detect as JSON</text>

  <!-- Label -->
  <text x="600" y="870" font-size="18" font-weight="700" fill="#1e1e1e" text-anchor="middle">Proposal A — GNOME HIG Strict (AdwPropertyRows + GtkSourceView)</text>
  <text x="600" y="892" font-size="12" fill="#77767b" text-anchor="middle">AdwOverlaySplitView • AdwExpanderRow • GtkSourceView • F9 toggle • AdwActionRow-style chips</text>
</svg>