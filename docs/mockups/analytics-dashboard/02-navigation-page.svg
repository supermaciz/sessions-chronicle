<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" font-family="Cantarell, sans-serif">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c3c"/>
      <stop offset="100%" stop-color="#353535"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Window background -->
  <rect width="900" height="700" rx="12" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="900" height="47" rx="12" fill="url(#headerBg)"/>
  <rect y="24" width="900" height="23" fill="url(#headerBg)"/>

  <!-- Back button -->
  <rect x="8" y="10" width="32" height="27" rx="6" fill="#4a4a4a"/>
  <text x="24" y="28" text-anchor="middle" fill="#ccc" font-size="14">&#x2190;</text>

  <!-- Title -->
  <text x="450" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Analytics</text>

  <!-- Menu button -->
  <circle cx="870" cy="24" r="10" fill="#4a4a4a"/>
  <text x="870" y="28" text-anchor="middle" fill="#aaa" font-size="9">&#x22EE;</text>

  <!-- Scrollable content area -->
  <!-- Summary cards using AdwPreferencesGroup style -->
  <text x="32" y="80" fill="#888" font-size="12" font-weight="500">OVERVIEW</text>

  <!-- Cards in a 2x2 grid -->
  <rect x="32" y="92" width="420" height="72" rx="12" fill="#fff" filter="url(#shadow)"/>
  <rect x="36" y="92" width="4" height="72" rx="2" fill="#3584e4"/>
  <text x="56" y="116" fill="#888" font-size="11">Total Sessions</text>
  <text x="56" y="146" fill="#1c1c1c" font-size="26" font-weight="700">247</text>
  <text x="130" y="146" fill="#26a269" font-size="12">+12 this week</text>

  <rect x="468" y="92" width="412" height="72" rx="12" fill="#fff" filter="url(#shadow)"/>
  <rect x="472" y="92" width="4" height="72" rx="2" fill="#e66100"/>
  <text x="492" y="116" fill="#888" font-size="11">Total Messages</text>
  <text x="492" y="146" fill="#1c1c1c" font-size="26" font-weight="700">3,842</text>
  <text x="592" y="146" fill="#26a269" font-size="12">+156 this week</text>

  <rect x="32" y="172" width="420" height="72" rx="12" fill="#fff" filter="url(#shadow)"/>
  <rect x="36" y="172" width="4" height="72" rx="2" fill="#26a269"/>
  <text x="56" y="196" fill="#888" font-size="11">Distinct Projects</text>
  <text x="56" y="226" fill="#1c1c1c" font-size="26" font-weight="700">12</text>

  <rect x="468" y="172" width="412" height="72" rx="12" fill="#fff" filter="url(#shadow)"/>
  <rect x="472" y="172" width="4" height="72" rx="2" fill="#c061cb"/>
  <text x="492" y="196" fill="#888" font-size="11">Active Days</text>
  <text x="492" y="226" fill="#1c1c1c" font-size="26" font-weight="700">68</text>
  <text x="546" y="226" fill="#888" font-size="12">of 90</text>

  <!-- Token Consumption section -->
  <text x="32" y="274" fill="#888" font-size="12" font-weight="500">TOKEN CONSUMPTION</text>

  <rect x="32" y="286" width="848" height="120" rx="12" fill="#fff" filter="url(#shadow)"/>

  <!-- Token stats as property rows -->
  <text x="56" y="314" fill="#555" font-size="12" font-weight="500">Input Tokens</text>
  <text x="280" y="314" fill="#1c1c1c" font-size="12" font-weight="600">2.4M</text>

  <line x1="56" y1="326" x2="860" y2="326" stroke="#eee" stroke-width="1"/>

  <text x="56" y="348" fill="#555" font-size="12" font-weight="500">Output Tokens</text>
  <text x="280" y="348" fill="#1c1c1c" font-size="12" font-weight="600">856K</text>

  <line x1="56" y1="360" x2="860" y2="360" stroke="#eee" stroke-width="1"/>

  <text x="56" y="382" fill="#555" font-size="12" font-weight="500">Cache Read Tokens</text>
  <text x="280" y="382" fill="#1c1c1c" font-size="12" font-weight="600">1.1M</text>

  <!-- Stacked bar showing token breakdown by tool -->
  <text x="480" y="314" fill="#888" font-size="10">By tool:</text>
  <rect x="480" y="322" width="260" height="14" rx="3" fill="#eee"/>
  <rect x="480" y="322" width="190" height="14" rx="3" fill="#3584e4"/>
  <rect x="670" y="322" width="40" height="14" fill="#e66100"/>
  <rect x="710" y="322" width="20" height="14" fill="#26a269"/>
  <rect x="730" y="322" width="10" height="14" rx="3" fill="#c061cb"/>

  <rect x="480" y="348" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="498" y="358" fill="#888" font-size="10">Claude Code</text>
  <rect x="580" y="348" width="12" height="12" rx="2" fill="#e66100"/>
  <text x="598" y="358" fill="#888" font-size="10">OpenCode</text>
  <rect x="660" y="348" width="12" height="12" rx="2" fill="#26a269"/>
  <text x="678" y="358" fill="#888" font-size="10">Codex</text>
  <rect x="720" y="348" width="12" height="12" rx="2" fill="#c061cb"/>
  <text x="738" y="358" fill="#888" font-size="10">Vibe</text>

  <!-- Models Used section -->
  <text x="32" y="436" fill="#888" font-size="12" font-weight="500">MODELS USED</text>

  <rect x="32" y="448" width="420" height="230" rx="12" fill="#fff" filter="url(#shadow)"/>

  <!-- Donut chart placeholder -->
  <circle cx="140" cy="556" r="60" fill="none" stroke="#eee" stroke-width="20"/>
  <circle cx="140" cy="556" r="60" fill="none" stroke="#3584e4" stroke-width="20"
          stroke-dasharray="188.5 377" stroke-dashoffset="0" transform="rotate(-90 140 556)"/>
  <circle cx="140" cy="556" r="60" fill="none" stroke="#e66100" stroke-width="20"
          stroke-dasharray="75.4 377" stroke-dashoffset="-188.5" transform="rotate(-90 140 556)"/>
  <circle cx="140" cy="556" r="60" fill="none" stroke="#26a269" stroke-width="20"
          stroke-dasharray="56.5 377" stroke-dashoffset="-263.9" transform="rotate(-90 140 556)"/>
  <circle cx="140" cy="556" r="60" fill="none" stroke="#f5c211" stroke-width="20"
          stroke-dasharray="37.7 377" stroke-dashoffset="-320.4" transform="rotate(-90 140 556)"/>

  <text x="140" y="552" text-anchor="middle" fill="#1c1c1c" font-size="16" font-weight="700">8</text>
  <text x="140" y="568" text-anchor="middle" fill="#888" font-size="10">models</text>

  <!-- Legend -->
  <rect x="240" y="480" width="12" height="12" rx="2" fill="#3584e4"/>
  <text x="258" y="491" fill="#555" font-size="11">Sonnet 4 (50%)</text>
  <rect x="240" y="500" width="12" height="12" rx="2" fill="#e66100"/>
  <text x="258" y="511" fill="#555" font-size="11">Opus 4 (20%)</text>
  <rect x="240" y="520" width="12" height="12" rx="2" fill="#26a269"/>
  <text x="258" y="531" fill="#555" font-size="11">Haiku 3.5 (15%)</text>
  <rect x="240" y="540" width="12" height="12" rx="2" fill="#f5c211"/>
  <text x="258" y="551" fill="#555" font-size="11">GPT-4o (10%)</text>
  <rect x="240" y="560" width="12" height="12" rx="2" fill="#aaa"/>
  <text x="258" y="571" fill="#555" font-size="11">Other (5%)</text>

  <!-- Session Length Distribution -->
  <rect x="468" y="448" width="412" height="230" rx="12" fill="#fff" filter="url(#shadow)"/>
  <text x="484" y="476" fill="#1c1c1c" font-size="14" font-weight="600">Session Length Distribution</text>
  <text x="484" y="494" fill="#888" font-size="11">Message count per session</text>

  <!-- Histogram bars -->
  <g transform="translate(484, 510)">
    <rect x="0" y="100" width="36" height="60" rx="2" fill="#3584e4" opacity="0.3"/>
    <text x="18" y="170" text-anchor="middle" fill="#888" font-size="9">1-5</text>
    <text x="18" y="95" text-anchor="middle" fill="#555" font-size="9">42</text>

    <rect x="44" y="40" width="36" height="120" rx="2" fill="#3584e4" opacity="0.5"/>
    <text x="62" y="170" text-anchor="middle" fill="#888" font-size="9">6-15</text>
    <text x="62" y="35" text-anchor="middle" fill="#555" font-size="9">86</text>

    <rect x="88" y="10" width="36" height="150" rx="2" fill="#3584e4" opacity="0.8"/>
    <text x="106" y="170" text-anchor="middle" fill="#888" font-size="9">16-30</text>
    <text x="106" y="5" text-anchor="middle" fill="#555" font-size="9">62</text>

    <rect x="132" y="60" width="36" height="100" rx="2" fill="#3584e4" opacity="0.6"/>
    <text x="150" y="170" text-anchor="middle" fill="#888" font-size="9">31-50</text>
    <text x="150" y="55" text-anchor="middle" fill="#555" font-size="9">35</text>

    <rect x="176" y="110" width="36" height="50" rx="2" fill="#3584e4" opacity="0.35"/>
    <text x="194" y="170" text-anchor="middle" fill="#888" font-size="9">51-100</text>
    <text x="194" y="105" text-anchor="middle" fill="#555" font-size="9">16</text>

    <rect x="220" y="140" width="36" height="20" rx="2" fill="#3584e4" opacity="0.2"/>
    <text x="238" y="170" text-anchor="middle" fill="#888" font-size="9">100+</text>
    <text x="238" y="135" text-anchor="middle" fill="#555" font-size="9">6</text>
  </g>

  <!-- Label -->
  <text x="450" y="695" text-anchor="middle" fill="#aaa" font-size="11" font-style="italic">Proposal B: Pushed NavigationPage - back button returns to session list</text>
</svg>