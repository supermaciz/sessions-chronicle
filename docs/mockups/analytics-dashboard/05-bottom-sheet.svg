  <text x="860" y="221" text-anchor="middle" fill="#888" font-size="14">&#x2715;</text>

  <!-- Horizontal scrollable stat chips -->
  <g transform="translate(32, 240)">
    <rect x="0" y="0" width="120" height="64" rx="12" fill="#e8f0fe"/>
    <text x="12" y="20" fill="#3584e4" font-size="10" font-weight="500">SESSIONS</text>
    <text x="12" y="48" fill="#3584e4" font-size="24" font-weight="700">247</text>

    <rect x="130" y="0" width="120" height="64" rx="12" fill="#fce8e0"/>
