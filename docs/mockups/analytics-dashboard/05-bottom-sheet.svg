    <text x="142" y="48" fill="#e66100" font-size="24" font-weight="700">3,842</text>

    <rect x="260" y="0" width="120" height="64" rx="12" fill="#e0f2e8"/>
    <text x="272" y="20" fill="#26a269" font-size="10" font-weight="500">TOKENS</text>
    <text x="272" y="48" fill="#26a269" font-size="24" font-weight="700">3.2M</text>

    <rect x="390" y="0" width="120" height="64" rx="12" fill="#f4e0f7"/>
