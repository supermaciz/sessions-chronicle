<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" font-family="Cantarell, sans-serif">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c3c"/>
      <stop offset="100%" stop-color="#353535"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <filter id="heavyShadow">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Window background (session list dimmed behind) -->
  <rect width="900" height="700" rx="12" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="900" height="47" rx="12" fill="url(#headerBg)"/>
  <rect y="24" width="900" height="23" fill="url(#headerBg)"/>
  <text x="450" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Sessions Chronicle</text>

  <!-- Dimmed session list behind -->
  <rect x="0" y="47" width="900" height="653" fill="#fafafa" opacity="0.4"/>

  <!-- Ghost session rows (dimmed) -->
  <rect x="16" y="60" width="660" height="50" rx="8" fill="#ddd" opacity="0.3"/>
  <rect x="16" y="118" width="660" height="50" rx="8" fill="#ddd" opacity="0.3"/>
  <rect x="16" y="176" width="660" height="50" rx="8" fill="#ddd" opacity="0.2"/>

  <!-- Semi-transparent overlay -->
  <rect x="0" y="47" width="900" height="653" fill="#000" opacity="0.15" rx="0"/>

  <!-- Bottom sheet -->
  <rect x="0" y="180" width="900" height="520" rx="20" fill="#fff" filter="url(#heavyShadow)"/>

  <!-- Drag handle -->
