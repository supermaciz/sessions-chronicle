    <text x="402" y="48" fill="#9141ac" font-size="24" font-weight="700">12</text>

    <rect x="520" y="0" width="120" height="64" rx="12" fill="#fef3cd"/>
    <text x="532" y="20" fill="#986a00" font-size="10" font-weight="500">ACTIVE DAYS</text>
    <text x="532" y="48" fill="#986a00" font-size="24" font-weight="700">68</text>

    <rect x="650" y="0" width="120" height="64" rx="12" fill="#f0f0f0"/>
    <text x="662" y="20" fill="#555" font-size="10" font-weight="500">SUBAGENTS</text>
    <text x="662" y="48" fill="#555" font-size="24" font-weight="700">312</text>
  </g>

  <!-- Tab bar for sections -->
