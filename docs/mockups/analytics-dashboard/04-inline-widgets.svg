      <rect x="158" y="42" width="10" height="10" rx="2" fill="#ebedf0"/>
    </g>

    <!-- Tool breakdown mini bars (inline, right of heatmap) -->
    <g transform="translate(200, 18)">
      <text x="0" y="-6" fill="#888" font-size="9" font-weight="500">BY TOOL</text>

      <rect x="0" y="0" width="440" height="10" rx="3" fill="#eee"/>
      <rect x="0" y="0" width="324" height="10" rx="3" fill="#3584e4"/>
      <rect x="324" y="0" width="61" height="10" fill="#e66100"/>
      <rect x="385" y="0" width="37" height="10" fill="#26a269"/>
