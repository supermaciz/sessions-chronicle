      <rect x="0" y="54" width="82" height="20" rx="10" fill="#e8f0fe"/>
      <text x="10" y="68" fill="#3584e4" font-size="9" font-weight="500">sonnet-4 50%</text>
      <rect x="88" y="54" width="72" height="20" rx="10" fill="#fce8e0"/>
      <text x="98" y="68" fill="#e66100" font-size="9" font-weight="500">opus-4 20%</text>
      <rect x="166" y="54" width="78" height="20" rx="10" fill="#e0f2e8"/>
