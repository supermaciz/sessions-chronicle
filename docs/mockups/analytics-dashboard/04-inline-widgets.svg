      <rect x="144" y="28" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="158" y="28" width="10" height="10" rx="2" fill="#30a14e"/>

      <rect x="4" y="42" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="18" y="42" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="32" y="42" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="46" y="42" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="60" y="42" width="10" height="10" rx="2" fill="#ebedf0"/>
