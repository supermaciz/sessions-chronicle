      <text x="-2" y="22" text-anchor="end" fill="#aaa" font-size="7">W</text>
      <text x="-2" y="34" text-anchor="end" fill="#aaa" font-size="7">F</text>
      <text x="-2" y="46" text-anchor="end" fill="#aaa" font-size="7">S</text>

      <!-- 12 columns x 7 rows, compact -->
      <rect x="4" y="0" width="10" height="10" rx="2" fill="#9be9a8"/>
      <rect x="18" y="0" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="32" y="0" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="46" y="0" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="60" y="0" width="10" height="10" rx="2" fill="#9be9a8"/>
      <rect x="74" y="0" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="88" y="0" width="10" height="10" rx="2" fill="#30a14e"/>
      <rect x="102" y="0" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="116" y="0" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="130" y="0" width="10" height="10" rx="2" fill="#216e39"/>
      <rect x="144" y="0" width="10" height="10" rx="2" fill="#9be9a8"/>
      <rect x="158" y="0" width="10" height="10" rx="2" fill="#40c463"/>

      <rect x="4" y="14" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="18" y="14" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="32" y="14" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="46" y="14" width="10" height="10" rx="2" fill="#9be9a8"/>
      <rect x="60" y="14" width="10" height="10" rx="2" fill="#ebedf0"/>
