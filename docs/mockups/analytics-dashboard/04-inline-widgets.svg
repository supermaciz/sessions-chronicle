      <rect x="110" y="18" width="8" height="8" rx="2" fill="#e66100"/>
      <text x="122" y="25" fill="#555" font-size="9">OpenCode 34</text>
      <rect x="200" y="18" width="8" height="8" rx="2" fill="#26a269"/>
