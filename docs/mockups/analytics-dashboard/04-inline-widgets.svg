  <!-- Collapse toggle -->
  <rect x="310" y="230" width="60" height="8" rx="4" fill="#c0c8d8" opacity="0.5"/>

  <!-- Session list below -->
  <rect x="0" y="242" width="680" height="458" fill="#fafafa"/>

  <!-- Session rows -->
  <rect x="16" y="254" width="648" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="40" cy="282" r="10" fill="#3584e4" opacity="0.15"/>
  <text x="40" y="286" text-anchor="middle" fill="#3584e4" font-size="9" font-weight="700">C</text>
  <text x="60" y="276" fill="#1c1c1c" font-size="12" font-weight="500">Fix authentication bug in login flow</text>
  <text x="60" y="294" fill="#888" font-size="10">sessions-chronicle &#x00B7; 24 messages &#x00B7; 2h ago</text>

  <rect x="16" y="318" width="648" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="40" cy="346" r="10" fill="#3584e4" opacity="0.15"/>
  <text x="40" y="350" text-anchor="middle" fill="#3584e4" font-size="9" font-weight="700">C</text>
  <text x="60" y="340" fill="#1c1c1c" font-size="12" font-weight="500">Add dark mode support to the settings page</text>
  <text x="60" y="358" fill="#888" font-size="10">my-web-app &#x00B7; 18 messages &#x00B7; 5h ago</text>

  <rect x="16" y="382" width="648" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="40" cy="410" r="10" fill="#e66100" opacity="0.15"/>
  <text x="40" y="414" text-anchor="middle" fill="#e66100" font-size="9" font-weight="700">O</text>
  <text x="60" y="404" fill="#1c1c1c" font-size="12" font-weight="500">Refactor database connection pooling</text>
  <text x="60" y="422" fill="#888" font-size="10">api-server &#x00B7; 42 messages &#x00B7; 1d ago</text>

  <rect x="16" y="446" width="648" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="40" cy="474" r="10" fill="#26a269" opacity="0.15"/>
  <text x="40" y="478" text-anchor="middle" fill="#26a269" font-size="9" font-weight="700">X</text>
  <text x="60" y="468" fill="#1c1c1c" font-size="12" font-weight="500">Implement rate limiter middleware</text>
  <text x="60" y="486" fill="#888" font-size="10">rust-cli-tool &#x00B7; 31 messages &#x00B7; 2d ago</text>

  <rect x="16" y="510" width="648" height="56" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="40" cy="538" r="10" fill="#c061cb" opacity="0.15"/>
  <text x="40" y="542" text-anchor="middle" fill="#c061cb" font-size="9" font-weight="700">M</text>
  <text x="60" y="532" fill="#1c1c1c" font-size="12" font-weight="500">Generate unit tests for parser module</text>
  <text x="60" y="550" fill="#888" font-size="10">my-web-app &#x00B7; 8 messages &#x00B7; 3d ago</text>

  <!-- Sidebar content (tool filters) -->
