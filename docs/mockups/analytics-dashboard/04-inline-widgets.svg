      <rect x="116" y="14" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="130" y="14" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="144" y="14" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="158" y="14" width="10" height="10" rx="2" fill="#9be9a8"/>

      <rect x="4" y="28" width="10" height="10" rx="2" fill="#40c463"/>
      <rect x="18" y="28" width="10" height="10" rx="2" fill="#ebedf0"/>
      <rect x="32" y="28" width="10" height="10" rx="2" fill="#9be9a8"/>
      <rect x="46" y="28" width="10" height="10" rx="2" fill="#ebedf0"/>
