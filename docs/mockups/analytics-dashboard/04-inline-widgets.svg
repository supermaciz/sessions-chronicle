<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" font-family="Cantarell, sans-serif">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3c3c"/>
      <stop offset="100%" stop-color="#353535"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Window background -->
  <rect width="900" height="700" rx="12" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="900" height="47" rx="12" fill="url(#headerBg)"/>
  <rect y="24" width="900" height="23" fill="url(#headerBg)"/>

  <!-- Header title -->
  <text x="450" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Sessions Chronicle</text>

  <!-- Search button -->
  <rect x="8" y="10" width="32" height="27" rx="6" fill="#4a4a4a"/>
  <text x="24" y="28" text-anchor="middle" fill="#ccc" font-size="12">&#x1F50D;</text>

  <!-- Analytics toggle button (chart icon, active state) -->
  <rect x="48" y="10" width="32" height="27" rx="6" fill="#3584e4"/>
  <text x="64" y="28" text-anchor="middle" fill="#fff" font-size="11">&#x2261;</text>

  <!-- Sidebar (right, filter) -->
  <rect x="680" y="47" width="220" height="653" fill="#f6f5f4"/>
  <line x1="680" y1="47" x2="680" y2="700" stroke="#ddd" stroke-width="1"/>

  <!-- Main content area with inline widgets -->
  <!-- Collapsible analytics banner at top of session list -->
  <rect x="0" y="47" width="680" height="192" fill="#f0f4ff"/>
  <line x1="0" y1="239" x2="680" y2="239" stroke="#d0d8e8" stroke-width="1"/>

  <!-- Mini stats row -->
  <g transform="translate(16, 56)">
    <!-- Stat pill: Sessions -->
    <rect x="0" y="0" width="100" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
    <text x="12" y="16" fill="#888" font-size="9" font-weight="500">SESSIONS</text>
    <text x="12" y="36" fill="#1c1c1c" font-size="16" font-weight="700">247</text>

    <!-- Stat pill: Messages -->
    <rect x="110" y="0" width="100" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
    <text x="122" y="16" fill="#888" font-size="9" font-weight="500">MESSAGES</text>
    <text x="122" y="36" fill="#1c1c1c" font-size="16" font-weight="700">3.8k</text>

    <!-- Stat pill: Tokens -->
    <rect x="220" y="0" width="110" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
    <text x="232" y="16" fill="#888" font-size="9" font-weight="500">TOKENS</text>
    <text x="232" y="36" fill="#1c1c1c" font-size="16" font-weight="700">3.2M</text>

    <!-- Stat pill: Projects -->
    <rect x="340" y="0" width="100" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
    <text x="352" y="16" fill="#888" font-size="9" font-weight="500">PROJECTS</text>
    <text x="352" y="36" fill="#1c1c1c" font-size="16" font-weight="700">12</text>

    <!-- Mini sparkline (7-day activity) -->
    <rect x="452" y="0" width="200" height="44" rx="10" fill="#fff" filter="url(#shadow)"/>
    <text x="464" y="14" fill="#888" font-size="9" font-weight="500">LAST 7 DAYS</text>
    <!-- Sparkline -->
    <polyline points="464,38 480,30 496,34 512,22 528,26 544,18 560,24 576,14 592,20 608,16 624,22 640,10"
              fill="none" stroke="#3584e4" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="464,38 480,30 496,34 512,22 528,26 544,18 560,24 576,14 592,20 608,16 624,22 640,10 640,38"
             fill="url(#sparkGrad)"/>
  </g>

