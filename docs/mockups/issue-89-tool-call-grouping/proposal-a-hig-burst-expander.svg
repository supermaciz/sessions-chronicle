<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="headerShadow" x="0" y="0" width="100%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="900" height="47" fill="#ebebeb" filter="url(#headerShadow)"/>
  <line x1="0" y1="47" x2="900" y2="47" stroke="#d5d5d5" stroke-width="1"/>
  <text x="20" y="30" font-family="Cantarell, sans-serif" font-size="16" fill="#2e3436">&#x2190;</text>
  <text x="450" y="30" font-family="Cantarell, sans-serif" font-size="14" font-weight="bold" fill="#2e3436" text-anchor="middle">Session Detail</text>

  <!-- Section label -->
  <text x="450" y="78" font-family="Cantarell, sans-serif" font-size="12" font-weight="bold" fill="#929595" text-anchor="middle" letter-spacing="1">PROPOSAL A — HIG BURST EXPANDER (COLLAPSED)</text>

  <g transform="translate(32, 94)">

    <!-- === User message === -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="836" height="56" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="0" y="8" width="3" height="40" rx="1.5" fill="#3584e4"/>
      <text x="16" y="22" font-family="Cantarell, sans-serif" font-size="11" font-weight="bold" fill="#3584e4">You</text>
      <text x="16" y="40" font-family="Cantarell, sans-serif" font-size="13" fill="#2e3436">Read the config and fix the parsing bug in session_sources.rs</text>
    </g>

    <!-- === Assistant message === -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="836" height="56" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="0" y="8" width="3" height="40" rx="1.5" fill="#26a269"/>
      <text x="16" y="22" font-family="Cantarell, sans-serif" font-size="11" font-weight="bold" fill="#26a269">Assistant</text>
      <text x="16" y="40" font-family="Cantarell, sans-serif" font-size="13" fill="#2e3436">I'll examine the configuration and source files, then fix the bug.</text>
    </g>

    <!-- === COLLAPSED BURST — GtkExpander === -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="836" height="52" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="0" y="8" width="3" height="36" rx="1.5" fill="#e66100"/>

      <!-- Disclosure triangle (collapsed = right) -->
      <polygon points="18,18 28,26 18,34" fill="#929595"/>

      <!-- Type pills -->
      <rect x="40" y="15" width="66" height="22" rx="11" fill="#e8f0fe"/>
      <text x="52" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#3584e4">3 Read</text>

      <rect x="114" y="15" width="56" height="22" rx="11" fill="#fef3e0"/>
      <text x="124" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#e66100">1 Edit</text>

      <rect x="178" y="15" width="64" height="22" rx="11" fill="#e8f5e9"/>
      <text x="189" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#26a269">1 Bash</text>

      <rect x="250" y="15" width="60" height="22" rx="11" fill="#e8f0fe"/>
      <text x="261" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#3584e4">1 Grep</text>

      <!-- Duration -->
      <text x="720" y="30" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="end">2.8s</text>

      <!-- Count -->
      <rect x="730" y="15" width="90" height="22" rx="11" fill="rgba(0,0,0,0.04)"/>
      <text x="775" y="30" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="middle">6 tool calls</text>
    </g>

    <!-- === Isolated single tool call (NOT grouped) === -->
    <g transform="translate(0, 208)">
      <rect x="0" y="0" width="836" height="40" rx="6" ry="6" fill="rgba(255,255,255,0.6)" filter="url(#cardShadow)"/>
      <rect x="0" y="6" width="2" height="28" rx="1" fill="#e66100"/>
      <text x="14" y="26" font-family="monospace" font-size="12" font-weight="600" fill="#e66100">Bash</text>
      <text x="68" y="26" font-family="monospace" font-size="12" fill="#929595">$ cargo clippy --all</text>
      <text x="700" y="26" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="770" y="26" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">1.2s</text>
      <text x="808" y="26" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>

    <!-- === Assistant message after === -->
    <g transform="translate(0, 264)">
      <rect x="0" y="0" width="836" height="56" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="0" y="8" width="3" height="40" rx="1.5" fill="#26a269"/>
      <text x="16" y="22" font-family="Cantarell, sans-serif" font-size="11" font-weight="bold" fill="#26a269">Assistant</text>
      <text x="16" y="40" font-family="Cantarell, sans-serif" font-size="13" fill="#2e3436">Fixed the bug. The parser now handles null `started_at` fields correctly.</text>
    </g>
  </g>

  <!-- ===== EXPANDED STATE ===== -->
  <text x="450" y="480" font-family="Cantarell, sans-serif" font-size="12" font-weight="bold" fill="#929595" text-anchor="middle" letter-spacing="1">SAME BURST — EXPANDED</text>

  <g transform="translate(32, 500)">
    <rect x="0" y="0" width="836" height="350" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect x="0" y="8" width="3" height="334" rx="1.5" fill="#e66100"/>

    <!-- Disclosure triangle (expanded = down) -->
    <polygon points="16,20 28,20 22,30" fill="#e66100"/>

    <!-- Type pills (same as collapsed) -->
    <rect x="40" y="13" width="66" height="22" rx="11" fill="#e8f0fe"/>
    <text x="52" y="28" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#3584e4">3 Read</text>

    <rect x="114" y="13" width="56" height="22" rx="11" fill="#fef3e0"/>
    <text x="124" y="28" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#e66100">1 Edit</text>

    <rect x="178" y="13" width="64" height="22" rx="11" fill="#e8f5e9"/>
    <text x="189" y="28" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#26a269">1 Bash</text>

    <rect x="250" y="13" width="60" height="22" rx="11" fill="#e8f0fe"/>
    <text x="261" y="28" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#3584e4">1 Grep</text>

    <text x="720" y="28" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="end">2.8s</text>
    <rect x="730" y="13" width="90" height="22" rx="11" fill="rgba(0,0,0,0.04)"/>
    <text x="775" y="28" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="middle">6 tool calls</text>

    <!-- Separator -->
    <line x1="16" y1="44" x2="820" y2="44" stroke="#e8e8e8" stroke-width="1"/>

    <!-- Row 1: Read -->
    <g transform="translate(20, 54)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#3584e4">Read</text>
      <text x="60" y="14" font-family="Cantarell, sans-serif" font-size="12" fill="#555">src/config.rs:1-50</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">0.3s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
    <line x1="20" y1="76" x2="800" y2="76" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Row 2: Read -->
    <g transform="translate(20, 84)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#3584e4">Read</text>
      <text x="60" y="14" font-family="Cantarell, sans-serif" font-size="12" fill="#555">src/session_sources.rs:120-180</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">0.4s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
    <line x1="20" y1="106" x2="800" y2="106" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Row 3: Grep -->
    <g transform="translate(20, 114)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#3584e4">Grep</text>
      <text x="60" y="14" font-family="Cantarell, sans-serif" font-size="12" fill="#555">pattern="started_at" &#x2192; 4 matches</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">0.1s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
    <line x1="20" y1="136" x2="800" y2="136" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Row 4: Read -->
    <g transform="translate(20, 144)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#3584e4">Read</text>
      <text x="60" y="14" font-family="Cantarell, sans-serif" font-size="12" fill="#555">src/parsers/claude.rs:45-90</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">0.5s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
    <line x1="20" y1="166" x2="800" y2="166" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Row 5: Edit -->
    <g transform="translate(20, 174)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#e66100">Edit</text>
      <text x="60" y="14" font-family="Cantarell, sans-serif" font-size="12" fill="#555">src/session_sources.rs +3 &#x2212;1</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">0.2s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
    <line x1="20" y1="196" x2="800" y2="196" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Row 6: Bash -->
    <g transform="translate(20, 204)">
      <text x="0" y="14" font-family="monospace" font-size="12" font-weight="600" fill="#26a269">Bash</text>
      <text x="60" y="14" font-family="monospace" font-size="12" fill="#555">$ cargo test --all</text>
      <text x="680" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#26a269">completed</text>
      <text x="750" y="14" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">1.3s</text>
      <text x="790" y="14" font-family="Cantarell, sans-serif" font-size="14" fill="#c0c0c0">&#x2398;</text>
    </g>
  </g>

  <!-- ===== BURST WITH ERROR ===== -->
  <text x="450" y="900" font-family="Cantarell, sans-serif" font-size="12" font-weight="bold" fill="#929595" text-anchor="middle" letter-spacing="1">BURST WITH ERROR (COLLAPSED)</text>

  <g transform="translate(32, 916)">
    <rect x="0" y="0" width="836" height="52" rx="8" ry="8" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect x="0" y="8" width="3" height="36" rx="1.5" fill="#e66100"/>

    <polygon points="18,18 28,26 18,34" fill="#929595"/>

    <rect x="40" y="15" width="56" height="22" rx="11" fill="#fef3e0"/>
    <text x="50" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#e66100">1 Edit</text>

    <rect x="104" y="15" width="64" height="22" rx="11" fill="#e8f5e9"/>
    <text x="115" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#26a269">1 Bash</text>

    <!-- Error indicator -->
    <circle cx="184" cy="26" r="5" fill="#e01b24"/>
    <text x="196" y="30" font-family="Cantarell, sans-serif" font-size="11" font-weight="600" fill="#e01b24">1 error</text>

    <text x="720" y="30" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="end">4.1s</text>
    <rect x="730" y="15" width="90" height="22" rx="11" fill="rgba(0,0,0,0.04)"/>
    <text x="775" y="30" font-family="Cantarell, sans-serif" font-size="11" fill="#929595" text-anchor="middle">2 tool calls</text>
  </g>

  <!-- Legend -->
  <g transform="translate(32, 1000)">
    <text x="0" y="16" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">
      Widget: GtkExpander  |  &#x25B8; Click/Space/Enter to expand  |  &#x25BE; to collapse  |  Pills colored by tool category
    </text>
    <text x="0" y="36" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">
      Blue: Read/Grep/Glob  |  Orange: Edit/Write  |  Green: Bash/Shell  |  Red dot: errors in burst
    </text>
    <text x="0" y="56" font-family="Cantarell, sans-serif" font-size="11" fill="#929595">
      Single tool calls between messages remain ungrouped (unchanged from current behavior)
    </text>
  </g>
</svg>