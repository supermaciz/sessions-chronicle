<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" font-family="Cantarell, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1280" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="900" height="47" fill="#ebebeb"/>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Session Detail</text>
  <line x1="0" y1="47" x2="900" y2="47" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Title -->
  <text x="32" y="82" font-size="12" fill="#888" font-weight="600" letter-spacing="0.5">PROPOSAL 2: ACTIVITY STRIP</text>
  <text x="32" y="106" font-size="11" fill="#999">Replace tool call rows with a colored timeline strip -- each segment is one tool call, width = duration</text>

  <!-- ===== COLLAPSED VIEW (primary) ===== -->
  <text x="32" y="140" font-size="11" fill="#666" font-weight="600" letter-spacing="0.5">DEFAULT VIEW -- STRIPS INLINE WITH CONVERSATION</text>

  <!-- User message -->
  <g filter="url(#shadow)">
    <rect x="32" y="156" width="836" height="72" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="32" y="156" width="3" height="72" rx="1.5" fill="#3584e4"/>
  </g>
  <text x="48" y="176" font-size="11" font-weight="600" fill="#3584e4">User</text>
  <text x="82" y="176" font-size="11" fill="#999">· 10:14:32</text>
  <text x="48" y="198" font-size="13" fill="#333">Fix the parser regression in the OpenCode JSONL handler. The timestamp</text>
  <text x="48" y="214" font-size="13" fill="#333">field is sometimes missing and we crash instead of skipping the entry.</text>

  <!-- Assistant message -->
  <g filter="url(#shadow)">
    <rect x="32" y="240" width="836" height="52" rx="8" fill="rgba(255,255,255,0.85)"/>
    <rect x="32" y="240" width="3" height="52" rx="1.5" fill="#26a269"/>
  </g>
  <text x="48" y="260" font-size="11" font-weight="600" fill="#26a269">Assistant</text>
  <text x="102" y="260" font-size="11" fill="#999">· claude-sonnet-4-5-20250514 · 10:14:33</text>
  <text x="48" y="282" font-size="13" fill="#333">I'll investigate the parser and fix the crash. Let me read the relevant files.</text>

  <!-- ★ ACTIVITY STRIP -->
  <g filter="url(#shadow-sm)">
    <rect x="32" y="304" width="836" height="56" rx="8" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Summary line -->
  <text x="48" y="322" font-size="11" fill="#777">8 tool calls</text>
  <text x="120" y="322" font-size="11" fill="#aaa">·</text>
  <text x="130" y="322" font-size="11" fill="#3584e4">4 Read</text>
  <text x="178" y="322" font-size="11" fill="#3584e4">1 Grep</text>
  <text x="222" y="322" font-size="11" fill="#e66100">2 Edit</text>
  <text x="268" y="322" font-size="11" fill="#26a269">1 Bash</text>
  <text x="830" y="322" font-size="11" fill="#999" text-anchor="end">4.7s</text>

  <!-- The strip itself - segments proportional to duration -->
  <!-- Total: 4.7s. Read1=0.2s(4%), Read2=0.1s(2%), Read3=0.3s(6%), Read4=0.1s(2%), Grep=0.4s(9%), Edit1=0.8s(17%), Edit2=0.5s(11%), Bash=2.3s(49%) -->
  <!-- Strip area: x=48 to x=852, total width=804px -->

  <!-- Read 1: 0.2s -> ~34px -->
  <rect x="48" y="332" width="34" height="20" rx="3" fill="rgba(53,132,228,0.7)"/>

  <!-- Read 2: 0.1s -> ~17px -->
  <rect x="84" y="332" width="17" height="20" rx="3" fill="rgba(53,132,228,0.6)"/>

  <!-- Read 3: 0.3s -> ~51px -->
  <rect x="103" y="332" width="51" height="20" rx="3" fill="rgba(53,132,228,0.7)"/>

  <!-- Read 4: 0.1s -> ~17px -->
  <rect x="156" y="332" width="17" height="20" rx="3" fill="rgba(53,132,228,0.6)"/>

  <!-- Grep: 0.4s -> ~68px -->
