  <text x="102" y="392" font-size="11" fill="#999">· claude-sonnet-4-5-20250514 · 10:14:41</text>
  <text x="48" y="414" font-size="13" fill="#333">I've fixed the parser regression. The issue was a missing .unwrap_or_default() on the</text>
  <text x="48" y="430" font-size="13" fill="#333">timestamp field. I also added a test to prevent future regressions.</text>

