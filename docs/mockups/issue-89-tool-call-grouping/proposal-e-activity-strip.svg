  <!-- Grep has a slightly different shade to distinguish from Read -->

  <!-- Edit 1: 0.8s -> ~137px -->
  <rect x="245" y="332" width="137" height="20" rx="3" fill="rgba(230,97,0,0.6)"/>

  <!-- Edit 2: 0.5s -> ~85px -->
  <rect x="384" y="332" width="85" height="20" rx="3" fill="rgba(230,97,0,0.5)"/>

  <!-- Bash: 2.3s -> ~393px -->
  <rect x="471" y="332" width="381" height="20" rx="3" fill="rgba(38,162,105,0.6)"/>

  <!-- Expand affordance (small text link) -->
  <text x="830" y="352" font-size="10" fill="#888" text-anchor="end" font-style="italic">expand rows</text>

  <!-- Next assistant message -->
  <g filter="url(#shadow)">
