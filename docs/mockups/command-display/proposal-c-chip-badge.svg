<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="32" y="30" font-size="15" font-weight="600" fill="#1e1e1e" opacity="0.6">PROPOSAL C — Floating Chip / Badge (Créative)</text>
  <text x="32" y="50" font-size="12" fill="#888888">Commandes comme badges flottants entre les messages, style notification compacte</text>

  <!-- ===== HEADERBAR ===== -->
  <rect y="64" width="900" height="47" fill="#303030" rx="12"/>
  <rect y="76" width="900" height="35" fill="#303030"/>
  <circle cx="24" cy="87" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="87" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="87" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="450" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sessions Chronicle</text>

  <!-- ===== Message 1: Normal user ===== -->
  <g transform="translate(32, 127)">
    <rect width="836" height="64" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="64" rx="1.5" fill="#3584e4"/>
    <text x="18" y="22" class="role-label" fill="#3584e4">USER</text>
    <text x="18" y="46" class="msg-text">Can you help me learn Rust?</text>
  </g>

  <!-- ===== Floating chip: /learn-rust ===== -->
  <g transform="translate(350, 198)">
    <!-- Centered pill -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#986a44" opacity="0.1" stroke="#986a44" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="20" font-size="13" fill="#986a44">⌘</text>
    <text x="32" y="20" class="mono" font-size="12" font-weight="600" fill="#986a44">/learn-rust</text>
    <text x="130" y="20" class="mono" font-size="12" fill="#986a44" opacity="0.7">PATH B</text>
  </g>

  <!-- ===== Message 2: Assistant ===== -->
  <g transform="translate(32, 240)">
    <rect width="836" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="72" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="50" class="msg-text">Great choice! Let's explore PATH B — Ownership and Borrowing…</text>
  </g>

  <!-- ===== Floating chip: /model ===== -->
  <g transform="translate(350, 319)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#986a44" opacity="0.1" stroke="#986a44" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="20" font-size="13" fill="#986a44">⌘</text>
    <text x="32" y="20" class="mono" font-size="12" font-weight="600" fill="#986a44">/model opus</text>
    <text x="130" y="20" font-size="11" fill="#888888">→ Set model to opus</text>
  </g>

  <!-- ===== Floating chip: /brainstorming (with tooltip hint) ===== -->
  <g transform="translate(250, 360)">
    <rect x="0" y="0" width="400" height="30" rx="15" fill="#986a44" opacity="0.1" stroke="#986a44" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="20" font-size="13" fill="#986a44">⌘</text>
    <text x="32" y="20" class="mono" font-size="12" font-weight="600" fill="#986a44">/superpowers-extended-cc:brainstorming</text>
    <!-- Hover hint -->
    <text x="386" y="20" font-size="11" fill="#aaaaaa">…</text>
  </g>

  <!-- Tooltip mockup (shown on hover) -->
  <g transform="translate(420, 394)">
    <rect x="0" y="0" width="320" height="80" rx="8" fill="#2d2d2d" filter="url(#cardShadow)"/>
    <!-- Arrow -->
    <polygon points="40,-8 48,0 32,0" fill="#2d2d2d"/>
    <text x="14" y="22" font-size="11" fill="#d0d0d0" font-family="Cantarell, sans-serif" font-weight="600">Arguments:</text>
    <text x="14" y="40" font-size="11" fill="#a0a0a0" font-family="Cantarell, sans-serif">Je veux créer un design plan pour</text>
    <text x="14" y="56" font-size="11" fill="#a0a0a0" font-family="Cantarell, sans-serif">les analytics…</text>
  </g>

  <!-- ===== Message 3: Assistant ===== -->
  <g transform="translate(32, 490)">
    <rect width="836" height="64" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="64" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="46" class="msg-text">Let me start by exploring the project context…</text>
  </g>

  <!-- Annotation -->
  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#999999">Badges centrés flottants entre les messages · Résultat inline pour commandes simples</text>
  <text x="450" y="597" text-anchor="middle" font-size="11" fill="#999999">Tooltip au survol pour les args longs · Visuellement léger, ne prend pas de hauteur</text>
</svg>
