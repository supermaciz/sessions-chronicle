<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="500" fill="#fafafa" rx="16"/>

  <!-- Title -->
  <text x="20" y="30" font-size="15" font-weight="600" fill="#1e1e1e" opacity="0.6">IMPACT SUR LA VUE LISTE — Commande comme premier message</text>
  <text x="20" y="50" font-size="12" fill="#888888">Quand une session démarre par /brainstorming, le titre doit refléter la commande</text>

  <!-- ===== BEFORE (Current) ===== -->
  <text x="20" y="82" font-size="12" font-weight="600" fill="#e04040">AVANT (tags XML bruts)</text>

  <g transform="translate(20, 92)">
    <rect width="320" height="70" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="35" r="14" fill="#e66100" opacity="0.15"/>
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#e66100">✦</text>
    <text x="55" y="26" font-size="13" font-weight="500" fill="#1e1e1e">&lt;command-message&gt;brainstorming</text>
    <text x="55" y="42" font-size="11" fill="#1e1e1e">&lt;/command-message&gt;&lt;command-name&gt;</text>
    <text x="55" y="58" font-size="11" fill="#888888">sessions-chronicle · 12 msg · 2h</text>
  </g>

  <!-- ===== AFTER (Proposal) ===== -->
  <text x="380" y="82" font-size="12" font-weight="600" fill="#26a269">APRÈS (commande parsée)</text>

  <g transform="translate(380, 92)">
    <rect width="320" height="70" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="35" r="14" fill="#e66100" opacity="0.15"/>
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#e66100">✦</text>
    <!-- Command as code chip in title -->
    <rect x="53" y="12" width="190" height="22" rx="6" fill="#f0f0f0"/>
    <text x="61" y="28" class="mono" font-size="12" fill="#613583">/brainstorming</text>
    <text x="55" y="58" font-size="11" fill="#888888">sessions-chronicle · 12 msg · 2h</text>
  </g>

  <!-- ===== More examples ===== -->
  <text x="20" y="195" font-size="12" font-weight="600" fill="#636363">Exemples supplémentaires dans la liste</text>

  <!-- Row: command with args as title -->
  <g transform="translate(20, 210)">
    <rect width="680" height="70" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="35" r="14" fill="#e66100" opacity="0.15"/>
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#e66100">✦</text>
    <rect x="53" y="12" width="170" height="22" rx="6" fill="#f0f0f0"/>
    <text x="61" y="28" class="mono" font-size="12" fill="#613583">/learn-rust PATH B</text>
    <text x="55" y="58" font-size="11" fill="#888888">sessions-chronicle · 5 messages · 4d ago</text>
    <text x="660" y="40" text-anchor="end" font-size="16" fill="#cccccc">›</text>
  </g>

  <!-- Row: normal prompt title (unchanged) -->
  <g transform="translate(20, 290)">
    <rect width="680" height="70" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="35" r="14" fill="#e66100" opacity="0.15"/>
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#e66100">✦</text>
    <text x="55" y="28" font-size="13" font-weight="500" fill="#1e1e1e">Fix the authentication bug in the login flow</text>
    <text x="55" y="58" font-size="11" fill="#888888">my-webapp · 3 messages · 1w ago</text>
    <text x="660" y="40" text-anchor="end" font-size="16" fill="#cccccc">›</text>
  </g>

  <!-- Row: /model command as first msg -->
  <g transform="translate(20, 370)">
    <rect width="680" height="70" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="30" cy="35" r="14" fill="#e66100" opacity="0.15"/>
    <text x="30" y="40" text-anchor="middle" font-size="14" fill="#e66100">✦</text>
    <rect x="53" y="12" width="130" height="22" rx="6" fill="#f0f0f0"/>
    <text x="61" y="28" class="mono" font-size="12" fill="#613583">/model opus</text>
    <text x="55" y="58" font-size="11" fill="#888888">sessions-chronicle · 8 messages · 3h ago</text>
    <text x="660" y="40" text-anchor="end" font-size="16" fill="#cccccc">›</text>
  </g>

  <!-- Annotation -->
  <text x="360" y="475" text-anchor="middle" font-size="11" fill="#999999">Le parsing des commandes affecte aussi les titres de session dans la vue liste</text>
  <text x="360" y="492" text-anchor="middle" font-size="11" fill="#999999">Même logique d'extraction : strip tags → /command args → afficher en monospace</text>
</svg>
