<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="insetShadow" x="-1%" y="-1%" width="102%" height="104%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="32" y="30" font-size="15" font-weight="600" fill="#1e1e1e" opacity="0.6">PROPOSAL D — Terminal Strip (Créative)</text>
  <text x="32" y="50" font-size="12" fill="#888888">Commandes dans un mini-terminal sombre inline, rappelant l'origine CLI</text>

  <!-- ===== HEADERBAR ===== -->
  <rect y="64" width="900" height="47" fill="#303030" rx="12"/>
  <rect y="76" width="900" height="35" fill="#303030"/>
  <circle cx="24" cy="87" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="87" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="87" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="450" y="93" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sessions Chronicle</text>

  <!-- ===== Message 1: Normal user ===== -->
  <g transform="translate(32, 127)">
    <rect width="836" height="64" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="64" rx="1.5" fill="#3584e4"/>
    <text x="18" y="22" class="role-label" fill="#3584e4">USER</text>
    <text x="18" y="46" class="msg-text">Can you help me learn Rust?</text>
  </g>

  <!-- ===== Terminal strip: /learn-rust ===== -->
  <g transform="translate(32, 203)">
    <rect width="836" height="40" rx="8" fill="#2d2d2d" filter="url(#insetShadow)"/>
    <!-- Prompt char -->
    <text x="14" y="26" class="mono" font-size="13" fill="#26a269">❯</text>
    <!-- Command -->
    <text x="30" y="26" class="mono" font-size="13" fill="#e8e8e8" font-weight="600">/learn-rust</text>
    <!-- Args -->
    <text x="130" y="26" class="mono" font-size="13" fill="#a0a0a0">PATH B</text>
  </g>

  <!-- ===== Message 2: Assistant ===== -->
  <g transform="translate(32, 257)">
    <rect width="836" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="72" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="50" class="msg-text">Great choice! Let's explore PATH B — Ownership and Borrowing…</text>
  </g>

  <!-- ===== Terminal strip: /model with result ===== -->
  <g transform="translate(32, 343)">
    <rect width="836" height="62" rx="8" fill="#2d2d2d" filter="url(#insetShadow)"/>
    <!-- Prompt + command -->
    <text x="14" y="24" class="mono" font-size="13" fill="#26a269">❯</text>
    <text x="30" y="24" class="mono" font-size="13" fill="#e8e8e8" font-weight="600">/model</text>
    <text x="80" y="24" class="mono" font-size="13" fill="#a0a0a0">opus</text>
    <!-- Result line -->
    <text x="14" y="48" class="mono" font-size="12" fill="#888888">Set model to opus (claude-opus-4-6)</text>
  </g>

  <!-- ===== Terminal strip: /brainstorming with args ===== -->
  <g transform="translate(32, 419)">
    <rect width="836" height="84" rx="8" fill="#2d2d2d" filter="url(#insetShadow)"/>
    <!-- Prompt + command -->
    <text x="14" y="24" class="mono" font-size="13" fill="#26a269">❯</text>
    <text x="30" y="24" class="mono" font-size="13" fill="#e8e8e8" font-weight="600">/superpowers-extended-cc:brainstorming</text>
    <!-- Args -->
    <text x="30" y="46" class="mono" font-size="12" fill="#a0a0a0">Je veux créer un design plan pour les analytics</text>
    <text x="30" y="64" class="mono" font-size="12" fill="#a0a0a0">docs/plans/2026-03-02-basic-analytics-exploration.md proposition A</text>
  </g>

  <!-- ===== Message 3: Assistant ===== -->
  <g transform="translate(32, 517)">
    <rect width="836" height="64" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="64" rx="1.5" fill="#26a269"/>
    <text x="18" y="22" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="46" class="msg-text">Let me start by exploring the project context…</text>
  </g>

  <!-- Annotation -->
  <text x="450" y="610" text-anchor="middle" font-size="11" fill="#999999">Mini-terminal sombre entre les messages · Prompt ❯ vert · Commande blanche · Args gris</text>
  <text x="450" y="627" text-anchor="middle" font-size="11" fill="#999999">Résultat stdout sur ligne suivante · Rappel visuel fort de l'origine CLI</text>
</svg>
