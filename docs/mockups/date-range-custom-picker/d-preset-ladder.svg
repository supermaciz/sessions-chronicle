<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="-apple-system, 'Cantarell', system-ui, sans-serif" font-size="13">
  <style>
    .stroke { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
    .stroke-thin { fill: none; stroke: #1a1a1a; stroke-width: 1; }
    .muted { fill: #777; }
    .accent { fill: #3584e4; }
    .accent-stroke { fill: none; stroke: #3584e4; stroke-width: 1.6; }
    .accent-bg { fill: #3584e4; fill-opacity: 0.12; }
    .red { fill: #c01c28; }
    .red-stroke { fill: none; stroke: #c01c28; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .red-solid { fill: none; stroke: #c01c28; stroke-width: 1.4; }
    .green { fill: #26a269; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .badge { font-size: 11px; fill: #555; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 11px; fill: #c01c28; font-style: italic; }
    .ws { fill: #ffffff; }
  </style>

  <text x="20" y="28" class="title">Proposal D &#8212; Delete the picker: a preset ladder that reaches the whole archive</text>
  <text x="20" y="46" class="muted" font-size="12">No calendar, no drawing area, no endpoint state machine &#183; one GtkListBox, 260&#8239;px, every row carries a count</text>

  <!-- pill -->
  <rect x="40" y="72" width="112" height="28" rx="14" class="accent-bg accent-stroke"/>
  <rect x="54" y="80" width="12" height="12" rx="2" class="accent-stroke"/>
  <line x1="54" y1="84" x2="66" y2="84" class="accent-stroke"/>
  <text x="74" y="91" class="accent" font-size="12">2025</text>

  <!-- popover -->
  <path d="M 90 112 L 97 104 L 104 112 Z" fill="#ffffff" class="stroke"/>
  <rect x="40" y="112" width="260" height="392" rx="8" fill="#ffffff" class="stroke"/>
  <rect x="54" y="136" width="232" height="354" rx="8" class="stroke-thin"/>

  <g font-size="12">
    <text x="66" y="158">Any time</text><text x="274" y="158" text-anchor="end" class="badge">1284</text>
    <line x1="54" y1="170" x2="286" y2="170" stroke="#e4e4e4"/>
    <text x="66" y="188">Today</text><text x="274" y="188" text-anchor="end" class="badge">12</text>
    <line x1="54" y1="200" x2="286" y2="200" stroke="#e4e4e4"/>
    <text x="66" y="218">Yesterday</text><text x="274" y="218" text-anchor="end" class="badge">8</text>
    <line x1="54" y1="230" x2="286" y2="230" stroke="#e4e4e4"/>
    <text x="66" y="248">Last 7 days</text><text x="274" y="248" text-anchor="end" class="badge">64</text>
    <line x1="54" y1="260" x2="286" y2="260" stroke="#e4e4e4"/>
    <text x="66" y="278">Last 30 days</text><text x="274" y="278" text-anchor="end" class="badge">210</text>
    <line x1="54" y1="290" x2="286" y2="290" stroke="#e4e4e4"/>
    <text x="66" y="308" class="accent">Last 90 days</text><text x="274" y="308" text-anchor="end" class="badge">388</text>
    <line x1="54" y1="320" x2="286" y2="320" stroke="#e4e4e4"/>
    <text x="66" y="338" class="accent">Last 6 months</text><text x="274" y="338" text-anchor="end" class="badge">640</text>

    <line x1="54" y1="352" x2="286" y2="352" stroke="#bbb" stroke-width="1.2"/>
    <text x="66" y="370" class="muted" font-size="10" letter-spacing="0.5">YEARS WITH SESSIONS</text>

    <text x="66" y="396">2026</text><text x="274" y="396" text-anchor="end" class="badge">900</text>
    <line x1="54" y1="408" x2="286" y2="408" stroke="#e4e4e4"/>
    <rect x="56" y="414" width="228" height="26" class="accent-bg"/>
    <text x="66" y="432" fill="#1a4a8c" font-weight="500">2025</text><text x="274" y="432" text-anchor="end" class="badge" fill="#1a4a8c">328</text>
    <line x1="54" y1="446" x2="286" y2="446" stroke="#e4e4e4"/>
    <text x="66" y="464">2024</text><text x="274" y="464" text-anchor="end" class="badge">56</text>
  </g>

  <line x1="40" y1="522" x2="300" y2="522" class="red-solid"/>
  <line x1="40" y1="516" x2="40" y2="528" class="red-solid"/>
  <line x1="300" y1="516" x2="300" y2="528" class="red-solid"/>
  <text x="170" y="542" text-anchor="middle" class="note">260&#8239;px in every state &#8212; there is no other state</text>

  <!-- what disappears -->
  <text x="352" y="90" class="title" font-size="13">What this deletes from <tspan font-family="monospace" font-size="12">src/ui/date_pill.rs</tspan></text>
  <g font-size="11.5" fill="#1a1a1a">
    <text x="352" y="118">&#215;  <tspan class="red">from_calendar</tspan> / <tspan class="red">to_calendar</tspan> and their <tspan font-family="monospace" font-size="11">day_selected</tspan> handlers</text>
    <text x="352" y="140">&#215;  <tspan class="red">GtkRevealer</tspan>, <tspan class="red">custom_revealed</tspan>, <tspan class="red">draft_from</tspan>, <tspan class="red">draft_to</tspan></text>
    <text x="352" y="162">&#215;  <tspan class="red">info_label</tspan>, <tspan class="red">apply_button</tspan>, <tspan class="red">clear_button</tspan> and their sensitivity sync</text>
    <text x="352" y="184">&#215;  4 of the 9 <tspan font-family="monospace" font-size="11">DatePillInput</tspan> variants</text>
    <text x="352" y="206">&#215;  <tspan font-family="monospace" font-size="11">valid_custom_filter</tspan>, <tspan font-family="monospace" font-size="11">custom_info_text</tspan>, <tspan font-family="monospace" font-size="11">calendar_to_naive_date</tspan></text>
    <text x="352" y="228">&#215;  the year-less <tspan font-family="monospace" font-size="11">pill_label()</tspan> ambiguity &#8212; no free-form range, no bug</text>
    <text x="352" y="256" class="green">+  one enum variant per year with data, counts from the existing scan</text>
  </g>

  <line x1="352" y1="286" x2="1160" y2="286" stroke="#ddd"/>

  <text x="352" y="312" class="title" font-size="13">Coverage &#8212; what a user actually asks for</text>
  <g font-size="11.5">
    <text x="352" y="338">&#8220;this week&#8221; / &#8220;yesterday&#8221;</text>
    <text x="700" y="338" class="green">&#10003; already a preset</text>
    <text x="352" y="360">&#8220;the last couple of months&#8221;</text>
    <text x="700" y="360" class="green">&#10003; Last 90 days &#183; Last 6 months</text>
    <text x="352" y="382">&#8220;everything from last year&#8221;</text>
    <text x="700" y="382" class="green">&#10003; 2025</text>
    <text x="352" y="404">&#8220;that stretch in spring when I rewrote the parsers&#8221;</text>
    <text x="700" y="404" class="red">&#10007; not expressible &#8212; and the calendar</text>
    <text x="700" y="420" class="red">didn&#8217;t help you find it either</text>
    <text x="352" y="442">&#8220;3 Mar to 17 May, exactly&#8221;</text>
    <text x="700" y="442" class="red">&#10007; gone. This is the whole bet.</text>
  </g>

  <path d="M 700 450 Q 660 458 622 466" class="red-stroke"/>
  <text x="352" y="488" class="note">The bet: an exact free-form range is a spreadsheet gesture, not a browsing gesture.</text>
  <text x="352" y="504" class="note">If your own habit says otherwise, D is wrong and A/B/C are the argument.</text>
</svg>
