  <text x="20" y="934" class="note">&#9312; No range shading anywhere, deliberately. GtkCalendar has no range selection; mark_day() marks a day NUMBER, so shading 1&#8211;12 lights up the 1st&#8211;12th of every</text>
  <text x="20" y="952" class="note">&#8195; month you page to. The range lives in the echo line, where it is true.</text>
  <text x="20" y="970" class="note">&#9313; Two calendars never showed the range either &#8212; two independent day pickers with a validation string underneath, cosplaying as a range widget.</text>
  <text x="20" y="988" class="note">&#9314; Widgets: 2 &#215; (GtkCalendar + 42 day cells) &#8594; 1. Surfaces: still one popover. GtkRevealer &#8594; GtkStack (slide-left): the popover never grows sideways,</text>
  <text x="20" y="1006" class="note">&#8195; it only gets 100 px taller, once.</text>
  <text x="20" y="1024" class="note">&#9315; Keyboard: Ctrl+Shift+D opens &#183; &#8593;&#8595; presets &#183; Enter on &#8220;Custom range&#8230;&#8221; slides to page 2 with focus on the calendar grid &#183; &#8592;&#8594;&#8593;&#8595; move the day,</text>
  <text x="20" y="1042" class="note">&#8195; Enter commits it to the active endpoint and auto-advances From &#8594; To &#183; Tab reaches the endpoint toggle, Clear, Apply &#183; Escape returns to page 1, Escape again closes.</text>
  <text x="20" y="1060" class="note">&#9316; Mouse: click an endpoint button to pick which end you are editing, click a day to write it. Same two clicks as today, one grid to aim at.</text>
  <text x="20" y="1078" class="note">&#9317; Files: src/ui/date_pill.rs only. DatePillWidgets drops to_calendar, gains a GtkStack (interpolate-size) + an AdwToggleGroup (libadwaita 1.7+, already on v1_9). DateFilter::Custom is untouched.</text>
