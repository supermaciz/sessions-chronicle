<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <defs>
    <style>
      text { font-family: Cantarell, system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="340" rx="12" fill="#fafafa"/>

  <!-- === ROW 1: Clean completion, code-heavy session === -->
  <g transform="translate(0, 0)">
    <!-- Row background -->
    <rect x="8" y="8" width="684" height="96" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>

    <!-- Tool icon placeholder (Claude Code) -->
    <rect x="24" y="36" width="20" height="20" rx="4" fill="#3584e4" opacity="0.15"/>
    <text x="34" y="50" text-anchor="middle" font-size="11" fill="#3584e4" font-weight="600">C</text>

    <!-- Title: first user prompt -->
    <text x="56" y="40" font-size="14" font-weight="500" fill="#1e1e1e">Refactor the database module to use connection pooling</text>

    <!-- Subtitle line: project + duration + message count -->
    <text x="56" y="58" font-size="11.5" fill="#77767b">
      <tspan>sessions-chronicle</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">42 min</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">38 messages</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">2h ago</tspan>
    </text>

    <!-- Outcome line: activity summary chips -->
    <g transform="translate(56, 68)">
      <!-- Files edited chip -->
      <rect x="0" y="0" width="82" height="20" rx="10" fill="#2ec27e" opacity="0.12"/>
      <text x="10" y="14" font-size="10.5" fill="#2ec27e" font-weight="500">8 files edited</text>

      <!-- Commands run chip -->
      <rect x="90" y="0" width="90" height="20" rx="10" fill="#3584e4" opacity="0.12"/>
      <text x="100" y="14" font-size="10.5" fill="#3584e4" font-weight="500">5 commands</text>

      <!-- Clean end indicator -->
      <circle cx="200" cy="10" r="4" fill="#2ec27e"/>
    </g>

    <!-- Chevron -->
    <text x="672" y="52" text-anchor="end" font-size="14" fill="#b0b0b0">&#x203A;</text>
  </g>

  <!-- === ROW 2: Abrupt ending, exploration session === -->
  <g transform="translate(0, 112)">
    <rect x="8" y="8" width="684" height="96" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>

    <!-- Tool icon (OpenCode) -->
    <rect x="24" y="36" width="20" height="20" rx="4" fill="#26a269" opacity="0.15"/>
    <text x="34" y="50" text-anchor="middle" font-size="11" fill="#26a269" font-weight="600">O</text>

    <!-- Title -->
    <text x="56" y="40" font-size="14" font-weight="500" fill="#1e1e1e">Why is the auth middleware returning 403 for admin users?</text>

    <!-- Subtitle -->
    <text x="56" y="58" font-size="11.5" fill="#77767b">
      <tspan>web-backend</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">7 min</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">12 messages</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">5d ago</tspan>
    </text>

    <!-- Outcome line -->
    <g transform="translate(56, 68)">
      <!-- Files read chip -->
      <rect x="0" y="0" width="76" height="20" rx="10" fill="#77767b" opacity="0.1"/>
      <text x="10" y="14" font-size="10.5" fill="#77767b" font-weight="500">14 files read</text>

      <!-- Abrupt end indicator (warning) -->
      <circle cx="96" cy="10" r="4" fill="#e5a50a"/>
    </g>

    <!-- Chevron -->
    <text x="672" y="52" text-anchor="end" font-size="14" fill="#b0b0b0">&#x203A;</text>
  </g>

  <!-- === ROW 3: Error ending, short session === -->
  <g transform="translate(0, 224)">
    <rect x="8" y="8" width="684" height="96" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>

    <!-- Tool icon (Codex) -->
    <rect x="24" y="36" width="20" height="20" rx="4" fill="#e66100" opacity="0.15"/>
    <text x="34" y="50" text-anchor="middle" font-size="11" fill="#e66100" font-weight="600">X</text>

    <!-- Title -->
    <text x="56" y="40" font-size="14" font-weight="500" fill="#1e1e1e">Add unit tests for the payment processing module</text>

    <!-- Subtitle -->
    <text x="56" y="58" font-size="11.5" fill="#77767b">
      <tspan>billing-service</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">2 min</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">4 messages</tspan>
      <tspan dx="4" fill="#b0b0b0">·</tspan>
      <tspan dx="4">2026-03-15</tspan>
    </text>

    <!-- Outcome line -->
    <g transform="translate(56, 68)">
      <!-- Error chip -->
      <rect x="0" y="0" width="86" height="20" rx="10" fill="#c01c28" opacity="0.1"/>
      <text x="10" y="14" font-size="10.5" fill="#c01c28" font-weight="500">1 file edited</text>

      <!-- Error end indicator -->
      <circle cx="106" cy="10" r="4" fill="#c01c28"/>
    </g>

    <!-- Chevron -->
    <text x="672" y="52" text-anchor="end" font-size="14" fill="#b0b0b0">&#x203A;</text>
  </g>

  <!-- Legend -->
  <g transform="translate(440, 310)">
    <circle cx="0" cy="6" r="4" fill="#2ec27e"/>
    <text x="10" y="10" font-size="9.5" fill="#77767b">Clean end</text>
    <circle cx="80" cy="6" r="4" fill="#e5a50a"/>
    <text x="90" y="10" font-size="9.5" fill="#77767b">Abrupt</text>
    <circle cx="140" cy="6" r="4" fill="#c01c28"/>
    <text x="150" y="10" font-size="9.5" fill="#77767b">Error</text>
  </g>
</svg>