<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&amp;display=swap');
      text { font-family: 'Cantarell', 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="290" rx="12" fill="#fafafa"/>

  <!-- Title -->
  <text x="24" y="28" font-size="11" font-weight="700" fill="#77767b" letter-spacing="0.5">PROPOSAL D: TWO-WEIGHT ROWS</text>

  <!-- Row 1: Clean end, long session, file edits -->
  <g transform="translate(12, 40)">
    <rect x="0" y="0" width="676" height="72" rx="10" fill="#ffffff"/>
    <!-- Tool icon (Claude Code) -->
    <rect x="16" y="28" width="16" height="16" rx="4" fill="#3584e4" opacity="0.8"/>
    <text x="20" y="39" font-size="7" fill="#ffffff" font-weight="700" text-anchor="middle">C</text>

    <!-- Line 1: Title + relative time -->
    <text x="44" y="28" font-size="14" font-weight="700" fill="#1e1e1e">Fix the flaky parser test in session_sources</text>
    <text x="652" y="28" font-size="11.5" fill="#77767b" text-anchor="end">2d ago</text>

    <!-- Line 2: Project + duration + activity ... ending signal -->
    <text x="44" y="50" font-size="11.5" fill="#77767b">my-project  &#x00B7;  45m  &#x00B7;  8 files edited</text>
    <text x="652" y="50" font-size="10.5" fill="#2ec27e" text-anchor="end" opacity="0.85">completed</text>

    <!-- Chevron -->
    <text x="668" y="40" font-size="14" fill="#77767b" opacity="0.4">&#x203A;</text>
  </g>

  <!-- Row 2: Abrupt end, medium session, commands run -->
  <g transform="translate(12, 120)">
    <rect x="0" y="0" width="676" height="72" rx="10" fill="#ffffff"/>
    <!-- Tool icon (OpenCode) -->
    <rect x="16" y="28" width="16" height="16" rx="4" fill="#26a269" opacity="0.8"/>
    <text x="20" y="39" font-size="7" fill="#ffffff" font-weight="700" text-anchor="middle">O</text>

    <!-- Line 1 -->
    <text x="44" y="28" font-size="14" font-weight="700" fill="#1e1e1e">Investigate failing CI pipeline on staging branch</text>
    <text x="652" y="28" font-size="11.5" fill="#77767b" text-anchor="end">5h ago</text>

    <!-- Line 2 -->
    <text x="44" y="50" font-size="11.5" fill="#77767b">infra-tools  &#x00B7;  12m  &#x00B7;  3 commands run</text>
    <text x="652" y="50" font-size="10.5" fill="#e5a50a" text-anchor="end" opacity="0.85">interrupted</text>

    <!-- Chevron -->
    <text x="668" y="40" font-size="14" fill="#77767b" opacity="0.4">&#x203A;</text>
  </g>

  <!-- Row 3: Short session, no tool calls, indeterminate ending -->
  <g transform="translate(12, 200)">
    <rect x="0" y="0" width="676" height="72" rx="10" fill="#ffffff"/>
    <!-- Tool icon (Codex) -->
    <rect x="16" y="28" width="16" height="16" rx="4" fill="#e66100" opacity="0.8"/>
    <text x="20" y="39" font-size="7" fill="#ffffff" font-weight="700" text-anchor="middle">X</text>

    <!-- Line 1 -->
    <text x="44" y="28" font-size="14" font-weight="700" fill="#1e1e1e">Read the config file and explain the build structure</text>
    <text x="652" y="28" font-size="11.5" fill="#77767b" text-anchor="end">1d ago</text>

    <!-- Line 2: no ending signal when indeterminate -->
    <text x="44" y="50" font-size="11.5" fill="#77767b">web-frontend  &#x00B7;  2m  &#x00B7;  4 messages</text>

    <!-- Chevron -->
    <text x="668" y="40" font-size="14" fill="#77767b" opacity="0.4">&#x203A;</text>
  </g>
</svg>