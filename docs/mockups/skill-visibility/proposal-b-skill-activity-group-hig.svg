<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
      .chip { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
      .section-title { font-size: 13px; font-weight: 700; fill: #555555; letter-spacing: 1px; }
      .dim { font-size: 11px; fill: #999999; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="980" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="32" y="28" font-size="15" font-weight="600" fill="#1e1e1e" opacity="0.6">PROPOSAL B — Skill Activity Group (GNOME HIG)</text>
  <text x="32" y="46" font-size="12" fill="#888888">Related skill events grouped into a single collapsible block with summary header</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 1: TRANSCRIPT — COLLAPSED STATE                -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="76" class="section-title">TRANSCRIPT — COLLAPSED (DEFAULT)</text>
  <line x1="32" y1="82" x2="888" y2="82" stroke="#dddddd" stroke-width="1"/>

  <!-- Headerbar -->
  <rect y="94" width="920" height="47" fill="#303030" rx="12"/>
  <rect y="106" width="920" height="35" fill="#303030"/>
  <circle cx="24" cy="117" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="117" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="117" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="460" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sessions Chronicle</text>

  <!-- Row 1: Normal user message -->
  <g transform="translate(32, 157)">
    <rect width="856" height="58" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="58" rx="1.5" fill="#3584e4"/>
    <text x="18" y="20" class="role-label" fill="#3584e4">USER</text>
    <text x="18" y="42" class="msg-text">I want to explore the heatmap width issue</text>
  </g>

  <!-- Row 2: SKILL ACTIVITY GROUP — collapsed -->
  <g transform="translate(32, 227)">
    <!-- Group container with subtle background -->
    <rect width="856" height="56" rx="10" fill="#faf6f1" stroke="#e8ddd0" stroke-width="1"/>
    <rect width="4" height="56" rx="2" fill="#986a44"/>

    <!-- Collapse chevron -->
    <text x="16" y="35" font-size="14" fill="#986a44">&#9654;</text>

    <!-- Skill icon -->
    <rect x="36" y="14" width="28" height="28" rx="7" fill="#986a44" opacity="0.15"/>
    <text x="50" y="33" text-anchor="middle" font-size="14" fill="#986a44">&#9881;</text>

    <!-- Skill name and source -->
    <text x="74" y="26" font-size="14" font-weight="700" fill="#1e1e1e">brainstorming</text>
    <text x="180" y="26" font-size="12" fill="#888888">superpowers-extended-cc</text>

    <!-- Args preview -->
    <text x="74" y="44" font-size="12" fill="#888888">heatmap width limit exploration…</text>

    <!-- Right side: event count + time -->
    <text x="726" y="26" class="dim">3 events</text>
    <text x="726" y="44" class="dim">14:32:05</text>

    <!-- Expand hint icon -->
    <rect x="806" y="16" width="36" height="24" rx="6" fill="#986a44" opacity="0.08"/>
    <text x="814" y="33" font-size="12" fill="#986a44">&#8942;</text>
  </g>

  <!-- Row 3: Assistant response -->
  <g transform="translate(32, 295)">
    <rect width="856" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="72" rx="1.5" fill="#26a269"/>
    <text x="18" y="20" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="46" class="msg-text">I'll use the brainstorming skill to explore the heatmap width limit…</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 2: TRANSCRIPT — EXPANDED STATE                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="402" class="section-title">TRANSCRIPT — EXPANDED</text>
  <line x1="32" y1="408" x2="888" y2="408" stroke="#dddddd" stroke-width="1"/>

  <!-- Skill Activity Group — expanded -->
  <g transform="translate(32, 420)">
    <!-- Expanded group container -->
    <rect width="856" height="244" rx="10" fill="#faf6f1" stroke="#e8ddd0" stroke-width="1"/>
    <rect width="4" height="244" rx="2" fill="#986a44"/>

    <!-- Expanded chevron -->
    <text x="16" y="35" font-size="14" fill="#986a44">&#9660;</text>

    <!-- Skill icon + name -->
    <rect x="36" y="14" width="28" height="28" rx="7" fill="#986a44" opacity="0.15"/>
    <text x="50" y="33" text-anchor="middle" font-size="14" fill="#986a44">&#9881;</text>
    <text x="74" y="26" font-size="14" font-weight="700" fill="#1e1e1e">brainstorming</text>
    <text x="180" y="26" font-size="12" fill="#888888">superpowers-extended-cc</text>
    <text x="74" y="44" font-size="12" fill="#888888">heatmap width limit exploration…</text>

    <!-- Separator -->
    <line x1="20" y1="58" x2="836" y2="58" stroke="#e0d6ca" stroke-width="1"/>

    <!-- Event 1: Command invocation -->
    <g transform="translate(20, 68)">
      <circle cx="8" cy="10" r="4" fill="#986a44" opacity="0.5"/>
      <text x="22" y="14" font-size="12" font-weight="600" fill="#986a44">/brainstorming</text>
      <text x="138" y="14" font-size="12" fill="#888888">heatmap width limit exploration…</text>
      <text x="748" y="14" class="dim">14:32:05</text>
    </g>

    <!-- Event 2: Skill content loaded -->
    <g transform="translate(20, 96)">
      <circle cx="8" cy="10" r="4" fill="#e5a50a" opacity="0.5"/>
      <text x="22" y="14" font-size="12" fill="#636363">Skill content loaded</text>
      <text x="148" y="14" class="dim">(2.4 KB)</text>
      <!-- Show full button -->
      <rect x="206" y="0" width="72" height="20" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
      <text x="218" y="14" font-size="11" fill="#986a44">Show full</text>
      <rect x="282" y="0" width="50" height="20" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
      <text x="292" y="14" font-size="11" fill="#986a44">Copy</text>
      <text x="748" y="14" class="dim">14:32:05</text>
    </g>

    <!-- Event 3: System reminder -->
    <g transform="translate(20, 124)">
      <circle cx="8" cy="10" r="4" fill="#8070a0" opacity="0.5"/>
      <text x="22" y="14" font-size="12" fill="#636363">System reminder</text>
      <text x="126" y="14" class="dim">skill checklist + available skills (4.1 KB)</text>
      <rect x="376" y="0" width="72" height="20" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
      <text x="388" y="14" font-size="11" fill="#8070a0">Show full</text>
      <text x="748" y="14" class="dim">14:32:05</text>
    </g>

    <!-- Event 4: Skill tool call -->
    <g transform="translate(20, 152)">
      <circle cx="8" cy="10" r="4" fill="#26a269" opacity="0.5"/>
      <text x="22" y="14" font-size="12" fill="#636363">Skill tool call</text>
      <text x="116" y="14" class="dim">&#8594; brainstorming loaded in 42ms</text>
      <rect x="346" y="0" width="52" height="20" rx="6" fill="#26a269" opacity="0.12"/>
      <text x="356" y="14" class="chip" fill="#26a269">loaded</text>
      <text x="748" y="14" class="dim">14:32:06</text>
    </g>

    <!-- Separator -->
    <line x1="20" y1="178" x2="836" y2="178" stroke="#e0d6ca" stroke-width="1"/>

    <!-- OpenCode variant note -->
    <g transform="translate(20, 190)">
      <rect width="816" height="42" rx="6" fill="#ffffff" opacity="0.5"/>
      <text x="12" y="16" font-size="11" font-weight="600" fill="#888888">OPENCODE VARIANT</text>
      <text x="12" y="34" font-size="11" fill="#888888">Same grouping — skill content detected via heading pattern (# Skill Name) in first user message</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 3: SESSION LIST WITH SKILL CHIPS               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="700" class="section-title">SESSION LIST — SKILL CHIPS</text>
  <line x1="32" y1="706" x2="888" y2="706" stroke="#dddddd" stroke-width="1"/>

  <!-- Session row 1 -->
  <g transform="translate(32, 718)">
    <rect width="856" height="68" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#1e1e1e">Heatmap width limit exploration</text>
    <text x="16" y="42" class="dim">sessions-chronicle · 14:32 · 24 messages</text>
    <!-- Skill chips -->
    <rect x="16" y="48" width="88" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="25" y="60" class="chip" fill="#986a44">brainstorming</text>
    <rect x="112" y="48" width="82" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="121" y="60" class="chip" fill="#986a44">writing-plans</text>
  </g>

  <!-- Session row 2 -->
  <g transform="translate(32, 798)">
    <rect width="856" height="68" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#1e1e1e">Fix analytics dashboard rendering bug</text>
    <text x="16" y="42" class="dim">sessions-chronicle · 11:05 · 42 messages</text>
    <rect x="16" y="48" width="68" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="25" y="60" class="chip" fill="#986a44">debugging</text>
    <rect x="92" y="48" width="30" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="101" y="60" class="chip" fill="#986a44">TDD</text>
  </g>

  <!-- Session row 3: OpenCode session with skill -->
  <g transform="translate(32, 878)">
    <rect width="856" height="68" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="16" y="24" font-size="14" font-weight="600" fill="#1e1e1e">Executing plans: heatmap width limit</text>
    <text x="16" y="42" class="dim">sessions-chronicle · OpenCode · 10:22 · 18 messages</text>
    <rect x="16" y="48" width="96" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="25" y="60" class="chip" fill="#986a44">executing-plans</text>
  </g>

  <!-- Annotation -->
  <text x="460" y="968" text-anchor="middle" font-size="11" fill="#999999">All skill events grouped into one collapsible block · Collapsed by default · Expand to see timeline</text>
</svg>
