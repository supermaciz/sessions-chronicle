<svg xmlns="http://www.w3.org/2000/svg" width="920" height="980" viewBox="0 0 920 980">
  <defs>
    <style>
      text { font-family: Cantarell, sans-serif; }
      .mono { font-family: Source Code Pro, monospace; }
      .msg-text { font-size: 13px; fill: #1e1e1e; }
      .role-label { font-size: 11px; fill: #636363; font-weight: 700; letter-spacing: 0.5px; }
      .chip { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
      .section-title { font-size: 13px; font-weight: 700; fill: #555555; letter-spacing: 1px; }
      .dim { font-size: 11px; fill: #999999; }
    </style>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="skillGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#986a44" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#986a44" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="skillHeaderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#986a44" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#986a44" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="980" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="32" y="28" font-size="15" font-weight="600" fill="#1e1e1e" opacity="0.6">PROPOSAL C — Skill Cards with Progressive Disclosure (Creative)</text>
  <text x="32" y="46" font-size="12" fill="#888888">Skill invocations as visually distinct cards with header, content zone, and expandable payload</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 1: TRANSCRIPT WITH SKILL CARDS                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="76" class="section-title">TRANSCRIPT VIEW</text>
  <line x1="32" y1="82" x2="888" y2="82" stroke="#dddddd" stroke-width="1"/>

  <!-- Headerbar -->
  <rect y="94" width="920" height="47" fill="#303030" rx="12"/>
  <rect y="106" width="920" height="35" fill="#303030"/>
  <circle cx="24" cy="117" r="7" fill="#e04040" opacity="0.85"/>
  <circle cx="46" cy="117" r="7" fill="#e8a828" opacity="0.85"/>
  <circle cx="68" cy="117" r="7" fill="#2eb840" opacity="0.85"/>
  <text x="460" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sessions Chronicle</text>

  <!-- Row 1: Normal user message -->
  <g transform="translate(32, 157)">
    <rect width="856" height="58" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="58" rx="1.5" fill="#3584e4"/>
    <text x="18" y="20" class="role-label" fill="#3584e4">USER</text>
    <text x="18" y="42" class="msg-text">I want to explore the heatmap width issue</text>
  </g>

  <!-- ===== SKILL CARD ===== -->
  <g transform="translate(32, 227)">
    <!-- Card outer container -->
    <rect width="856" height="160" rx="12" fill="url(#skillGradient)" stroke="#e0d0c0" stroke-width="1.5"/>

    <!-- Card header band -->
    <rect width="856" height="46" rx="12" fill="url(#skillHeaderGrad)"/>
    <rect y="34" width="856" height="12" fill="url(#skillHeaderGrad)"/>

    <!-- Left accent bar (full height) -->
    <rect width="4" height="160" rx="2" fill="#986a44"/>

    <!-- Skill icon (larger, prominent) -->
    <rect x="16" y="8" width="30" height="30" rx="8" fill="#986a44" opacity="0.2"/>
    <text x="31" y="29" text-anchor="middle" font-size="16" fill="#986a44">&#9881;</text>

    <!-- Skill name + source -->
    <text x="58" y="22" font-size="15" font-weight="700" fill="#5c3d1e">brainstorming</text>
    <text x="58" y="38" font-size="11" fill="#986a44">superpowers-extended-cc · 14:32:05</text>

    <!-- Status pill on right -->
    <rect x="760" y="11" width="78" height="24" rx="12" fill="#26a269" opacity="0.12"/>
    <text x="776" y="28" font-size="11" font-weight="600" fill="#26a269">&#10003; loaded</text>

    <!-- Content area -->
    <!-- User's args / prompt -->
    <text x="20" y="66" font-size="12" font-weight="600" fill="#636363">Prompt</text>
    <g transform="translate(20, 74)">
      <rect width="816" height="36" rx="6" fill="#ffffff" opacity="0.6"/>
      <text x="10" y="16" font-size="12" fill="#1e1e1e">heatmap width limit exploration</text>
      <text x="10" y="30" font-size="12" fill="#888888">docs/plans/2026-03-09-heatmap-width-limit-exploration.md proposition A</text>
    </g>

    <!-- Collapsed payload indicator -->
    <g transform="translate(20, 120)">
      <rect width="816" height="30" rx="6" fill="#f4f0ec" opacity="0.6"/>
      <text x="10" y="12" font-size="12" fill="#986a44">&#9654;</text>
      <text x="28" y="12" font-size="11" fill="#8a7560">Skill definition (2.4 KB) + system reminders (4.1 KB)</text>
      <rect x="332" y="0" width="72" height="20" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
      <text x="344" y="14" font-size="11" fill="#986a44">Show full</text>
      <rect x="410" y="0" width="50" height="20" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
      <text x="422" y="14" font-size="11" fill="#986a44">Copy</text>
    </g>
  </g>

  <!-- Row 3: Assistant response -->
  <g transform="translate(32, 399)">
    <rect width="856" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <rect width="3" height="72" rx="1.5" fill="#26a269"/>
    <text x="18" y="20" class="role-label" fill="#26a269">ASSISTANT</text>
    <text x="18" y="46" class="msg-text">I'll use the brainstorming skill to explore the heatmap width limit…</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 2: OPENCODE VARIANT                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="506" class="section-title">OPENCODE VARIANT — SAME CARD, DIFFERENT SOURCE</text>
  <line x1="32" y1="512" x2="888" y2="512" stroke="#dddddd" stroke-width="1"/>

  <g transform="translate(32, 524)">
    <!-- Card outer container -->
    <rect width="856" height="110" rx="12" fill="url(#skillGradient)" stroke="#e0d0c0" stroke-width="1.5"/>

    <!-- Card header band -->
    <rect width="856" height="46" rx="12" fill="url(#skillHeaderGrad)"/>
    <rect y="34" width="856" height="12" fill="url(#skillHeaderGrad)"/>

    <!-- Left accent -->
    <rect width="4" height="110" rx="2" fill="#986a44"/>

    <!-- Skill icon -->
    <rect x="16" y="8" width="30" height="30" rx="8" fill="#986a44" opacity="0.2"/>
    <text x="31" y="29" text-anchor="middle" font-size="16" fill="#986a44">&#9881;</text>

    <!-- Skill name + source -->
    <text x="58" y="22" font-size="15" font-weight="700" fill="#5c3d1e">executing-plans</text>
    <text x="58" y="38" font-size="11" fill="#986a44">OpenCode · skill via UI · 10:22:14</text>

    <!-- Content area: collapsed payload -->
    <g transform="translate(20, 56)">
      <rect width="816" height="40" rx="6" fill="#f4f0ec" opacity="0.6"/>
      <text x="10" y="16" font-size="12" fill="#986a44">&#9654;</text>
      <text x="28" y="16" font-size="11" fill="#8a7560">Skill definition: # Executing Plans (2.4 KB)</text>
      <text x="28" y="32" font-size="11" fill="#8a7560">Detected from first user message heading pattern</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECTION 3: SESSION LIST — ICON BADGES                  -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <text x="32" y="670" class="section-title">SESSION LIST — SKILL ICON BADGES</text>
  <line x1="32" y1="676" x2="888" y2="676" stroke="#dddddd" stroke-width="1"/>

  <!-- Session row 1: with skill icons -->
  <g transform="translate(32, 688)">
    <rect width="856" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>

    <!-- Skill icon badge (left of title) -->
    <rect x="12" y="10" width="28" height="28" rx="7" fill="#986a44" opacity="0.12"/>
    <text x="26" y="29" text-anchor="middle" font-size="14" fill="#986a44">&#9881;</text>

    <!-- Title -->
    <text x="50" y="26" font-size="14" font-weight="600" fill="#1e1e1e">Heatmap width limit exploration</text>

    <!-- Subtitle -->
    <text x="50" y="44" class="dim">sessions-chronicle · 14:32 · 24 messages</text>

    <!-- Skill chips in subtitle line -->
    <rect x="50" y="50" width="88" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="59" y="62" class="chip" fill="#986a44">brainstorming</text>
    <rect x="146" y="50" width="82" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="155" y="62" class="chip" fill="#986a44">writing-plans</text>
  </g>

  <!-- Session row 2 -->
  <g transform="translate(32, 772)">
    <rect width="856" height="72" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>

    <rect x="12" y="10" width="28" height="28" rx="7" fill="#986a44" opacity="0.12"/>
    <text x="26" y="29" text-anchor="middle" font-size="14" fill="#986a44">&#9881;</text>

    <text x="50" y="26" font-size="14" font-weight="600" fill="#1e1e1e">Fix analytics dashboard rendering bug</text>
    <text x="50" y="44" class="dim">sessions-chronicle · 11:05 · 42 messages</text>

    <rect x="50" y="50" width="68" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="59" y="62" class="chip" fill="#986a44">debugging</text>
    <rect x="126" y="50" width="30" height="16" rx="8" fill="#986a44" opacity="0.12"/>
    <text x="135" y="62" class="chip" fill="#986a44">TDD</text>
  </g>

  <!-- Session row 3: no skills (no icon badge) -->
  <g transform="translate(32, 856)">
    <rect width="856" height="52" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="16" y="26" font-size="14" font-weight="600" fill="#1e1e1e">Help me refactor this code</text>
    <text x="16" y="44" class="dim">my-project · 09:20 · 8 messages</text>
  </g>

  <!-- Session row 4: OpenCode with skill -->
  <g transform="translate(32, 920)">
    <rect width="856" height="48" rx="10" fill="#ffffff" filter="url(#cardShadow)"/>

    <rect x="12" y="10" width="28" height="28" rx="7" fill="#986a44" opacity="0.12"/>
    <text x="26" y="29" text-anchor="middle" font-size="14" fill="#986a44">&#9881;</text>

    <text x="50" y="26" font-size="14" font-weight="600" fill="#1e1e1e">Executing plans: heatmap width limit</text>
    <text x="50" y="42" class="dim">sessions-chronicle · OpenCode · 10:22</text>
  </g>

  <!-- Annotation -->
  <text x="460" y="978" text-anchor="middle" font-size="11" fill="#999999">Skill card absorbs command + injection + tool call · Gradient header · Progressive disclosure · Icon badge in list</text>
</svg>
