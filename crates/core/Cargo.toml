[package]
name = "sessions-chronicle-core"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
walkdir = "2.5.0"
zstd = "0.13.3"

[dev-dependencies]
rusqlite = { version = "0.40.0", features = ["bundled"] }
tempfile = "3.27.0"
