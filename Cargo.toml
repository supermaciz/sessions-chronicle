[package]
name = "sessions-chronicle"
version = "0.4.11"
authors = ["Mathieu Cizo <maciz@outlook.fr>"]
edition = "2024"
publish = false
license = "MIT"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
relm4 = { version = "0.10.0", features = ["libadwaita", "gnome_48"] }
relm4-icons = { git = "https://github.com/Relm4/icons", rev = "647a5fadad8eb5b5e66ecef329770ab4597c5e4d" }
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_8"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
rusqlite = { version = "0.39.0", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
which = "8.0.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
regex = "1"
similar = "3.1.0"
sourceview5 = "0.10"

[build-dependencies]
relm4-icons-build = { git = "https://github.com/Relm4/icons", rev = "647a5fadad8eb5b5e66ecef329770ab4597c5e4d" }

[dev-dependencies]
tempfile = "3.27.0"
