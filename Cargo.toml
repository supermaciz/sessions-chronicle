[package]
name = "sessions-chronicle"
version = "0.8.0"
authors = ["Mathieu Cizo <maciz@outlook.fr>"]
edition = "2024"
publish = false
license = "MIT"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_50"] }
relm4-icons = "0.11.0"
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_9"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
walkdir = "2.5.0"
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
rusqlite = { version = "0.40.0", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
which = "8.0.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
regex = "1"
similar = "3.1.1"
sourceview5 = "0.11.0"
zstd = "0.13.3"

[build-dependencies]
relm4-icons-build = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
